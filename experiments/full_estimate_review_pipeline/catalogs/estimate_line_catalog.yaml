        unit: "м2"
        line_kind: normal
        current_calculator_status: returned_by_waterproofing_calculator
        quantity:
          formula: "eps100_wall_insulation_area_m2 from project when present, else eps100_wall_volume_m3 / eps100_wall_thickness_m"
          leaf_inputs:
            - ref: "review_parameters.eps100_wall_insulation_area_m2"
              source_class: AUTO_PROJECT
              optional: true
            - ref: "review_parameters.eps100_wall_volume_m3"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.waterproofing.defaults.eps100_wall_thickness_m"
              source_class: DEFAULT
        prices:
          material_unit_price_key: null
          work_unit_price_key: "eps100_wall_insulation_work_unit_price"
