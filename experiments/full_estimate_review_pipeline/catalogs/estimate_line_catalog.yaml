    source_refs:
      - "experiments/full_estimate_review_pipeline/sections/waterproofing/section_contract.yaml"
      - "experiments/waterproofing_calculator/waterproofing_calculator.py"
      - "experiments/waterproofing_calculator/README.md"
      - "experiments/full_estimate_review_pipeline/reports/step_16_waterproofing_extraction_crosscheck.md"
    calculator_estimate_line_count: 8
    formula_ready_row_count: 8
    lines:
      waterproofing_bitumen_mastic_work:
        code: "waterproofing_bitumen_mastic_work"
        row_id: "waterproofing.waterproofing_bitumen_mastic_work"
        name_ru: "Гидроизоляция фундаментной плиты битумной мастикой в 2 слоя"
        unit: "м2"
        line_kind: normal
        current_calculator_status: returned_by_waterproofing_calculator
        quantity:
          formula: "waterproofing_area_m2"
          leaf_inputs:
            - ref: "review_parameters.waterproofing_area_m2"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: "waterproofing_work_unit_price"
          fixed_amount_key: null
          price_registry_code: "bitumen_waterproofing_work_m2"
        zero_policy: not_expected
        notes: "Production source is the reviewed specification area. If no direct PDF row exists, parser may reuse foundation slab side formwork area with needs_review."

      bitumen_primer_aquamast_18l:
        code: "bitumen_primer_aquamast_18l"
        row_id: "waterproofing.bitumen_primer_aquamast_18l"
        name_ru: "Праймер битумный AquaMast, 18 л"
        unit: "шт"
        line_kind: normal
        current_calculator_status: returned_by_waterproofing_calculator
        quantity:
          formula: "ceil(waterproofing_area_m2 * primer_consumption_l_per_m2 / primer_canister_volume_l)"
          leaf_inputs:
            - ref: "review_parameters.waterproofing_area_m2"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.waterproofing.defaults.primer_consumption_l_per_m2"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.waterproofing.defaults.primer_canister_volume_l"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "primer_unit_price"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "bitumen_primer_aquamast_18l_item"
        zero_policy: not_expected
        notes: "Purchase units are calculated from area, consumption, and canister volume. Unit price is PRICE, not a default."

      bitumen_mastic_aquamast_18kg:
        code: "bitumen_mastic_aquamast_18kg"
        row_id: "waterproofing.bitumen_mastic_aquamast_18kg"
        name_ru: "Мастика гидроизоляционная битумная для фундаментов AquaMast, 18 кг"
        unit: "шт"
        line_kind: normal
        current_calculator_status: returned_by_waterproofing_calculator
        quantity:
          formula: "ceil(waterproofing_area_m2 * mastic_consumption_kg_per_m2_per_layer * mastic_layers / mastic_bucket_weight_kg)"
          leaf_inputs:
            - ref: "review_parameters.waterproofing_area_m2"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.waterproofing.defaults.mastic_consumption_kg_per_m2_per_layer"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.waterproofing.defaults.mastic_layers"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.waterproofing.defaults.mastic_bucket_weight_kg"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "mastic_unit_price"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "bitumen_mastic_aquamast_18kg_item"
        zero_policy: not_expected
        notes: "Mastic layers are a method default; do not copy bucket counts from a project screenshot."

