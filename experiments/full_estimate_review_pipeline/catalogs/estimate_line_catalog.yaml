      - "docs/report_paid_floor_slab_1_calculator_changes.md"
      - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    calculator_estimate_line_count: 28
    formula_ready_row_count: null
    lines:
      slab_formwork_installation_control:
        code: "slab_formwork_installation_control"
        row_id: "floor_slab_1.slab_formwork_installation_control"
        name_ru: "Монтаж опалубки под монолитное перекрытие 1-го этажа"
        unit: "м2"
        line_kind: control
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "main_formwork_area_m2"
          leaf_inputs:
            - ref: "review_parameters.main_formwork_area_m2"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: null
        zero_policy: allowed
        notes: "Zero/internal control row. Paid formwork rental is formwork_set_rental_material."

      formwork_set_rental_material:
        code: "formwork_set_rental_material"
        row_id: "floor_slab_1.formwork_set_rental_material"
        name_ru: "Комплект опалубки (телескопические стойки, унивилки, треноги, водостойкая фанера, поперечные и продольные балки двутавровые)"
        unit: "м2"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "main_formwork_area_m2"
          leaf_inputs:
            - ref: "review_parameters.main_formwork_area_m2"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: "formwork_rate_per_m2"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "formwork_rental_m2"
        zero_policy: not_expected
        notes: "Production uses direct_section_rate; old supplier quote context with slab 2 area is legacy only."

      formwork_delivery_return_manipulator:
        code: "formwork_delivery_return_manipulator"
        row_id: "floor_slab_1.formwork_delivery_return_manipulator"
        name_ru: "Доставка, вывоз опалубки манипулятором"
        unit: "маш"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "2 if main_formwork_area_m2 <= formwork_delivery_threshold_m2 else 4"
          leaf_inputs:
            - ref: "review_parameters.main_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.formwork_delivery_threshold_m2"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.formwork_delivery_trips_at_or_below_threshold"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.formwork_delivery_trips_above_threshold"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "formwork_delivery_rate_per_trip"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "formwork_delivery_truck"
        zero_policy: not_expected
        notes: "Production mode is area_threshold. Manual override is an explicit exception, not the normal path."

      formwork_rebar_crane_supply:
        code: "formwork_rebar_crane_supply"
        row_id: "floor_slab_1.formwork_rebar_crane_supply"
        name_ru: "Подача опалубки, арматуры автокраном"
        unit: "смена"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "formwork_rebar_crane_shifts"
          leaf_inputs:
            - ref: "supplier_inputs.formwork_rebar_crane_shifts"
              source_class: SUPPLIER_INPUT
        prices:
          material_unit_price_key: "crane_shift_rate"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "crane_shift"
        zero_policy: not_expected
        notes: "Manual/supplier quantity."

      formwork_consumables:
        code: "formwork_consumables"
        row_id: "floor_slab_1.formwork_consumables"
        name_ru: "Расходные материалы для установки опалубки (смазка; звездочки ПВХ, трубки)"
        unit: "-"
        line_kind: fixed_amount
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "1; amount = main_formwork_area_m2 * formwork_consumables_rate_per_m2"
          leaf_inputs:
            - ref: "review_parameters.main_formwork_area_m2"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: "formwork_consumables_rate_per_m2"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "formwork_consumables_m2"
        zero_policy: requires_review_if_zero
        notes: "Calculator displays quantity 1; total is area-based."

      edge_beam_formwork_installation_control:
        code: "edge_beam_formwork_installation_control"
        row_id: "floor_slab_1.edge_beam_formwork_installation_control"
        name_ru: "Монтаж опалубки из доски 50 мм и фанеры для устройства балок, для отбортовки плиты"
        unit: "м2"
        line_kind: control
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "edge_formwork_area_m2 + beams_formwork_area_m2"
          leaf_inputs:
            - ref: "review_parameters.edge_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.beams_formwork_area_m2"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: null
        zero_policy: allowed
        notes: "Zero/internal control row for edge and beam formwork."

      plywood_fk_18mm_for_edges_and_non_multiple_places:
        code: "plywood_fk_18mm_for_edges_and_non_multiple_places"
        row_id: "floor_slab_1.plywood_fk_18mm_for_edges_and_non_multiple_places"
        name_ru: "Фанера ФК 1,52 * 1,52 толщиной 18 мм для закрытия некратных мест и торцов"
        unit: "шт"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "ceil((edge_formwork_area_m2 + beams_formwork_area_m2) / plywood_sheet_working_area_m2 + (main_formwork_area_m2 * non_multiple_places_coeff) / plywood_sheet_working_area_m2 + reserve_plywood_sheets)"
          leaf_inputs:
            - ref: "review_parameters.main_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.edge_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.beams_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.plywood_sheet_working_area_m2"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.non_multiple_places_coeff"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.reserve_plywood_sheets"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "plywood_unit_price"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "plywood_1520x1520_18mm_sheet"
        zero_policy: not_expected
        notes: "Do not replace edge/beam formwork area with EPS or main formwork area."

      formwork_timber_gost:
        code: "formwork_timber_gost"
        row_id: "floor_slab_1.formwork_timber_gost"
        name_ru: "Пиломатериал обрезной для устройства опалубки ГОСТ"
        unit: "м3"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "(edge_formwork_area_m2 + beams_formwork_area_m2) * timber_thickness_m + (((main_formwork_area_m2 * non_multiple_places_coeff) / plywood_sheet_working_area_m2) + overhang_sheet_equivalent) * additional_timber_coeff * additional_timber_thickness_m"
          leaf_inputs:
            - ref: "review_parameters.main_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.edge_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.beams_formwork_area_m2"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.timber_thickness_m"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.non_multiple_places_coeff"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.plywood_sheet_working_area_m2"
              source_class: DEFAULT
            - ref: "supplier_inputs.overhang_sheet_equivalent"
              source_class: SUPPLIER_INPUT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.additional_timber_coeff"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.additional_timber_thickness_m"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "timber_unit_price"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "timber_m3"
        zero_policy: not_expected
        notes: "overhang_sheet_equivalent is supplier/manual until a universal formula is confirmed."

      floor_slab_rebar_frame_assembly_control:
        code: "floor_slab_rebar_frame_assembly_control"
        row_id: "floor_slab_1.floor_slab_rebar_frame_assembly_control"
        name_ru: "Изготовление и монтаж каркаса армирования монолитного перекрытия из арматуры (в том числе балок)"
        unit: "мп"
        line_kind: control
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "sum(floor_slab_1_rebar_items.order_length_m)"
          leaf_inputs:
            - ref: "review_parameters.floor_slab_1_rebar_items"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.rebar_rod_length_m"
              source_class: DEFAULT
        prices:
          material_unit_price_key: null
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: null
        zero_policy: allowed
        notes: "Control row. Paid rebar material rows are dynamic by class/diameter."

      floor_slab_1_rebar_items:
        code: "floor_slab_1_rebar_items"
        row_id: "floor_slab_1.floor_slab_1_rebar_items"
        name_ru: "Арматура плиты перекрытия 1-го этажа по диаметрам"
        unit: "мп"
        line_kind: normal
        current_calculator_status: dynamic_rows_returned_by_floor_slab_1_calculator
        quantity:
          formula: "ceil(spec_length_m * waste_coeff / rod_length_m) * rod_length_m per item"
          leaf_inputs:
            - ref: "review_parameters.floor_slab_1_rebar_items"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.rebar_rod_length_m"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "rebar_items.unit_price_per_m"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "rebar_<class>_d<diameter>_m"
        zero_policy: not_expected
        notes: "Dynamic rows generated from steel class and diameter. PDF primary unit is m.п.; unit price and rod length should be adapter/catalog-filled."

      floor_slab_concreting_work:
        code: "floor_slab_concreting_work"
        row_id: "floor_slab_1.floor_slab_concreting_work"
        name_ru: "Бетонирование монолитной плиты перекрытия бетоном марки В22,5 (М300)"
        unit: "м3"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "total_concrete_volume_from_spec_m3 - sum(beam.length_m * beam.width_m * beam.height_m * beam.count)"
          leaf_inputs:
            - ref: "review_parameters.total_concrete_volume_from_spec_m3"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.beam_items"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: "slab_concreting_work_rate_per_m3"
          fixed_amount_key: null
          price_registry_code: "concrete_placing_work_m3"
        zero_policy: not_expected
        notes: "Slab concrete work only. Beam concrete work is a separate line."

      beam_concreting_work:
        code: "beam_concreting_work"
        row_id: "floor_slab_1.beam_concreting_work"
        name_ru: "Бетонирование балки бетоном марки В22,5 (М300)"
        unit: "мп"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator_when_beams_present
        quantity:
          formula: "sum(beam.length_m * beam.count)"
          leaf_inputs:
            - ref: "review_parameters.beam_items"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: "beam_concreting_work_rate_per_m"
          fixed_amount_key: null
          price_registry_code: "beam_concrete_placing_work_m"
        zero_policy: disabled_if_zero
        notes: "Beam concreting work is priced by beam length. Beam concrete material remains on the concrete material line in m3."

      concrete_b22_5_m300_material:
        code: "concrete_b22_5_m300_material"
        row_id: "floor_slab_1.concrete_b22_5_m300_material"
        name_ru: "Бетон марки В22,5 (М300)"
        unit: "м3"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "ceil(total_concrete_volume_from_spec_m3 * concrete_waste_coeff)"
          leaf_inputs:
            - ref: "review_parameters.total_concrete_volume_from_spec_m3"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.concrete_waste_coeff"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "concrete_unit_price_per_m3"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "concrete_b22_5_m3"
        zero_policy: not_expected
        notes: "Material order uses total concrete for slab section before slab/beam work split."

      concrete_delivery:
        code: "concrete_delivery"
        row_id: "floor_slab_1.concrete_delivery"
        name_ru: "Доставка бетона до объекта"
        unit: "рейс"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "ceil(total_concrete_volume_from_spec_m3 * concrete_waste_coeff / mixer_capacity_m3)"
          leaf_inputs:
            - ref: "review_parameters.total_concrete_volume_from_spec_m3"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.concrete_waste_coeff"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.mixer_capacity_m3"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "concrete_delivery_rate_per_trip"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "concrete_delivery_trip"
        zero_policy: not_expected
        notes: ""

      concrete_pump_32m:
        code: "concrete_pump_32m"
        row_id: "floor_slab_1.concrete_pump_32m"
        name_ru: "Работа бетононасоса 32м + гаситель"
        unit: "смена"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "concrete_pump_shifts"
          leaf_inputs:
            - ref: "supplier_inputs.concrete_pump_shifts"
              source_class: SUPPLIER_INPUT
        prices:
          material_unit_price_key: "concrete_pump_rate"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "concrete_pump_32m_shift"
        zero_policy: not_expected
        notes: "Manual/supplier quantity; do not calculate from concrete volume."

      formwork_dismantling_zero_internal:
        code: "formwork_dismantling_zero_internal"
        row_id: "floor_slab_1.formwork_dismantling_zero_internal"
        name_ru: "Демонтаж опалубки после завершения бетонирования"
        unit: "м2"
        line_kind: control
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "main_formwork_area_m2"
          leaf_inputs:
            - ref: "review_parameters.main_formwork_area_m2"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: null
        zero_policy: allowed
        notes: "Zero/internal line; do not treat as paid dismantling work unless business rules change."

      edge_beam_insulation_work:
        code: "edge_beam_insulation_work"
        row_id: "floor_slab_1.edge_beam_insulation_work"
        name_ru: "Устройство утепления по наружной стороне торцов плиты, балок"
        unit: "мп"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "slab_outer_edge_eps_work_length_m + sum(beam.length_m * beam.count)"
          leaf_inputs:
            - ref: "review_parameters.slab_outer_edge_eps_work_length_m"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.beam_items"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: "edge_beam_insulation_work_rate_per_m"
          fixed_amount_key: null
          price_registry_code: "edge_insulation_work_m"
        zero_policy: not_expected
        notes: "Length of EPS work on slab edge plus beam lengths. Do not confuse with EPS volume or formwork area."

      bottom_slab_insulation_work:
        code: "bottom_slab_insulation_work"
        row_id: "floor_slab_1.bottom_slab_insulation_work"
        name_ru: "Устройство утепления низа плиты"
        unit: "м2"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "bottom_slab_eps_work_area_m2"
          leaf_inputs:
            - ref: "review_parameters.bottom_slab_eps_work_area_m2"
              source_class: AUTO_PROJECT
        prices:
          material_unit_price_key: null
          work_unit_price_key: "bottom_slab_insulation_work_rate_per_m2"
          fixed_amount_key: null
          price_registry_code: "eps_bottom_slab_insulation_work_m2"
        zero_policy: not_expected
        notes: "Work area in m2, not EPS material volume."

      eps_penoplex_osnova_100mm:
        code: "eps_penoplex_osnova_100mm"
        row_id: "floor_slab_1.eps_penoplex_osnova_100mm"
        name_ru: "Экструдированный пенополистирол Пеноплэкс Основа 100х585х1185 мм"
        unit: "м3"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "ceil(total_eps_volume_from_spec_m3 * eps_waste_coeff / eps_pack_volume_m3) * eps_pack_volume_m3"
          leaf_inputs:
            - ref: "review_parameters.total_eps_volume_from_spec_m3"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.eps_waste_coeff"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.eps_pack_volume_m3"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "eps_unit_price_per_m3"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "eps_penoplex_osnova_100_m3"
        zero_policy: not_expected
        notes: "Material volume in m3. Do not mix with m2 bottom work area or edge work length."

      eps_glue_foam:
        code: "eps_glue_foam"
        row_id: "floor_slab_1.eps_glue_foam"
        name_ru: "Клей-пена для ЭППС"
        unit: "баллон"
        line_kind: normal
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "ceil((slab_edge_eps_material_area_m2 + beam_edge_eps_material_area_m2 + bottom_slab_eps_work_area_m2) / foam_coverage_m2_per_can)"
          leaf_inputs:
            - ref: "review_parameters.slab_edge_eps_material_area_m2"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.bottom_slab_eps_work_area_m2"
              source_class: AUTO_PROJECT
            - ref: "review_parameters.beam_items"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.foam_coverage_m2_per_can"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "foam_unit_price_per_can"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "eps_foam_glue_can"
        zero_policy: not_expected
        notes: "Beam EPS material area is calculated from beam.length_m * beam.height_m * count."

      logistics_and_supply:
        code: "logistics_and_supply"
        row_id: "floor_slab_1.logistics_and_supply"
        name_ru: "Логистика, и снабжение"
        unit: "-"
        line_kind: fixed_amount
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "1; amount = base_subtotal_raw * logistics_and_supply_percent"
          leaf_inputs:
            - ref: "calculator_result.base_subtotal_raw"
              source_class: AUTO_CALCULATED
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.logistics_and_supply_percent"
              source_class: DEFAULT
        prices:
          material_unit_price_key: null
          work_unit_price_key: null
          fixed_amount_key: "logistics_and_supply_amount"
          price_registry_code: null
        zero_policy: requires_review_if_zero
        notes: "Percent overhead line calculated by calculator."

      consumables_tool_depreciation:
        code: "consumables_tool_depreciation"
        row_id: "floor_slab_1.consumables_tool_depreciation"
        name_ru: "Расходные материалы, амортизация инструмента"
        unit: "комплект"
        line_kind: fixed_amount
        current_calculator_status: returned_by_floor_slab_1_calculator
        quantity:
          formula: "1; amount = base_subtotal_raw * consumables_and_tool_percent"
          leaf_inputs:
            - ref: "calculator_result.base_subtotal_raw"
              source_class: AUTO_CALCULATED
            - ref: "defaults_catalog.sections.floor_slab_1.defaults.consumables_and_tool_percent"
              source_class: DEFAULT
        prices:
          material_unit_price_key: null
          work_unit_price_key: null
