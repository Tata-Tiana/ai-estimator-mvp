        unit: "м3"
        line_kind: normal
        current_calculator_status: returned_by_waterproofing_calculator
        quantity:
          formula: "ceil((eps100_wall_volume_m3 * eps_waste_coeff) / eps100_pack_volume_m3) * eps100_pack_volume_m3"
          leaf_inputs:
            - ref: "review_parameters.eps100_wall_volume_m3"
              source_class: AUTO_PROJECT
            - ref: "defaults_catalog.sections.waterproofing.defaults.eps_waste_coeff"
              source_class: DEFAULT
            - ref: "defaults_catalog.sections.waterproofing.defaults.eps100_pack_volume_m3"
              source_class: DEFAULT
        prices:
          material_unit_price_key: "eps100_unit_price"
          work_unit_price_key: null
          fixed_amount_key: null
          price_registry_code: "eps_geo_100_m3"
        zero_policy: not_expected
        notes: "Material quantity remains volume in m3. It must not be confused with EPS work area in m2."

