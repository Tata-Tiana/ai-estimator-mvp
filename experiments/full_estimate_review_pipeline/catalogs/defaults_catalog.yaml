      planterband_per_membrane_roll:
        value: 4.0
        unit: "pcs/roll"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "planterband_per_membrane_roll"
        used_by_estimate_lines: ["foundation_slab.planterband_material"]
        source_note: "Foundation slab section contract, Elena rule."
        confidence: confirmed_from_contract
        allow_override: true
        notes: "Planterband quantity is calculated from purchased membrane rolls."

      plywood_sheet_width_m:
        value: 1.52
        unit: "m"
        source_class: CATALOG_DEFAULT
        calculator_input_path: "plywood_sheet_width_m"
        used_by_estimate_lines: ["foundation_slab.formwork_plywood"]
