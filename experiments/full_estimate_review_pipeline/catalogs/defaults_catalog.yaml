catalog_version: 0.1
purpose: "Shared technical/default/catalog values for the full estimate pipeline. Prices and project quantities are intentionally excluded."
rules:
  no_project_quantities: true
  no_prices: true
  no_old_project_totals: true
  uncertain_values_require_status_needs_elena: true

source_classes:
  DEFAULT: "Formula default, method constant, business coefficient, or catalog/package value."
  CATALOG_DEFAULT: "Catalog/package value such as roll area, rod length, pallet volume."
  BUSINESS_DEFAULT: "Company/business assumption confirmed as a reusable default."
  METHOD_DEFAULT: "Calculator mode/default method, not a project value."

sections:
  earthworks:
    status: reference_ready
    source_refs:
      - "experiments/full_estimate_review_pipeline/sections/earthworks/section_contract.yaml"
      - "experiments/earthworks_review_to_calculator/constants.py"
      - "experiments/earthworks_calculator/earthworks_calculator.py"
      - "experiments/full_estimate_review_pipeline/reports/step_01_earthworks_reference.md"
    defaults:
      excavator_shifts_calc_method:
        value: "standard_volume_productivity"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "excavator_shifts_calc_method"
        used_by_estimate_lines: ["earthworks.excavator_jcb"]
        source_note: "Production mode from earthworks review-to-calculator constants and section contract."
        confidence: confirmed_from_code
        allow_override: false
        notes: "Controls whether excavator shifts are calculated from volume/productivity instead of a legacy manual shift count."

