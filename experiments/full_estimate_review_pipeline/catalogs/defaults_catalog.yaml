          - "foundation_slab.thermal_insert_100_installation"
          - "foundation_slab.thermal_insert_50_material"
          - "foundation_slab.thermal_insert_100_material"
        source_note: "Production mode from foundation slab section contract."
        confidence: confirmed_from_contract
        allow_override: false
        notes: "Separate 50 mm and 100 mm thermal insert work/material rows."

      rebar_calc_method:
        value: "spec_length_m"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "rebar_calc_method"
        used_by_estimate_lines:
