not_defaults:
  earthworks:
    consumables_amount:
      reason: "Fixed estimate-line amount / price key, not a formula default."
      belongs_to: "price registry / fallback / review sheet 02"
      estimate_line_code: "earthworks.consumables"
    axis_marking_work_unit_price:
      reason: "Work unit price, not a default."
      belongs_to: "price registry / fallback / review sheet 02"
      estimate_line_code: "earthworks.axis_marking"
    sand_manual_moving_work_unit_price:
      reason: "Work unit price. A missing/zero price may create a zero estimate line, but it is still PRICE, not DEFAULT."
      belongs_to: "price registry / fallback / review sheet 02"
      estimate_line_code: "earthworks.sand_manual_moving"
  foundation_slab:
