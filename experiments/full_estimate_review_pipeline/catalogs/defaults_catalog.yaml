        source_note: "Production mode from foundation slab section contract and calculator README."
        confidence: confirmed_from_contract
        allow_override: false
        notes: "PDF primary rebar unit is linear meters; adapter must not use the old weight-to-length mode for production."

      membrane_overlap_coeff:
        value: 1.10
        unit: "ratio"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "membrane_overlap_coeff"
        used_by_estimate_lines: ["foundation_slab.planter_standard_material"]
        source_note: "Foundation slab section contract."
        confidence: confirmed_from_contract
        allow_override: true
