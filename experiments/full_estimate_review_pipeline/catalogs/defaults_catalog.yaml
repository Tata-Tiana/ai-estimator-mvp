catalog_version: 0.1
purpose: "Shared technical/default/catalog values for the full estimate pipeline. Prices and project quantities are intentionally excluded."
rules:
  no_project_quantities: true
  no_prices: true
  no_old_project_totals: true
  uncertain_values_require_status_needs_elena: true

source_classes:
  DEFAULT: "Formula default, method constant, business coefficient, or catalog/package value."
  CATALOG_DEFAULT: "Catalog/package value such as roll area, rod length, pallet volume."
  BUSINESS_DEFAULT: "Company/business assumption confirmed as a reusable default."
  METHOD_DEFAULT: "Calculator mode/default method, not a project value."

sections:
  earthworks:
    status: reference_ready
    source_refs:
      - "experiments/full_estimate_review_pipeline/sections/earthworks/section_contract.yaml"
      - "experiments/earthworks_review_to_calculator/constants.py"
      - "experiments/earthworks_calculator/earthworks_calculator.py"
      - "experiments/full_estimate_review_pipeline/reports/step_01_earthworks_reference.md"
    defaults:
      excavator_shifts_calc_method:
        value: "standard_volume_productivity"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "excavator_shifts_calc_method"
        used_by_estimate_lines: ["earthworks.excavator_jcb"]
        source_note: "Production mode from earthworks review-to-calculator constants and section contract."
        confidence: confirmed_from_code
        allow_override: false
        notes: "Controls whether excavator shifts are calculated from volume/productivity instead of a legacy manual shift count."

      manual_excavation_calc_method:
        value: "standard_routes"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "manual_excavation_calc_method"
        used_by_estimate_lines: ["earthworks.manual_excavation"]
        source_note: "Production mode from earthworks review-to-calculator constants and section contract."
        confidence: confirmed_from_code
        allow_override: false
        notes: "Manual excavation is calculated from pit refinement plus trench volume in the production path."

      communications_length_calc_method:
        value: "legacy_direct_length"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "communications_length_calc_method"
        used_by_estimate_lines: ["earthworks.communications_work", "earthworks.communications_material"]
        source_note: "Section contract uses reviewed scalar communications_length_m as production source; older earthworks adapter can switch when pipe rows are the deliberate source."
        confidence: confirmed_from_contract
        allow_override: false
        notes: "Do not change to pipe_items unless the adapter explicitly makes pipe rows the reviewed source."

      excavator_productivity_m3_per_shift:
        value: 80.0
        unit: "m3/shift"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "excavator_productivity_m3_per_shift"
        used_by_estimate_lines: ["earthworks.excavator_jcb"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Technical productivity default; not extracted from PDF."

      manual_refinement_depth_m:
        value: 0.08
        unit: "m"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "manual_refinement_depth_m"
        used_by_estimate_lines: ["earthworks.manual_excavation"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Depth used for manual pit refinement: pit_area_m2 * manual_refinement_depth_m."

      trench_width_m:
        value: 0.4
        unit: "m"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "trench_width_m"
        used_by_estimate_lines: ["earthworks.manual_excavation"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Fallback trench width for calculator route fallback. Reviewed scalar trench_volume_m3 remains the production source."

      sand_compaction_coeff:
        value: 1.3
        unit: "ratio"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "sand_compaction_coeff"
        used_by_estimate_lines: ["earthworks.sand_material"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Sand order volume coefficient. Not a project quantity."

      sand_truck_step_m3:
        value: 20.0
        unit: "m3"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "sand_truck_step_m3"
        used_by_estimate_lines: ["earthworks.sand_material"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Rounding step for sand delivery/order volume."

      geotextile_overlap_coeff:
        value: 1.10
        unit: "ratio"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "geotextile_overlap_coeff"
        used_by_estimate_lines: ["earthworks.geotextile_material"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Overlap coefficient for geotextile material quantity."

      geotextile_roll_area_m2:
        value: 100.0
        unit: "m2"
        source_class: CATALOG_DEFAULT
        calculator_input_path: "geotextile_roll_area_m2"
        used_by_estimate_lines: ["earthworks.geotextile_material"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Catalog/package roll area. This is not the project geotextile area."

      axis_marking_shifts:
        value: 1.0
        unit: "shift"
        source_class: BUSINESS_DEFAULT
        calculator_input_path: "axis_marking_shifts"
        used_by_estimate_lines: ["earthworks.axis_marking"]
        source_note: "GENERIC_CALCULATOR_DEFAULTS and earthworks section contract."
        confidence: confirmed_from_code
        allow_override: true
        notes: "Default quantity for axis marking. The work unit price is PRICE and is not stored in this catalog."

  foundation_slab:
    status: draft_cataloged
    source_refs:
      - "experiments/full_estimate_review_pipeline/sections/foundation_slab/section_contract.yaml"
      - "experiments/foundation_slab_calculator/foundation_slab_calculator.py"
      - "experiments/foundation_slab_calculator/README.md"
      - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    defaults:
      formwork_calc_method:
        value: "spec_area"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "formwork_calc_method"
        used_by_estimate_lines:
          - "foundation_slab.formwork_installation"
          - "foundation_slab.formwork_plywood"
          - "foundation_slab.formwork_timber"
          - "foundation_slab.formwork_dismantling"
        source_note: "Production mode from foundation slab section contract and calculator README."
        confidence: confirmed_from_contract
        allow_override: false
        notes: "Use the PDF/spec side formwork area; do not reconstruct from perimeter and height in production."

      plywood_calc_method:
        value: "actual_area_with_waste"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "plywood_calc_method"
        used_by_estimate_lines: ["foundation_slab.formwork_plywood"]
        source_note: "Production mode from foundation slab section contract."
        confidence: confirmed_from_contract
        allow_override: false
        notes: "Plywood is calculated from the actual side formwork area, sheet dimensions, and waste coefficient."

      thermal_insert_mode:
        value: "standard_50_100"
        unit: ""
        source_class: METHOD_DEFAULT
        calculator_input_path: "thermal_insert_mode"
        used_by_estimate_lines:
