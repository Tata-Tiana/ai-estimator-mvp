# Section contract template for full_estimate_review_pipeline.
#
# Purpose:
#   Describe one estimate section end-to-end:
#   review workbook inputs -> normalized JSON -> calculator input -> calculator
#   result -> formula-ready rows -> final estimate workbook.
#
# This is a template, not a complete section.
#
# Sheet rule (fixed 2026-07-09, see HANDOFF.md "Sheet 01/02/03 rule"):
#   - ALL project data from PDF/chat extraction lives on sheet 01_Проверка проекта,
#     one row per value or per repeated-row item (e.g. one row per rebar diameter).
#     There is no separate "detail table" source class or block. A group of repeated
#     rows (rebar by diameter, trench routes, pipe items, beam items, ...) is a
#     `review_parameters` entry with `value_kind: repeated_rows` — still AUTO_PROJECT,
#     still lives on sheet 01, still the only thing the calculator adapter reads.
#   - ALL prices live on sheet 02_Цены себестоимости, one row per price key.
#   - The calculator input adapter (calculator_input_mapping below) may ONLY read from
#     review_parameters (sheet 01), price_keys (sheet 02), defaults, supplier_inputs,
#     and auto_calculated. It must never read from sheet 03.
#   - Sheet 03_Детали объемов is a read-only reference mirror: it can show the same
#     repeated-row groups again (formatted as a table, exactly as it looks in the PDF
#     specification) purely so Elena can eyeball it without opening the PDF. Mark such
#     a review_parameters entry with `mirror_to_details_sheet: true`. The mirror is
#     built FROM the sheet-01 rows by the workbook builder; it is not a second input
#     and the adapter never reads it back.

contract_version: 0.2

section:
  code: example_section
  name_ru: "Раздел сметы"
  calculator_module: "experiments/example_calculator/example_calculator.py"
  status: draft
  owner_notes: ""

source_files:
  calculator: ""
  calculator_readme: ""
  existing_cases:
    - ""
  related_docs:
    - ""
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

# Rows shown on sheet 01_Проверка проекта. This is the ONLY sheet the calculator
# adapter reads project data from (together with price_keys/defaults/supplier_inputs
# below). Every project value, scalar or repeated-row group, is a review_parameters
# entry — there is no separate detail-table source.
review_parameters:
  # Example 1: a single scalar project value.
  - key: example_project_value_m2
    label_ru: "Проектный параметр"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: ""
    calculator_input_path: "example_project_value_m2"
    normalized_json_path: "sections.example_section.parameters.example_project_value_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: []
      aliases_ru: []
      expected_unit: "м2"
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте значение; при необходимости заполните исправление."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  # Example 2: a repeated-row group (e.g. rebar by diameter, trench routes, pipe
  # items, beam items). Still AUTO_PROJECT, still sheet 01 — each row is its own
  # editable line for Elena, not a single cell. `columns` describes the row shape.
  - key: example_items
    label_ru: "Позиции по спецификации"
    unit: "шт"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: ""
    calculator_input_path: "example_items"
    normalized_json_path: "sections.example_section.parameters.example_items.rows"
    value_kind: repeated_rows
    row_key_field: name
    columns:
      - key: name
        label_ru: "Наименование"
        unit: ""
        value_kind: string
        required: true
      - key: quantity
        label_ru: "Количество"
        unit: "шт"
        value_kind: number
        required: true
    parser_mapping:
      target_codes: []
      group_codes: []
      aliases_ru: []
      expected_unit: ""
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте позиции; каждая строка спецификации — отдельная строка на листе 01."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows also shown read-only on 03_Детали объемов so Elena can check against the PDF layout without opening it. Adapter reads sheet 01 only."
    validation:
      min_rows: 0
      sum_checks: []
    notes: ""

# Rows shown on sheet 02_Цены себестоимости.
price_keys:
  - key: example_work_unit_price
    estimate_line_code: example_estimate_line
    label_ru: "Работа"
    price_kind: work
    unit: "м2"
    required: true
    default_source: fallback
    registry_code: ""
    fallback_key: "fallback.example_work_unit_price"
    allow_manual_override: true
    notes: ""

# Inputs not asked from the project because they are defaults/modes/catalog constants.
# Numeric defaults are allowed and often required. Before nulling/removing a number,
# classify it against the June Elena/manual review materials:
# DEFAULT = formula/method/business/catalog value needed by calculator;
# forbidden = project-specific fixture quantity, old total, display value, or legacy override.
defaults:
  - key: example_coeff
    label_ru: "Коэффициент"
    source_class: DEFAULT
    value: 1.0
    unit: ""
    calculator_input_path: "example_coeff"
    source_note: "generic section default"
    allow_override_later: false
    notes: ""

# Values derived by adapter/calculator/formula-ready, not copied from project.
auto_calculated:
  - key: example_derived_quantity
    label_ru: "Расчетное количество"
    source_class: AUTO_CALCULATED
    formula: "example_project_value_m2 * example_coeff"
    leaf_inputs:
      - ref: review_parameters.example_project_value_m2
        source_class: AUTO_PROJECT
      - ref: defaults.example_coeff
        source_class: DEFAULT
    calculator_input_path: ""
    notes: ""

# External inputs that cannot be derived from PDF/calculator and are not local defaults.
supplier_inputs:
  - key: example_supplier_volume_m3
    label_ru: "Объем по раскладке поставщика"
    source_class: SUPPLIER_INPUT
    unit: "м3"
    required: false
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "example_supplier_volume_m3"
    notes: ""

# Deterministic adapter rules: normalized review JSON -> calculator input.
# `from.ref` may only point into review_parameters / price_keys / defaults /
# supplier_inputs / auto_calculated. Never into a details-sheet-only source.
calculator_input_mapping:
  - input_path: "example_project_value_m2"
    from:
      ref: "review_parameters.example_project_value_m2"
      source_class: AUTO_PROJECT
    required: true
    transform: identity
    fallback: null
    notes: ""
  - input_path: "example_items"
    from:
      ref: "review_parameters.example_items"
      source_class: AUTO_PROJECT
    required: false
    transform: identity
    fallback: null
    notes: "Repeated-row group read from sheet 01, not from the sheet-03 mirror."
  - input_path: "example_coeff"
    from:
      ref: "defaults.example_coeff"
      source_class: DEFAULT
    required: true
    transform: identity
    fallback: 1.0
    notes: ""

# Final estimate rows produced by the calculator/formula-ready layer.
# These are not rows of sheet 01_Проверка проекта.
estimate_lines:
  - code: example_estimate_line
    name_ru: "Строка сметы"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=example_estimate_line]"
    quantity:
      formula: "example_project_value_m2 * example_coeff"
      formula_model:
        type: multiply
        operands:
          - ref: "helper_zone.example_project_value_m2"
          - ref: "helper_zone.example_coeff"
      leaf_inputs:
        - ref: "review_parameters.example_project_value_m2"
          source_class: AUTO_PROJECT
        - ref: "defaults.example_coeff"
          source_class: DEFAULT
    prices:
      material_unit_price_key: null
      work_unit_price_key: example_work_unit_price
      fixed_amount_key: null
    helper_cells:
      - helper_id: example_project_value_m2
        label_ru: "Проектный параметр"
        source_ref: "review_parameters.example_project_value_m2"
        source_class: AUTO_PROJECT
        target_col_role: P
      - helper_id: example_coeff
        label_ru: "Коэффициент"
        source_ref: "defaults.example_coeff"
        source_class: DEFAULT
        target_col_role: Q
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""

workbook_layout:
  review_workbook:
    include_on_constructor: true
    project_sheet: "01_Проверка проекта"
    price_sheet: "02_Цены себестоимости"
    details_sheet: "03_Детали объемов"
    candidates_sheet: "05_Кандидаты parser"
    raw_sheet: "06_Сырые данные parser"
  final_estimate_workbook:
    section_order: null
    section_row_name: "Раздел сметы"
    white_zone: "A:I"
    calc_zone: "J:O"
    helper_zone: "P:V"
    mini_table_zone: "W:AA+"

checks:
  required_source_classes:
    - AUTO_PROJECT
    - DEFAULT
    - AUTO_CALCULATED
    - PRICE
    - SUPPLIER_INPUT
    - MANUAL_REVIEW
  fail_if:
    - "estimate line has no quantity formula or explicit non-formula reason"
    - "leaf input has unknown source_class"
    - "leaf input or calculator_input_mapping references a details-sheet-only source (there is no such source; repeated rows are AUTO_PROJECT on sheet 01)"
    - "numeric formula default was removed without checking June Elena/manual review materials"
    - "calculator input requires a DEFAULT coefficient but contract leaves it unresolved"
    - "price used by estimate line has no price_key or explicit zero/fixed reason"
    - "review row cannot be classified as parameter (scalar or repeated_rows) / price / default / auto / supplier / manual"
    - "formula-ready row count differs from calculator estimate line count without explanation"
