contract_version: 0.1

section:
  code: waterproofing
  name_ru: "Гидроизоляция фундаментной плиты"
  calculator_module: "experiments/waterproofing_calculator/waterproofing_calculator.py"
  status: draft
  owner_notes: "Production contract: no old project values, fixture totals, or Excel-match overrides."

source_files:
  calculator: "experiments/waterproofing_calculator/waterproofing_calculator.py"
  calculator_readme: "experiments/waterproofing_calculator/README.md"
  existing_cases:
    - "experiments/waterproofing_calculator/cases/test_waterproofing_spec_area"
  related_docs:
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "docs/report_paid_waterproofing_calculator_changes.md"
    - "docs/report_waterproofing_calculator.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: waterproofing_area_m2
    label_ru: "Площадь гидроизоляции фундаментной плиты"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "waterproofing_area_m2"
    calculator_input_path: "waterproofing_area_m2"
    normalized_json_path: "sections.waterproofing.parameters.waterproofing_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes:
        - "waterproofing_area_m2"
      aliases_ru:
        - "площадь гидроизоляции"
        - "площадь гидроизоляции фундаментной плиты"
        - "гидроизоляция фундаментной плиты"
      expected_unit: "м2"
      notes: "Use specification area in production; do not reconstruct from old perimeter/height fixtures."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь гидроизоляции из спецификации."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Maps to calculator production mode `spec_area`."

  - key: eps100_wall_volume_m3
    label_ru: "ЭППС 100 мм по торцу фундаментной плиты, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "eps100_wall_volume_m3"
    calculator_input_path: "eps100_wall_volume_m3"
    normalized_json_path: "sections.waterproofing.parameters.eps100_wall_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes:
        - "eps100_wall_volume_m3"
      aliases_ru:
        - "эппс 100 мм торец плиты"
        - "утепление торца плиты эппс 100 мм объем"
        - "пеноплэкс гео 100 мм торец плиты"
      expected_unit: "м3"
      notes: "Must stay volume in m3. Do not confuse with EPS work area in m2. Torец плиты / борт плиты / вертикальная поверхность плит фундамента are the same MVP entity, but foundation walls/rostverk are excluded."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем ЭППС 100 мм по торцу фундаментной плиты."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Material volume for EPS 100 mm slab edge/board insulation. If the PDF gives an explicit m2 area for the same work, use eps100_wall_insulation_area_m2 for the work quantity; do not force volume/thickness when an explicit area exists."

  - key: eps100_wall_insulation_area_m2
    label_ru: "ЭППС 100 мм по торцу фундаментной плиты, площадь работ"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "eps100_wall_insulation_area_m2"
    calculator_input_path: "eps100_wall_insulation_area_m2"
    normalized_json_path: "sections.waterproofing.parameters.eps100_wall_insulation_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes:
        - "eps100_wall_insulation_area_m2"
      aliases_ru:
        - "площадь утепления торца плиты эппс 100 мм"
        - "площадь утепления бортов фундаментной плиты эппс 100 мм"
        - "площадь вертикальных поверхностей плит фундамента под утепление эппс 100мм"
      expected_unit: "м2"
      notes: "Torец плиты, борт плиты и вертикальная поверхность плит фундамента are the same MVP entity. This is the work area, not the EPS material volume. Exclude foundation walls/rostverk."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "ok_if_volume_present"
      action_ru: "Если в проекте есть отдельная площадь утепления торца/борта фундаментной плиты ЭППС 100 мм, проверьте ее. Если отдельной площади нет, калькулятор рассчитает работу из объема ЭППС 100 мм и толщины."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Optional explicit work area for EPS 100 mm slab edge/board insulation. When present, calculator uses it for the work row. Material remains eps100_wall_volume_m3."

  - key: eps50_wall_volume_m3
    label_ru: "ЭППС 50 мм по торцу фундаментной плиты, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "eps50_wall_volume_m3"
    calculator_input_path: "eps50_wall_volume_m3"
    normalized_json_path: "sections.waterproofing.parameters.eps50_wall_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes:
        - "eps50_wall_volume_m3"
      aliases_ru:
        - "эппс 50 мм торец плиты"
        - "утепление торца плиты эппс 50 мм объем"
        - "пеноплэкс гео 50 мм торец плиты"
      expected_unit: "м3"
      notes: "Must stay volume in m3. Do not confuse with EPS work area in m2, and do not confuse with thermal-insert EPS material (foundation_slab.thermal_insert_50_material_spec_qty) or under-slab EPS (foundation_slab.eps50_under_slab_volume_m3) — this is edge/vertical wall insulation of the slab, same physical application as eps100_wall_volume_m3 but a thinner second layer."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если по спецификации есть отдельный слой ЭППС 50 мм по торцу плиты (в дополнение к 100 мм), проверьте его объем. Не у всех проектов есть этот слой — это нормально."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Optional second layer of edge/wall insulation, thinner than eps100_wall_volume_m3. When absent or 0, the two eps50_wall_* estimate lines are simply not produced — same pattern as floor_2/parapet/vent_chimney conditional blocks elsewhere. Added 2026-07-14 after finding a real ТРЦ project row (КР-1 стр.22) with both 50мм and 100мм 'Утепление вертикальных поверхностей' present together; ЮСВ only ever had the 100мм layer."

