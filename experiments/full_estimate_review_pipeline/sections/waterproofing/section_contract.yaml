auto_calculated:
  - key: eps100_wall_insulation_area_m2
    label_ru: "Площадь работ по ЭППС 100 мм торца"
    source_class: AUTO_CALCULATED
    formula: "eps100_wall_insulation_area_m2 from project when present, else eps100_wall_volume_m3 / eps100_wall_thickness_m"
    leaf_inputs:
      - ref: review_parameters.eps100_wall_insulation_area_m2
        source_class: AUTO_PROJECT
        optional: true
      - ref: review_parameters.eps100_wall_volume_m3
        source_class: AUTO_PROJECT
      - ref: defaults.eps100_wall_thickness_m
        source_class: DEFAULT
    calculator_input_path: "eps100_wall_insulation_area_m2"
    notes: "Work area in m2; not a project volume. If PDF explicitly gives slab edge/board/vertical-slab area, use it. Fallback to volume/thickness only when explicit area is absent."

  - key: eps50_wall_insulation_area_m2
    label_ru: "Площадь работ по ЭППС 50 мм торца"
    source_class: AUTO_CALCULATED
    formula: "eps50_wall_volume_m3 / eps50_wall_thickness_m when eps50_wall_volume_m3 > 0, else 0"
    leaf_inputs:
      - ref: review_parameters.eps50_wall_volume_m3
        source_class: AUTO_PROJECT
      - ref: defaults.eps50_wall_thickness_m
        source_class: DEFAULT
    calculator_input_path: ""
    notes: "Work area in m2; 0 when eps50_wall_volume_m3 is absent/0 (no second layer for this project)."

  - key: combined_wall_insulation_area_m2
    label_ru: "Суммарная площадь утепления торца плиты (50+100 мм)"
    source_class: AUTO_CALCULATED
    formula: "eps100_wall_insulation_area_m2 + eps50_wall_insulation_area_m2"
    leaf_inputs:
      - ref: auto_calculated.eps100_wall_insulation_area_m2
        source_class: AUTO_CALCULATED
      - ref: auto_calculated.eps50_wall_insulation_area_m2
        source_class: AUTO_CALCULATED
    calculator_input_path: ""
    notes: "Used only as the basis for glue-foam consumption (eps_glue_foam) — both layers get glued to the slab edge, so glue-foam quantity must cover the combined area, not just the 100mm layer."

  - key: primer_units
    label_ru: "Количество канистр праймера"
    source_class: AUTO_CALCULATED
    formula: "ceil(waterproofing_area_m2 * primer_consumption_l_per_m2 / primer_canister_volume_l)"
    leaf_inputs:
      - ref: review_parameters.waterproofing_area_m2
        source_class: AUTO_PROJECT
      - ref: defaults.primer_consumption_l_per_m2
        source_class: DEFAULT
      - ref: defaults.primer_canister_volume_l
        source_class: DEFAULT
    calculator_input_path: ""
    notes: ""

  - key: mastic_units
    label_ru: "Количество ведер мастики"
    source_class: AUTO_CALCULATED
    formula: "ceil(waterproofing_area_m2 * mastic_consumption_kg_per_m2_per_layer * mastic_layers / mastic_bucket_weight_kg)"
    leaf_inputs:
      - ref: review_parameters.waterproofing_area_m2
        source_class: AUTO_PROJECT
      - ref: defaults.mastic_consumption_kg_per_m2_per_layer
        source_class: DEFAULT
      - ref: defaults.mastic_layers
        source_class: DEFAULT
      - ref: defaults.mastic_bucket_weight_kg
        source_class: DEFAULT
    calculator_input_path: ""
    notes: ""

  - key: eps100_wall_order_volume_m3
    label_ru: "Закупочный объем ЭППС 100 мм"
    source_class: AUTO_CALCULATED
    formula: "ceil((eps100_wall_volume_m3 * eps_waste_coeff) / eps100_pack_volume_m3) * eps100_pack_volume_m3"
    leaf_inputs:
      - ref: review_parameters.eps100_wall_volume_m3
        source_class: AUTO_PROJECT
      - ref: defaults.eps_waste_coeff
        source_class: DEFAULT
      - ref: defaults.eps100_pack_volume_m3
        source_class: DEFAULT
    calculator_input_path: ""
    notes: "Quantity stays m3."

  - key: eps50_wall_order_volume_m3
    label_ru: "Закупочный объем ЭППС 50 мм (торец плиты)"
    source_class: AUTO_CALCULATED
    formula: "ceil((eps50_wall_volume_m3 * eps_waste_coeff) / eps50_pack_volume_m3) * eps50_pack_volume_m3 when eps50_wall_volume_m3 > 0, else 0"
    leaf_inputs:
      - ref: review_parameters.eps50_wall_volume_m3
        source_class: AUTO_PROJECT
      - ref: defaults.eps_waste_coeff
        source_class: DEFAULT
      - ref: defaults.eps50_pack_volume_m3
        source_class: DEFAULT
    calculator_input_path: ""
    notes: "Quantity stays m3. 0 when eps50_wall_volume_m3 is absent/0."

  - key: glue_foam_units
    label_ru: "Количество баллонов клей-пены"
    source_class: AUTO_CALCULATED
    formula: "max(glue_foam_min_units, ceil(combined_wall_insulation_area_m2 / glue_foam_coverage_m2_per_can))"
    leaf_inputs:
      - ref: auto_calculated.combined_wall_insulation_area_m2
        source_class: AUTO_CALCULATED
      - ref: defaults.glue_foam_coverage_m2_per_can
        source_class: DEFAULT
      - ref: defaults.glue_foam_min_units
        source_class: DEFAULT
    calculator_input_path: ""
    notes: "Changed 2026-07-14 from eps100-only area to combined 50+100mm area — both layers need glue-foam."

  - key: waterproofing_logistics_amount
    label_ru: "Логистика и снабжение"
    source_class: AUTO_CALCULATED
    formula: "waterproofing_base_subtotal * waterproofing_logistics_coeff"
    leaf_inputs:
      - ref: calculator_result.waterproofing_base_subtotal
        source_class: AUTO_CALCULATED
      - ref: defaults.waterproofing_logistics_coeff
        source_class: DEFAULT
    calculator_input_path: ""
    notes: ""

  - key: waterproofing_consumables_amount
    label_ru: "Расходные материалы и амортизация инструмента"
    source_class: AUTO_CALCULATED
    formula: "waterproofing_base_subtotal * waterproofing_consumables_coeff"
    leaf_inputs:
      - ref: calculator_result.waterproofing_base_subtotal
        source_class: AUTO_CALCULATED
      - ref: defaults.waterproofing_consumables_coeff
        source_class: DEFAULT
    calculator_input_path: ""
    notes: ""

supplier_inputs: []

calculator_input_mapping:
  - input_path: "project_name"
    from:
      ref: "defaults.project_name"
      source_class: DEFAULT
    required: true
    transform: job_metadata_project_name
    fallback: null
    notes: ""

  - input_path: "waterproofing_area_calc_method"
    from:
      ref: "defaults.waterproofing_area_calc_method"
      source_class: DEFAULT
    required: true
    transform: identity
    fallback: "spec_area"
    notes: ""

  - input_path: "waterproofing_area_m2"
    from:
      ref: "review_parameters.waterproofing_area_m2"
      source_class: AUTO_PROJECT
    required: true
    transform: number_m2
    fallback: null
    notes: ""

  - input_path: "eps100_wall_volume_m3"
    from:
      ref: "review_parameters.eps100_wall_volume_m3"
      source_class: AUTO_PROJECT
    required: true
    transform: number_m3
    fallback: null
    notes: ""

  - input_path: "eps100_wall_insulation_area_m2"
    from:
      ref: "review_parameters.eps100_wall_insulation_area_m2"
      source_class: AUTO_PROJECT
      optional: true
    required: false
    transform: number_m2
    fallback: null
    notes: "Optional explicit work area. If absent, calculator derives work area from eps100_wall_volume_m3 / eps100_wall_thickness_m."

  - input_path: "eps50_wall_volume_m3"
    from:
      ref: "review_parameters.eps50_wall_volume_m3"
      source_class: AUTO_PROJECT
    required: false
    transform: number_m3
    fallback: null
    notes: "Optional — most projects (e.g. ЮСВ) have no second 50mm edge-insulation layer. Leave null, not 0, when absent so it reads the same as 'not applicable' rather than a confirmed zero."

  - input_path: "*"
    from:
      ref: "defaults + price_keys"
      source_class: DEFAULT
    required: true
    transform: fill_remaining_calculator_fields
    fallback: null
    notes: "Adapter must fill calculator defaults and resolved price fields without copying old fixture values."

estimate_lines:
  - code: waterproofing_bitumen_mastic_work
    name_ru: "Гидроизоляция фундаментной плиты битумной мастикой в 2 слоя"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=waterproofing_bitumen_mastic_work]"
    quantity:
      formula: "waterproofing_area_m2"
      formula_model:
        type: reference
        ref: "review_parameters.waterproofing_area_m2"
      leaf_inputs:
        - ref: "review_parameters.waterproofing_area_m2"
          source_class: AUTO_PROJECT
    prices:
      material_unit_price_key: null
      work_unit_price_key: waterproofing_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""

  - code: bitumen_primer_aquamast_18l
    name_ru: "Праймер битумный AquaMast, 18 л"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=bitumen_primer_aquamast_18l]"
    quantity:
      formula: "ceil(waterproofing_area_m2 * primer_consumption_l_per_m2 / primer_canister_volume_l)"
      formula_model:
        type: ceil_divide_product
        numerator_refs:
          - "review_parameters.waterproofing_area_m2"
          - "defaults.primer_consumption_l_per_m2"
        denominator_ref: "defaults.primer_canister_volume_l"
      leaf_inputs:
        - ref: "review_parameters.waterproofing_area_m2"
          source_class: AUTO_PROJECT
        - ref: "defaults.primer_consumption_l_per_m2"
          source_class: DEFAULT
        - ref: "defaults.primer_canister_volume_l"
          source_class: DEFAULT
    prices:
      material_unit_price_key: primer_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""

  - code: bitumen_mastic_aquamast_18kg
    name_ru: "Мастика гидроизоляционная битумная для фундаментов AquaMast, 18 кг"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=bitumen_mastic_aquamast_18kg]"
    quantity:
      formula: "ceil(waterproofing_area_m2 * mastic_consumption_kg_per_m2_per_layer * mastic_layers / mastic_bucket_weight_kg)"
      formula_model:
        type: ceil_divide_product
        numerator_refs:
          - "review_parameters.waterproofing_area_m2"
          - "defaults.mastic_consumption_kg_per_m2_per_layer"
          - "defaults.mastic_layers"
        denominator_ref: "defaults.mastic_bucket_weight_kg"
      leaf_inputs:
        - ref: "review_parameters.waterproofing_area_m2"
          source_class: AUTO_PROJECT
        - ref: "defaults.mastic_consumption_kg_per_m2_per_layer"
          source_class: DEFAULT
        - ref: "defaults.mastic_layers"
          source_class: DEFAULT
        - ref: "defaults.mastic_bucket_weight_kg"
          source_class: DEFAULT
    prices:
      material_unit_price_key: mastic_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""

  - code: eps100_wall_insulation_work
    name_ru: "Утепление торца/борта фундаментной плиты ЭППС 100 мм"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps100_wall_insulation_work]"
    quantity:
      formula: "eps100_wall_insulation_area_m2 from project when present, else eps100_wall_volume_m3 / eps100_wall_thickness_m"
      formula_model:
        type: optional_project_value_else_divide
        project_value_ref: "review_parameters.eps100_wall_insulation_area_m2"
        numerator_ref: "review_parameters.eps100_wall_volume_m3"
        denominator_ref: "defaults.eps100_wall_thickness_m"
      leaf_inputs:
        - ref: "review_parameters.eps100_wall_insulation_area_m2"
          source_class: AUTO_PROJECT
          optional: true
        - ref: "review_parameters.eps100_wall_volume_m3"
          source_class: AUTO_PROJECT
        - ref: "defaults.eps100_wall_thickness_m"
          source_class: DEFAULT
    prices:
      material_unit_price_key: null
      work_unit_price_key: eps100_wall_insulation_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "This is work area in m2, not EPS volume."

  - code: eps100_wall_penoplex_geo_material
    name_ru: "Пеноплэкс ГЕО 100 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps100_wall_penoplex_geo_material]"
    quantity:
      formula: "ceil((eps100_wall_volume_m3 * eps_waste_coeff) / eps100_pack_volume_m3) * eps100_pack_volume_m3"
      formula_model:
        type: round_up_to_pack
        required_volume_ref: "review_parameters.eps100_wall_volume_m3"
        waste_coeff_ref: "defaults.eps_waste_coeff"
        pack_volume_ref: "defaults.eps100_pack_volume_m3"
      leaf_inputs:
        - ref: "review_parameters.eps100_wall_volume_m3"
          source_class: AUTO_PROJECT
        - ref: "defaults.eps_waste_coeff"
          source_class: DEFAULT
        - ref: "defaults.eps100_pack_volume_m3"
          source_class: DEFAULT
    prices:
      material_unit_price_key: eps100_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "This remains material volume in m3."

  - code: eps50_wall_insulation_work
    name_ru: "Утепление торца/борта фундаментной плиты ЭППС 50 мм"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps50_wall_insulation_work]"
    quantity:
      formula: "eps50_wall_volume_m3 / eps50_wall_thickness_m"
      formula_model:
        type: divide
        numerator_ref: "review_parameters.eps50_wall_volume_m3"
        denominator_ref: "defaults.eps50_wall_thickness_m"
      leaf_inputs:
        - ref: "review_parameters.eps50_wall_volume_m3"
          source_class: AUTO_PROJECT
        - ref: "defaults.eps50_wall_thickness_m"
          source_class: DEFAULT
    prices:
      material_unit_price_key: null
      work_unit_price_key: eps50_wall_insulation_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "Added 2026-07-14. Only returned when eps50_wall_volume_m3 > 0 — most projects don't have this second layer (see review_parameters.eps50_wall_volume_m3 notes)."

  - code: eps50_wall_penoplex_geo_material
    name_ru: "Пеноплэкс ГЕО 50 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps50_wall_penoplex_geo_material]"
    quantity:
      formula: "ceil((eps50_wall_volume_m3 * eps_waste_coeff) / eps50_pack_volume_m3) * eps50_pack_volume_m3"
      formula_model:
        type: round_up_to_pack
        required_volume_ref: "review_parameters.eps50_wall_volume_m3"
        waste_coeff_ref: "defaults.eps_waste_coeff"
        pack_volume_ref: "defaults.eps50_pack_volume_m3"
      leaf_inputs:
        - ref: "review_parameters.eps50_wall_volume_m3"
          source_class: AUTO_PROJECT
        - ref: "defaults.eps_waste_coeff"
          source_class: DEFAULT
        - ref: "defaults.eps50_pack_volume_m3"
          source_class: DEFAULT
    prices:
      material_unit_price_key: eps50_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "Added 2026-07-14. Same registry price as foundation_slab.eps50_unit_price (eps_geo_50_m3). Only returned when eps50_wall_volume_m3 > 0."

  - code: eps_glue_foam
    name_ru: "Клей-пена для ЭППС"
    unit: "баллон"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps_glue_foam]"
    quantity:
      formula: "max(glue_foam_min_units, ceil(combined_wall_insulation_area_m2 / glue_foam_coverage_m2_per_can))"
      formula_model:
        type: max_min_ceil_coverage
        area_ref: "auto_calculated.combined_wall_insulation_area_m2"
        coverage_ref: "defaults.glue_foam_coverage_m2_per_can"
        min_ref: "defaults.glue_foam_min_units"
      leaf_inputs:
        - ref: "review_parameters.eps100_wall_volume_m3"
          source_class: AUTO_PROJECT
        - ref: "defaults.eps100_wall_thickness_m"
          source_class: DEFAULT
        - ref: "review_parameters.eps50_wall_volume_m3"
          source_class: AUTO_PROJECT
        - ref: "defaults.eps50_wall_thickness_m"
          source_class: DEFAULT
        - ref: "defaults.glue_foam_coverage_m2_per_can"
          source_class: DEFAULT
        - ref: "defaults.glue_foam_min_units"
          source_class: DEFAULT
    prices:
      material_unit_price_key: glue_foam_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "Changed 2026-07-14: now covers combined 50+100mm area, not just the 100mm layer, since both get glued to the slab edge when both are present."

  - code: waterproofing_logistics_and_supply
    name_ru: "Логистика и снабжение"
    unit: "-"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=waterproofing_logistics_and_supply]"
    quantity:
      formula: "1; amount = waterproofing_base_subtotal * waterproofing_logistics_coeff"
      formula_model:
        type: fixed_quantity
        value: 1
      leaf_inputs:
        - ref: "calculator_result.waterproofing_base_subtotal"
          source_class: AUTO_CALCULATED
        - ref: "defaults.waterproofing_logistics_coeff"
          source_class: DEFAULT
    prices:
      material_unit_price_key: null
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "Calculated amount from waterproofing_base_subtotal and waterproofing_logistics_coeff; not a price/manual fixed amount."

  - code: waterproofing_consumables_tool_amortization
    name_ru: "Расходные материалы, амортизация инструмента"
    unit: "комплект"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=waterproofing_consumables_tool_amortization]"
    quantity:
      formula: "1; amount = waterproofing_base_subtotal * waterproofing_consumables_coeff"
      formula_model:
        type: fixed_quantity
        value: 1
      leaf_inputs:
        - ref: "calculator_result.waterproofing_base_subtotal"
          source_class: AUTO_CALCULATED
        - ref: "defaults.waterproofing_consumables_coeff"
          source_class: DEFAULT
    prices:
      material_unit_price_key: null
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "Calculated amount from waterproofing_base_subtotal and waterproofing_consumables_coeff; not a price/manual fixed amount."

workbook_layout:
  review_workbook:
    include_on_constructor: true
    project_sheet: "01_Проверка проекта"
    price_sheet: "02_Цены себестоимости"
    details_sheet: "03_Детали объемов"
    candidates_sheet: "05_Кандидаты parser"
    raw_sheet: "06_Сырые данные parser"
  final_estimate_workbook:
    section_order: 2
    section_row_name: "ГИДРОИЗОЛЯЦИЯ ФУНДАМЕНТНОЙ ПЛИТЫ"
    white_zone: "A:I"
    calc_zone: "J:O"
    helper_zone: "P:V"
    mini_table_zone: "W:AA+"

checks:
  required_source_classes:
    - AUTO_PROJECT
    - DEFAULT
    - AUTO_CALCULATED
    - PRICE
    - SUPPLIER_INPUT
    - MANUAL_REVIEW
  required_review_parameters:
    - waterproofing_area_m2
    - eps100_wall_volume_m3
  forbidden_production_inputs:
    - slab_formwork_perimeter_m
    - slab_edge_height_m
    - non_insulated_edge_lengths_m
    - old_fixture_values
    - expected_totals
    - display_quantity_overrides
  expected_estimate_line_count: 10
  contamination_check:
    old_project_markers_allowed: false
    fixture_values_allowed: false
    expected_totals_allowed: false
  notes: "Production adapter must fail if required defaults or prices are missing; it must not copy old case input values. expected_estimate_line_count changed 8 -> 10 on 2026-07-14: added eps50_wall_insulation_work + eps50_wall_penoplex_geo_material, both conditional on eps50_wall_volume_m3 > 0 (8 lines when absent, matching all prior cases like ЮСВ; 10 lines when a project has both 50mm and 100mm edge-insulation layers, like ТРЦ)."
