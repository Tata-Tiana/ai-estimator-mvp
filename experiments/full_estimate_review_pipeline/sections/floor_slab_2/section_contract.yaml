supplier_inputs:
  - key: crane_shifts
    label_ru: "Подача опалубки и арматуры краном"
    unit: "смена"
    source_class: SUPPLIER_INPUT
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "crane_shifts"
    normalized_json_path: "sections.floor_slab_2.supplier_inputs.crane_shifts.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Укажите смены крана для подачи опалубки и арматуры."
    notes: "Manual/supplier line in current calculator."

  - key: concrete_pump_shifts
    label_ru: "Работа бетононасоса"
    unit: "смена"
    source_class: SUPPLIER_INPUT
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "concrete_pump_shifts"
    normalized_json_path: "sections.floor_slab_2.supplier_inputs.concrete_pump_shifts.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Укажите смены бетононасоса."
    notes: "Fixed/manual line; do not compute from concrete volume."

calculator_input_mapping:
  - input_path: "*"
    from:
      ref: "review_parameters + detail_tables + supplier_inputs + defaults + price_keys"
      source_class: MIXED
    required: true
    transform: build_floor_slab_2_input
    fallback: null
    notes: "Adapter must fill flat calculator input without old fixture values."

estimate_lines:
  - code: formwork_rental_set
    name_ru: "Комплект опалубки перекрытия"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_rental_set]"
    quantity:
      formula: "main_formwork_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: formwork_rental_used_rate_per_m2, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: concrete_placing_work
    name_ru: "Бетонирование монолитной плиты перекрытия"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=concrete_placing_work]"
    quantity:
      formula: "concrete_placing_volume_m3"
      leaf_inputs:
        - {ref: "review_parameters.concrete_placing_volume_m3", source_class: AUTO_PROJECT}
