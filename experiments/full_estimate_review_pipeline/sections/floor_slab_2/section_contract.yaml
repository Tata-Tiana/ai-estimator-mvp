contract_version: 0.1

section:
  code: floor_slab_2
  name_ru: "Перекрытие 2 этажа"
  calculator_module: "experiments/floor_slab_2_calculator/calculator.py"
  status: draft
  owner_notes: "Production contract: spec formwork area, spec edge perimeter, spec concrete volume, and spec-length rebar only; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/floor_slab_2_calculator/calculator.py"
  calculator_readme: "experiments/floor_slab_2_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_floor_slab_2_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: main_formwork_area_m2
    label_ru: "Площадь опалубки под плитой перекрытия 2-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_main_formwork_area"
    calculator_input_path: "main_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.main_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_main_formwork_area"]
      aliases_ru: ["опалубка под плитой перекрытия 2 этажа", "горизонтальная опалубка 2 этажа", "основная площадь опалубки перекрытия"]
      expected_unit: "м2"
      notes: "Main slab deck formwork area."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь основной опалубки под плитой перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with roof area, 1st floor slab formwork, or EPS volume."

  - key: edge_formwork_area_m2
    label_ru: "Площадь опалубки торца плиты перекрытия 2-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_edge_formwork_area"
    calculator_input_path: "edge_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.edge_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_edge_formwork_area"]
      aliases_ru: ["опалубка торца плиты 2 этажа", "вертикальная опалубка плиты 2 этажа", "опалубка вертикальных поверхностей перекрытия 2 этажа"]
      expected_unit: "м2"
      notes: "Edge formwork area only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь опалубки торца плиты перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with EPS 100 mm edge volume in m3."

  - key: beams_formwork_area_m2
    label_ru: "Площадь опалубки балок перекрытия 2-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_beams_formwork_area"
    calculator_input_path: "beams_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.beams_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_beams_formwork_area"]
      aliases_ru: ["опалубка балок перекрытия 2 этажа", "площадь опалубки балок 2 этажа"]
      expected_unit: "м2"
      notes: "Current calculator scope has no beams; use 0 if absent."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если в этой плите есть балки, проверьте площадь опалубки балок; иначе оставьте 0."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: slab_edge_perimeter_m
    label_ru: "Периметр торца плиты перекрытия 2-го этажа"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_slab_edge_perimeter"
    calculator_input_path: "slab_edge_perimeter_m"
    normalized_json_path: "sections.floor_slab_2.parameters.slab_edge_perimeter_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_slab_edge_perimeter"]
      aliases_ru: ["периметр торца плиты 2 этажа", "длина торца плиты 2 этажа", "периметр вертикальных поверхностей 2 этажа"]
      expected_unit: "мп"
      notes: "Linear edge perimeter, not area."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте периметр/длину торца плиты перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Used for edge insulation work and EPS volume calculation."

  - key: edge_insulation_height_m
    label_ru: "Высота утепления торца плиты перекрытия 2-го этажа"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_edge_insulation_height"
    calculator_input_path: "edge_insulation_height_m"
    normalized_json_path: "sections.floor_slab_2.parameters.edge_insulation_height_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_edge_insulation_height"]
      aliases_ru: ["высота утепления торца 2 этажа", "торец плиты высота утепления", "ЭППС торца высота"]
      expected_unit: "м"
      notes: "Normalize mm to m."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте высоту утепления торца плиты перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not infer from section title if the specification gives a different value."

  - key: concrete_placing_volume_m3
    label_ru: "Бетон плиты перекрытия 2-го этажа, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_concrete_volume"
    calculator_input_path: "concrete_placing_volume_m3"
    normalized_json_path: "sections.floor_slab_2.parameters.concrete_placing_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_concrete_volume"]
      aliases_ru: ["бетон плиты перекрытия 2 этажа", "бетон ж/б плиты 2 этажа", "бетон перекрытия 2 этажа"]
      expected_unit: "м3"
      notes: "Direct project/spec quantity. Do not derive from area * thickness."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем бетона плиты перекрытия 2-го этажа по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with slab 1, roof, beams, lintels, or foundation concrete."

  - key: slab_area_m2
    label_ru: "Площадь плиты перекрытия 2-го этажа для контроля"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_slab_area"
    calculator_input_path: "slab_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.slab_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_slab_area"]
      aliases_ru: ["площадь плиты перекрытия 2 этажа", "площадь перекрытия 2 этажа"]
      expected_unit: "м2"
      notes: "Optional control value; main formwork area remains separate."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если площадь плиты указана отдельно, проверьте ее как контроль."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not substitute for main_formwork_area_m2 unless confirmed."

detail_tables:
  - key: floor_slab_2_rebar_items
    label_ru: "Арматура плиты перекрытия 2-го этажа"
    source_class: DETAIL_TABLE
    required: true
    review_sheet: "03_Детали объемов"
    normalized_json_path: "sections.floor_slab_2.detail_tables.rebar_items.rows"
    columns:
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: spec_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: source, label_ru: "Источник", unit: "", value_kind: string}
      - {key: fragment, label_ru: "Фрагмент проекта", unit: "", value_kind: string}
    notes: "Production PDF primary quantity is m.п.; kg/m and rod length come from local catalog."

