supplier_inputs:
  - key: formwork_rental_supplier_quote_total
    label_ru: "Коммерческое предложение поставщика на аренду опалубки, итого"
    unit: "руб"
    source_class: SUPPLIER_INPUT
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "formwork_rental_supplier_quote_total"
    normalized_json_path: "sections.floor_slab_2.supplier_inputs.formwork_rental_supplier_quote_total.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Укажите итоговую сумму коммерческого предложения поставщика на аренду опалубки."
    notes: "Calculator requires this unconditionally (no fallback) but only uses it to compute a control ratio (raw_supplier_rate) shown for cross-check against formwork_rental_used_rate_per_m2 — it does not feed any estimate line total directly. Previously missing from this contract entirely; without it the calculator raises KeyError."

  - key: crane_shifts
    label_ru: "Подача опалубки и арматуры краном"
    unit: "смена"
    source_class: SUPPLIER_INPUT
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "crane_shifts"
    normalized_json_path: "sections.floor_slab_2.supplier_inputs.crane_shifts.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Укажите смены подачи опалубки и арматуры краном."
    notes: "source_class AUTO_CALCULATED -> SUPPLIER_INPUT 2026-07-30 (reverted): no real crane-shift-count formula exists anywhere in the codebase. The 2026-07-30 automation wrongly reused the box_calculator's delivery-truck allocation for crane shifts; real ARK smeta data disproved the underlying assumption (crane count 2 != delivery count 1 for the same section, floor_slab_1). Elena's final ruling: crane stays purely manual, no invented formula - box_calculator is repurposed for rebar/metal delivery trucks instead (see foundation_slab.rebar_metal_delivery_trucks)."

  - key: rebar_metal_delivery_trucks
    label_ru: "Доставка арматуры и металла, машины"
    unit: "маш"
    source_class: AUTO_CALCULATED
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "rebar_metal_delivery_trucks"
    normalized_json_path: "sections.floor_slab_2.supplier_inputs.rebar_metal_delivery_trucks.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Автоматически по общему весу арматуры коробки (box-калькулятор, накопление 10 т) — проверьте и поправьте при необходимости."
    notes: "Added 2026-07-30. This section had no metal-delivery field/line at all before. Value comes from compute_rebar_metal_delivery_allocation() in populate_review_workbook_from_extraction.py (box_calculator's 10-tonne threshold allocation across all 4 rebar-bearing sections) - naturally 0 for projects where this section doesn't cross a threshold. Still allow_manual_override: true."

  - key: concrete_pump_shifts
    label_ru: "Работа бетононасоса"
    unit: "смена"
    source_class: SUPPLIER_INPUT
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "concrete_pump_shifts"
    normalized_json_path: "sections.floor_slab_2.supplier_inputs.concrete_pump_shifts.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Укажите смены бетононасоса."
    notes: "Fixed/manual line; do not compute from concrete volume."

auto_calculated:
  - key: slab_concrete_volume_m3
    label_ru: "Бетон плиты (без балок)"
    source_class: AUTO_CALCULATED
    formula: "concrete_placing_volume_m3 - beams_concrete_volume_m3"
    leaf_inputs:
      - {ref: "review_parameters.concrete_placing_volume_m3", source_class: AUTO_PROJECT}
      - {ref: "review_parameters.beams_concrete_volume_m3", source_class: AUTO_PROJECT}
    calculator_input_path: ""
    notes: "concrete_placing_volume_m3 is expected to already include beam concrete when beams exist, same convention as floor_slab_1_calculator.py. beams_concrete_volume_m3 here already resolves to the sum of beam_items.concrete_volume_m3 when the scalar review_parameters value is left null (added 2026-07-12, mirrors edge_and_beam_formwork_area_m2's beams_formwork_area_m2 pattern). This is the concrete_placing_work estimate line's real quantity, not the raw scalar."

  - key: edge_and_beam_formwork_area_m2
    label_ru: "Опалубка торца плиты и балок, сумма"
    source_class: AUTO_CALCULATED
    formula: "edge_formwork_area_m2 + beams_formwork_area_m2 + beams_bottom_formwork_area_m2"
    leaf_inputs:
      - {ref: "review_parameters.edge_formwork_area_m2", source_class: AUTO_PROJECT}
      - {ref: "review_parameters.beams_formwork_area_m2", source_class: AUTO_PROJECT}
      - {ref: "review_parameters.beams_bottom_formwork_area_m2", source_class: AUTO_PROJECT}
    calculator_input_path: ""
    notes: "Contract/report quantity mirrors the calculator's edge_beam_formwork_area_for_materials: edge_formwork_area_m2 + beams_formwork_area_m2 (or combined edge+beam vertical formwork) + beams_bottom_formwork_area_m2. beams_formwork_area_m2 already resolves to the sum of beam_items.formwork_area_m2 when the scalar review_parameters value is left null."

  - key: total_insulation_length_m
    label_ru: "Длина утепления торца плиты и балок, сумма"
    source_class: AUTO_CALCULATED
    formula: "slab_edge_perimeter_m + beams_eps_work_length_m"
    leaf_inputs:
      - {ref: "review_parameters.slab_edge_perimeter_m", source_class: AUTO_PROJECT}
      - {ref: "review_parameters.beams_eps_work_length_m", source_class: AUTO_PROJECT}
    calculator_input_path: ""
    notes: "This is the edge_insulation_work estimate line's real quantity. Do not infer beam insulation from all beam length: Elena confirmed beams may be uninsulated or insulated only partially."

  - key: edge_and_beam_insulation_area_m2
    label_ru: "Площадь материала утепления торца плиты и балок, сумма"
    source_class: AUTO_CALCULATED
    formula: "(slab_edge_perimeter_m * edge_insulation_height_m) + beams_eps_material_area_m2"
    leaf_inputs:
      - {ref: "review_parameters.slab_edge_perimeter_m", source_class: AUTO_PROJECT}
      - {ref: "review_parameters.edge_insulation_height_m", source_class: AUTO_PROJECT}
      - {ref: "review_parameters.beams_eps_material_area_m2", source_class: AUTO_PROJECT}
    calculator_input_path: ""
    notes: "Drives both the EPS100 pack count and the foam-glue can count. Do not derive beam EPS area from all beam length; use only an explicit project value."

  - key: bottom_slab_eps_volume_m3
    label_ru: "ЭППС 100 мм низ плиты перекрытия 2-го этажа, объем"
    source_class: AUTO_CALCULATED
    formula: "bottom_slab_eps_work_area_m2 * eps100_thickness_m"
    leaf_inputs:
      - {ref: "review_parameters.bottom_slab_eps_work_area_m2", source_class: AUTO_PROJECT}
      - {ref: "defaults.eps100_thickness_m", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "Only exists when the PDF gives separate bottom/horizontal EPS insulation of the slab. Defaults to 0 when absent."

  - key: eps100_required_volume_without_waste_m3
    label_ru: "ЭППС 100 мм без запаса, торцы + низ плиты"
    source_class: AUTO_CALCULATED
    formula: "edge_and_beam_insulation_area_m2 * eps100_thickness_m + bottom_slab_eps_volume_m3"
    leaf_inputs:
      - {ref: "auto_calculated.edge_and_beam_insulation_area_m2", source_class: AUTO_CALCULATED}
      - {ref: "auto_calculated.bottom_slab_eps_volume_m3", source_class: AUTO_CALCULATED}
      - {ref: "defaults.eps100_thickness_m", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "Mirrors calculator material base after 2026-07-31 bottom-slab EPS addition."

  - key: formwork_delivery_trips
    label_ru: "Рейсы доставки опалубки манипулятором"
    source_class: AUTO_CALCULATED
    formula: "main_formwork_area_m2 <= formwork_delivery_threshold_m2 ? 2 : 4"
    leaf_inputs:
      - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
      - {ref: "defaults.formwork_delivery_threshold_m2", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "area_threshold production mode only; 2 trips (1 delivery + 1 pickup) at or below the threshold, 4 above it."

  - key: plywood_sheets
    label_ru: "Листы фанеры для опалубки, заказ"
    source_class: AUTO_CALCULATED
    formula: "ceil(edge_and_beam_formwork_area_m2 / plywood_sheet_working_area_m2 + main_formwork_area_m2 * non_multiple_places_coeff / plywood_sheet_working_area_m2 + plywood_reserve_sheets)"
    leaf_inputs:
      - {ref: "auto_calculated.edge_and_beam_formwork_area_m2", source_class: AUTO_CALCULATED}
      - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
      - {ref: "defaults.plywood_sheet_working_area_m2", source_class: DEFAULT}
      - {ref: "defaults.non_multiple_places_coeff", source_class: DEFAULT}
      - {ref: "defaults.plywood_reserve_sheets", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "edge_and_beam_formwork_area_m2 includes the separate bottom/horizontal beam formwork area when the PDF gives it."

  - key: timber_volume_m3
    label_ru: "Пиломатериал для опалубки, объем"
    source_class: AUTO_CALCULATED
    formula: "edge_and_beam_formwork_area_m2 * timber_thickness_m"
    leaf_inputs:
      - {ref: "auto_calculated.edge_and_beam_formwork_area_m2", source_class: AUTO_CALCULATED}
      - {ref: "defaults.timber_thickness_m", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "edge_and_beam_formwork_area_m2 includes the separate bottom/horizontal beam formwork area when the PDF gives it."

  - key: total_rebar_order_length_m
    label_ru: "Арматура, общая длина заказа"
    source_class: AUTO_CALCULATED
    formula: "sum over floor_slab_2_rebar_items rows of ceil((spec_length_m * rebar_waste_coeff) / rod_length_m) * rod_length_m"
    leaf_inputs:
      - {ref: "review_parameters.floor_slab_2_rebar_items", source_class: AUTO_PROJECT}
      - {ref: "defaults.rebar_waste_coeff", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "rod_length_m is per-row, from review_parameters.floor_slab_2_rebar_items itself (real PDF/spec value as of 2026-07-10), not from an internal catalog."

  - key: concrete_order_volume_m3
    label_ru: "Бетон, заказной объем с округлением"
    source_class: AUTO_CALCULATED
    formula: "roundup_to_step(concrete_placing_volume_m3 * concrete_waste_coeff, concrete_round_step_m3)"
    leaf_inputs:
      - {ref: "review_parameters.concrete_placing_volume_m3", source_class: AUTO_PROJECT}
      - {ref: "defaults.concrete_waste_coeff", source_class: DEFAULT}
      - {ref: "defaults.concrete_round_step_m3", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "Uses the combined slab+beam total, same input as slab_concrete_volume_m3's starting point, before the beam split."

  - key: concrete_delivery_trips
    label_ru: "Рейсы доставки бетона"
    source_class: AUTO_CALCULATED
    formula: "ceil(concrete_order_volume_m3 / concrete_mixer_volume_m3)"
    leaf_inputs:
      - {ref: "auto_calculated.concrete_order_volume_m3", source_class: AUTO_CALCULATED}
      - {ref: "defaults.concrete_mixer_volume_m3", source_class: DEFAULT}
    calculator_input_path: ""
    notes: ""

  - key: eps100_order_volume_m3
    label_ru: "ЭППС 100 мм, заказной объем"
    source_class: AUTO_CALCULATED
    formula: "ceil(eps100_required_volume_without_waste_m3 * eps_waste_coeff / eps100_pack_volume_m3) * eps100_pack_volume_m3"
    leaf_inputs:
      - {ref: "auto_calculated.eps100_required_volume_without_waste_m3", source_class: AUTO_CALCULATED}
      - {ref: "defaults.eps_waste_coeff", source_class: DEFAULT}
      - {ref: "defaults.eps100_pack_volume_m3", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "Includes vertical edge/beam EPS and optional bottom/horizontal slab EPS when provided."

  - key: foam_cans_ordered
    label_ru: "Клей-пена, баллоны, заказ"
    source_class: AUTO_CALCULATED
    formula: "max(foam_min_cans, ceil((edge_and_beam_insulation_area_m2 + bottom_slab_eps_work_area_m2) / foam_coverage_area_per_can_m2))"
    leaf_inputs:
      - {ref: "auto_calculated.edge_and_beam_insulation_area_m2", source_class: AUTO_CALCULATED}
      - {ref: "review_parameters.bottom_slab_eps_work_area_m2", source_class: AUTO_PROJECT}
      - {ref: "defaults.foam_coverage_area_per_can_m2", source_class: DEFAULT}
      - {ref: "defaults.foam_min_cans", source_class: DEFAULT}
    calculator_input_path: ""
    notes: "Bottom/horizontal slab EPS area is included in foam base area when present."

  - key: direct_cost_base_before_addons
    label_ru: "База себестоимости до логистики и расходников"
    source_class: AUTO_CALCULATED
    formula: "sum of material_total_raw + work_total_raw across every priced estimate line above (formwork, rebar, concrete, insulation)"
    leaf_inputs:
      - {ref: "estimate_lines.*", source_class: AUTO_CALCULATED}
    calculator_input_path: ""
    notes: "Internal aggregate computed by the calculator across its own line totals; not independently reconstructable from a short leaf-input list. Documented here only so logistics_and_supply and consumables_tool_depreciation below have something to point at."

calculator_input_mapping:
  - input_path: "*"
    from:
      ref: "review_parameters + supplier_inputs + defaults + price_keys"
      source_class: MIXED
    required: true
    transform: build_floor_slab_2_input
    fallback: null
    notes: "Adapter must fill flat calculator input without old fixture values."

