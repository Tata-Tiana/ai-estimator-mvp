contract_version: 0.1

section:
  code: floor_slab_2
  name_ru: "Перекрытие 2 этажа"
  calculator_module: "experiments/floor_slab_2_calculator/calculator.py"
  status: draft
  owner_notes: "Production contract: spec formwork area, spec edge perimeter, spec concrete volume, and spec-length rebar only; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/floor_slab_2_calculator/calculator.py"
  calculator_readme: "experiments/floor_slab_2_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_floor_slab_2_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: main_formwork_area_m2
    label_ru: "Площадь опалубки под плитой перекрытия 2-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_main_formwork_area"
    calculator_input_path: "main_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.main_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_main_formwork_area"]
      aliases_ru: ["опалубка под плитой перекрытия 2 этажа", "горизонтальная опалубка 2 этажа", "нижняя опалубка плиты перекрытия 2 этажа", "нижняя опалубка плиты", "основная площадь опалубки перекрытия"]
      expected_unit: "м2"
      notes: "Main slab deck formwork area. A PDF row named 'Нижняя опалубка плиты ...' maps here, not to slab_area_m2."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь основной опалубки под плитой перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with roof area, 1st floor slab formwork, or EPS volume."

  - key: edge_formwork_area_m2
    label_ru: "Площадь опалубки торца плиты перекрытия 2-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_edge_formwork_area"
    calculator_input_path: "edge_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.edge_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_edge_formwork_area"]
      aliases_ru: ["опалубка торца плиты 2 этажа", "вертикальная опалубка плиты 2 этажа", "опалубка вертикальных поверхностей перекрытия 2 этажа"]
      expected_unit: "м2"
      notes: "Edge formwork area only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь опалубки торца плиты перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with EPS 100 mm edge volume in m3."

  - key: beams_formwork_area_m2
    label_ru: "Площадь опалубки балок перекрытия 2-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_beams_formwork_area"
    calculator_input_path: "beams_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.beams_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_beams_formwork_area"]
      aliases_ru: ["опалубка балок перекрытия 2 этажа", "площадь опалубки балок 2 этажа"]
      expected_unit: "м2"
      notes: "Beams may or may not exist on this floor slab, independently of floor_slab_1. If absent, leave null (not 0) so the calculator falls back to the sum of beam_items.formwork_area_m2 below; only enter this scalar when the PDF gives a ready total that should override the per-beam sum."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если в этой плите есть балки, проверьте площадь опалубки балок; иначе оставьте пустым (не 0) — она посчитается из позиций балок ниже."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not send 0 explicitly when beam_items are present — 0 is treated as a real override and will suppress the per-beam sum. Leave null/absent instead."

  - key: beams_bottom_formwork_area_m2
    label_ru: "Горизонтальная площадь опалубки под балкой перекрытия 2-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_beams_bottom_formwork_area"
    calculator_input_path: "beams_bottom_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.beams_bottom_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_beams_bottom_formwork_area"]
      aliases_ru: ["горизонтальная площадь опалубки под балкой", "нижняя опалубка балок", "нижняя опалубка ж/б балок", "нижняя опалубка ж/б балок в составе ПМ2"]
      expected_unit: "м2"
      notes: "Distinct from main_formwork_area_m2 (horizontal under the slab itself), beams_formwork_area_m2 (vertical/side beam formwork), and edge_formwork_area_m2 (slab edge formwork). This is specifically the beam's own horizontal/bottom formwork, when the PDF gives it as its own separate line."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если у балок этой плиты есть отдельная строка нижней (горизонтальной) опалубки, проверьте ее здесь; иначе оставьте пустым."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-31 after parser surfaced a real PDF row as raw_table_rows. Purely additive — when absent, calculator defaults to 0. Feeds plywood/timber material and the edge+beam formwork installation quantity together with the vertical edge/beam formwork area."

  - key: beams_concrete_volume_m3
    label_ru: "Объем бетона балок перекрытия 2-го этажа"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_beams_concrete_volume"
    calculator_input_path: "beams_concrete_volume_m3"
    normalized_json_path: "sections.floor_slab_2.parameters.beams_concrete_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_beams_concrete_volume", "floor_slab_2_beam_items"]
      aliases_ru: ["бетон балок", "объем бетона балок", "бетон в теле плиты (балки)", "бетон в теле плиты перекрытия"]
      expected_unit: "м3"
      notes: "Usually a ready 'Итого' line in the beam specification table (see beam_items below), separate from the slab's own concrete volume. If absent, leave null (not 0) so the calculator falls back to the sum of beam_items.concrete_volume_m3. Added 2026-07-12 after confirming both ЮСВ КР2 (лист 22) and ТРЦ КР2 (лист 31) give this as a ready total."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если у этой плиты есть балки и в спецификации есть готовый итог по бетону балок, сверьте его; иначе оставьте пустым — он посчитается из позиций балок ниже."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Calculator-code override added 2026-07-12 (exception to the normal never-touch-calculator-code rule, explicit user authorization) — mirrors the existing beams_formwork_area_m2 override pattern. Do not send 0 explicitly when beam_items are present — 0 is treated as a real override. beam_items rows remain required regardless for formwork area and insulation length/area, which have no scalar override."

  - key: beam_items
    label_ru: "Позиции балок плиты перекрытия 2-го этажа"
    unit: "м"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_beam_items"
    calculator_input_path: "beams.items"
    normalized_json_path: "sections.floor_slab_2.parameters.beam_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    production_input: true
    item_label_columns: [name]
    correction_columns: [length_m, width_m, height_m, count, concrete_volume_m3, formwork_area_m2]
    columns:
      - {key: code, label_ru: "Код балки", unit: "", value_kind: string}
      - {key: name, label_ru: "Наименование", unit: "", value_kind: string}
      - {key: length_m, label_ru: "Длина", unit: "м", value_kind: number}
      - {key: width_m, label_ru: "Ширина", unit: "м", value_kind: number}
      - {key: height_m, label_ru: "Высота", unit: "м", value_kind: number}
      - {key: count, label_ru: "Количество", unit: "шт", value_kind: number}
      - {key: concrete_volume_m3, label_ru: "Бетон", unit: "м3", value_kind: number}
      - {key: formwork_area_m2, label_ru: "Опалубка", unit: "м2", value_kind: number}
    parser_mapping:
      target_codes: ["floor_slab_2_beam_items"]
      aliases_ru: ["балки перекрытия 2 этажа", "спецификация балок плиты 2 этажа", "Ж/Б балки"]
      expected_unit: "м"
      notes: "Optional group; this floor slab may have zero, one, or several beams, independently of floor_slab_1. Same row shape as floor_slab_1's beam_items. If the PDF gives ready concrete/formwork per beam, fill concrete_volume_m3/formwork_area_m2 from the spec. width_m is optional when the row combines different beam cross-sections; do not invent a split."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если у этой плиты перекрытия есть балки, проверьте их построчно; если балок нет, оставьте пустым."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation: {min_rows: 0, sum_checks: []}
    notes: "Feeds beams_formwork_area_m2 (sum of formwork_area_m2) and beams_concrete_volume_m3 (sum of concrete_volume_m3) when their own scalar/aggregate inputs are absent. Production uses length_m for beam concreting work. Do not assume beam insulation follows the full beam length: use beams_eps_work_length_m/beams_eps_material_area_m2 when the PDF gives the actually insulated portion. width_m is not required when concrete_volume_m3 is already given. Combined rows must remain needs_review/manual split until a separated designer specification is available. All are 0 when this group is empty."

  - key: slab_edge_perimeter_m
    label_ru: "Периметр торца плиты перекрытия 2-го этажа"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_slab_edge_perimeter"
    calculator_input_path: "slab_edge_perimeter_m"
    normalized_json_path: "sections.floor_slab_2.parameters.slab_edge_perimeter_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_slab_edge_perimeter"]
      aliases_ru: ["периметр торца плиты 2 этажа", "длина торца плиты 2 этажа", "периметр вертикальных поверхностей 2 этажа"]
      expected_unit: "мп"
      notes: "Linear edge perimeter, not area."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте периметр/длину торца плиты перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Used for edge insulation work and EPS volume calculation."

  - key: edge_insulation_height_m
    label_ru: "Высота утепления торца плиты перекрытия 2-го этажа"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_edge_insulation_height"
    calculator_input_path: "edge_insulation_height_m"
    normalized_json_path: "sections.floor_slab_2.parameters.edge_insulation_height_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_edge_insulation_height"]
      aliases_ru: ["высота утепления торца 2 этажа", "торец плиты высота утепления", "ЭППС торца высота"]
      expected_unit: "м"
      notes: "Normalize mm to m."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте высоту утепления торца плиты перекрытия 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not infer from section title if the specification gives a different value."

  - key: beams_eps_work_length_m
    label_ru: "ЭППС 100 мм торец балок 2-го этажа, длина утепляемой части"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_beams_eps_work_length"
    calculator_input_path: "beams_eps_work_length_m"
    normalized_json_path: "sections.floor_slab_2.parameters.beams_eps_work_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_beams_eps_work_length"]
      aliases_ru: ["утепление балок 2 этажа длина", "утепляемая часть балок 2 этажа", "длина утепления ж/б балок", "ЭППС торец балок длина"]
      expected_unit: "мп"
      notes: "Only the length of beam faces actually insulated from outside. Do not substitute total beam length: beams may be L/T-shaped and insulated only on the outside portion."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если в проекте есть отдельная длина утепляемой части балок, проверьте ее; если балок не утепляют, поставьте 0; если данных нет, оставьте пустым и проверьте вручную."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Elena 2026-07-29: beams are not always insulated, and when insulated may cover only part of the beam length."

  - key: beams_eps_material_area_m2
    label_ru: "ЭППС 100 мм торец балок 2-го этажа, площадь материала"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_beams_eps_material_area"
    calculator_input_path: "beams_eps_material_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.beams_eps_material_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_beams_eps_material_area"]
      aliases_ru: ["площадь утепления ж/б балок 2 этажа", "ЭППС балки площадь", "утепление балок площадь"]
      expected_unit: "м2"
      notes: "Only the EPS area actually used on insulated beam faces. Do not derive from total beam length if the project shows partial insulation."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если в проекте есть отдельная площадь ЭППС по балкам, проверьте ее; если балок не утепляют, поставьте 0; если данных нет, оставьте пустым и проверьте вручную."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Optional override. If absent, calculator falls back to all beam length * height for backward compatibility, but production extraction should prefer the actual insulated area/length from the PDF."

  - key: bottom_slab_eps_work_area_m2
    label_ru: "ЭППС 100 мм низ плиты перекрытия 2-го этажа, площадь работ"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_bottom_eps_work_area"
    calculator_input_path: "bottom_slab_eps_work_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.bottom_slab_eps_work_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_bottom_eps_work_area"]
      aliases_ru: ["площадь горизонтального утепления плиты", "горизонтальное утепление плиты", "утепление низа плиты перекрытия 2 этажа", "утепление нижней поверхности плиты"]
      expected_unit: "м2"
      notes: "Work area of the slab's own bottom/horizontal EPS insulation. Distinct from slab edge/beam edge insulation, and from beam-only EPS areas."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если в проекте есть отдельная площадь нижнего/горизонтального утепления плиты, проверьте ее здесь; иначе оставьте пустым."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-31 after parser surfaced a real PDF row as raw_table_rows. Purely additive — when absent, calculator defaults to 0. Adds bottom EPS work by m2, EPS 100 mm material volume and foam-glue base area."

  - key: concrete_placing_volume_m3
    label_ru: "Бетон плиты перекрытия 2-го этажа, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_concrete_volume"
    calculator_input_path: "concrete_placing_volume_m3"
    normalized_json_path: "sections.floor_slab_2.parameters.concrete_placing_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_concrete_volume"]
      aliases_ru: ["бетон плиты перекрытия 2 этажа", "бетон ж/б плиты 2 этажа", "бетон перекрытия 2 этажа"]
      expected_unit: "м3"
      notes: "Direct project/spec quantity. Do not derive from area * thickness."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем бетона плиты перекрытия 2-го этажа по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with slab 1, roof, beams, lintels, or foundation concrete."

  - key: kind
    label_ru: "Тип плиты — жилое перекрытие или кровельная плита"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_kind"
    calculator_input_path: ""
    normalized_json_path: "sections.floor_slab_2.parameters.kind.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_kind"]
      aliases_ru: ["Плоская Ж/б, неэксплуатируемая", "Плоская Ж/б, эксплуатируемая"]
      expected_unit: ""
      notes: "roof_cover_slab when general data describes this slab as part of the roof build-up; otherwise residential_floor. Mirrors floor_slab_1_kind."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Чисто описательное поле, не влияет на расчёт. Укажите, если общие данные явно называют эту плиту частью кровельного пирога, а не жилым перекрытием."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case). Purely descriptive, mirrors floor_slab_1_kind — calculator_input_path intentionally empty, never gates pricing/calculation. Do not confuse this slab's own PDF label (e.g. ПМ2) with roof zone identifiers used in flat_roof's roof_zones."

  - key: slab_area_m2
    label_ru: "Площадь плиты перекрытия 2-го этажа для контроля"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_slab_area"
    calculator_input_path: "slab_area_m2"
    normalized_json_path: "sections.floor_slab_2.parameters.slab_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_2_slab_area"]
      aliases_ru: ["площадь плиты перекрытия 2 этажа", "площадь перекрытия 2 этажа"]
      expected_unit: "м2"
      notes: "Optional control value; main formwork area remains separate. Do not use lower/main formwork rows as slab_area_m2."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если площадь плиты указана отдельно, проверьте ее как контроль."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not substitute for main_formwork_area_m2. Lower/main formwork is the working quantity for formwork, not this optional control area."

  - key: floor_slab_2_rebar_items
    label_ru: "Арматура плиты перекрытия 2-го этажа по диаметрам"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_2_rebar_items"
    calculator_input_path: "rebar_items"
    normalized_json_path: "sections.floor_slab_2.parameters.floor_slab_2_rebar_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    production_input: true
    item_label_columns: [steel_class, diameter_mm]
