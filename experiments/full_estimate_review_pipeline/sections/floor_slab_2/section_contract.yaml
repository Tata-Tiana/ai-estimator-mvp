    columns:
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: spec_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: kg_per_meter, label_ru: "Масса 1 м", unit: "кг/м", value_kind: number}
      - {key: rod_length_m, label_ru: "Длина прутка", unit: "м", value_kind: number}
      - {key: unit_price_per_m, label_ru: "Цена за метр", unit: "руб/мп", value_kind: number}
    parser_mapping:
      target_codes: ["floor_slab_2_rebar_items"]
      aliases_ru: ["арматура плиты перекрытия 2 этажа", "спецификация арматуры плиты 2 этажа"]
      expected_unit: "мп"
      notes: "One row per rebar position, any diameter/class (calculator dropped its 3-diameter hardcoded catalog 2026-07-10, same flexible model as floor_slab_1). kg_per_meter and rod_length_m are real PDF/catalog values now read per row by the calculator — no longer looked up internally. unit_price_per_m is not a PDF value — the adapter fills it from rebar_unit_price_by_item (registry_code rebar_<class>_d<diameter>_m) before calling the calculator, which reads it directly from each row. code is not a PDF value either; leave it unset and the calculator derives it from steel_class + diameter_mm."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте позиции арматуры плиты перекрытия 2-го этажа по диаметрам, каждая строка спецификации отдельной строкой."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it. Calculator adapter reads sheet 01 (this entry) only."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Production PDF primary quantity is m.п.; kg_per_meter and rod_length_m are extracted from the PDF/spec, same as floor_slab_1. unit_price_per_m and code are adapter-filled, not extracted from the PDF."

