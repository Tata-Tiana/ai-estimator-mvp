contract_version: 0.1

section:
  code: schiedel_vent_channels
  name_ru: "Вентиляционные каналы Schiedel"
  calculator_module: "experiments/schiedel_vent_channels_calculator/calculator.py"
  status: draft
  owner_notes: "Production contract: no old project values, fixture totals, or control-value overrides."

source_files:
  calculator: "experiments/schiedel_vent_channels_calculator/calculator.py"
  calculator_readme: "experiments/schiedel_vent_channels_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_schiedel_vent_channels_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: schiedel_masonry_total_length_m
    label_ru: "Общая длина кладки вентканалов Schiedel"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "schiedel_masonry_total_length_m"
    calculator_input_path: "schiedel_masonry_total_length_m"
    normalized_json_path: "sections.schiedel_vent_channels.parameters.schiedel_masonry_total_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes:
        - "schiedel_masonry_total_length_m"
        - "vent_channel_1_height"
        - "vent_channel_2_height"
      aliases_ru:
        - "общая высота вентканалов"
        - "общая длина кладки вентканалов"
        - "кладку вентблока вести"
        - "высота вентканалов общая"
      expected_unit: "мп"
      notes: "Primary quantity for masonry work. If PDF gives a ready total like 'Общая высота вентканалов'/'Высота вентканалов общая' in linear meters, map it here even if component channel-type meter rows do not sum to it; keep needs_review and explain the mismatch. If PDF gives only separate heights with no ready total, keep candidates and calculate only after review."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте общую длину/высоту кладки вентканалов Schiedel."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Do not use old displayed rounded quantity as calculator quantity. Ready PDF total height/length is the production source for the masonry work row; channel-type meter rows are not module counts."

  - key: schiedel_channel_items
    label_ru: "Вентканалы Schiedel по типам (модули)"
    unit: "шт"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "schiedel_channel_items"
    calculator_input_path: "schiedel_channel_items"
    normalized_json_path: "sections.schiedel_vent_channels.parameters.schiedel_channel_items.rows"
    value_kind: repeated_rows
    row_key_field: product_type
    production_input: true
    item_label_columns: [product_type]
    correction_columns: [quantity_pcs]
    columns:
      - {key: product_type, label_ru: "Тип модуля", unit: "", value_kind: string}
      - {key: quantity_pcs, label_ru: "Количество", unit: "шт", value_kind: number}
    parser_mapping:
      group_codes: ["schiedel_channel_items"]
      expected_context: ["вентканал", "Schiedel"]
      notes: "product_type must be exactly one of 1x/2x/3x/4x/cvent. quantity_pcs is the piece/module count from the specification, never the shaft/node count shown on the plan. If the PDF only gives linear meters per channel type (not a piece count), leave this group empty and flag an explicit needs_review entry instead of guessing a conversion - see target_aliases_ru.yaml, 2026-07-28 rule."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Проверьте количество модулей вентканалов Schiedel по типам построчно."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-29 - the section_contract.yaml was never updated when calculator.py was rewritten 2026-07-26 (Elena) to read this dynamic group instead of the old fixed schiedel_vent_channel_2x_count/_3x_count scalar pair. Until this fix, sheet 01 had no row for this group at all (calculator_targets_compact.json/target_aliases_ru.yaml already targeted it - the parser prompt side was correct, only the review-workbook contract was stale), so any real parser-found channel counts were silently invisible to Elena. See sheet01_schiedel_channel_items_contract_desync memory."

  - key: schiedel_masonry_gas_block_items
    label_ru: "Газоблок для кладки шахты вентканалов по плотности"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "schiedel_masonry_gas_block_items"
    calculator_input_path: "schiedel_masonry_gas_block_items"
    normalized_json_path: "sections.schiedel_vent_channels.parameters.schiedel_masonry_gas_block_items.rows"
    value_kind: repeated_rows
    row_key_field: density
    production_input: true
    item_label_columns: [density]
    correction_columns: [volume_m3]
    columns:
      - {key: density, label_ru: "Плотность блока", unit: "", value_kind: string}
      - {key: volume_m3, label_ru: "Объем", unit: "м3", value_kind: number}
    parser_mapping:
      group_codes: ["schiedel_masonry_gas_block_items"]
      expected_context: ["вентканал", "Schiedel", "кладка шахты"]
      notes: "density must be exactly D400 or D500, taken as-is from the spec next to the block - never defaulted from block width/size (distinct block family from wall_block_items, see calculator.py's own comment). This is masonry AROUND the Schiedel ceramic modules, not the modules themselves (schiedel_channel_items above) and not vent_chimney_cladding's 600x150x250 block (that one lives in load_bearing_walls_lintels, hardcoded D500)."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Проверьте объём газоблока для кладки шахты вентканалов по плотности построчно; не все проекты имеют эту строку."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-08-05 - same class of gap as schiedel_channel_items above (see that entry's own notes): calculator.py already reads this group (SCHIEDEL_MASONRY_GAS_BLOCK_SPECS, D400/D500), a prior memory note said this was already 'SHIPPED', but the review_parameters entry was never actually added - sheet 01 had no row for this group at all, so any real parser-found gas block volumes were silently invisible to Elena and never reached the calculator via the review workbook (only via hand-built calculator test cases, which bypass the contract entirely)."

  - key: schiedel_vent_chimney_cladding_segments
    label_ru: "Сегменты / строки спецификации вентканалов"
    unit: "м"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "schiedel_vent_chimney_cladding_segments"
    calculator_input_path: ""
    normalized_json_path: "sections.schiedel_vent_channels.parameters.schiedel_vent_chimney_cladding_segments.rows"
    value_kind: repeated_rows
    row_key_field: name
    production_input: false
    item_label_columns: [name]
    correction_columns: [length_m, quantity, total_length_m]
    columns:
      - key: name
        label_ru: "Наименование"
        unit: ""
        value_kind: string
      - key: length_m
        label_ru: "Высота / длина"
        unit: "м"
        value_kind: number
      - key: quantity
        label_ru: "Количество"
        unit: "шт"
        value_kind: number
      - key: total_length_m
        label_ru: "Итоговая длина"
        unit: "м"
        value_kind: number
    parser_mapping:
      group_codes: ["schiedel_vent_chimney_cladding_segments"]
      expected_context: ["вентканал", "обкладка"]
      notes: "Renamed 2026-07-10 from vent_chimney_cladding_segments — that bare group_code is already used by a different, calculator-consumed extract_group under load_bearing_walls_lintels (gas-block cladding segments for legacy_segments_rows mode). This section's own version is a different, diagnostic-only concept (Schiedel channel spec table rows) that the calculator never reads at all (verified against calculate_schiedel_vent_channels() — no reference to this field anywhere); the shared bare name was a genuine collision risk in the flat alias namespace, not the same data. item_label_columns/correction_columns added 2026-07-29 — this group used to render as one permanently-blank scalar row (lookup mismatch, see build_review_workbook_from_contracts fix same day); now renders per-row."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_control"
      action_ru: "Проверьте строки спецификации вентканалов построчно, если есть."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation: {min_rows: 0, sum_checks: []}
    notes: "Optional diagnostic breakdown; calculator quantity still comes from reviewed scalar inputs on sheet 01, not from this breakdown. Never fed into calculate_schiedel_vent_channels() at all — calculator_input_path is intentionally empty."

price_keys:
  - key: schiedel_masonry_work_rate_per_m
    estimate_line_code: schiedel_masonry_work
    label_ru: "Кладка вентканалов Schiedel"
    price_kind: work
    unit: "мп"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "schiedel_masonry_work_m"
    fallback_key: "schiedel_masonry_work_rate_per_m"
    allow_manual_override: true
    notes: ""

  - key: schiedel_vent_channel_1x_unit_price
    estimate_line_code: schiedel_vent_channel_1x
    label_ru: "Вентиляционный канал 1х Schiedel"
    price_kind: material
    unit: "шт"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "schiedel_vent_channel_1x_item"
    fallback_key: "schiedel_vent_channel_1x_unit_price"
    allow_manual_override: true
    notes: "Added 2026-08-05: real calculator field/price_code existed since CHANNEL_TYPE_SPECS was built but was never wired into this contract. TRC's own schiedel_channel_items uses 1x — a real production KeyError risk without this entry."

  - key: schiedel_vent_channel_2x_unit_price
    estimate_line_code: schiedel_vent_channel_2x_36_25
    label_ru: "Вентиляционный канал 2х,36/25 см Schiedel"
    price_kind: material
    unit: "шт"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "schiedel_vent_channel_2x_36_25_item"
    fallback_key: "schiedel_vent_channel_2x_unit_price"
    allow_manual_override: true
    notes: ""

  - key: schiedel_vent_channel_3x_unit_price
    estimate_line_code: schiedel_vent_channel_3x_52_25
    label_ru: "Вентиляционный канал 3х,52/25 см Schiedel"
    price_kind: material
    unit: "шт"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "schiedel_vent_channel_3x_52_25_item"
    fallback_key: "schiedel_vent_channel_3x_unit_price"
    allow_manual_override: true
    notes: ""

  - key: schiedel_vent_channel_4x_unit_price
    estimate_line_code: schiedel_vent_channel_4x
    label_ru: "Вентиляционный канал 4х Schiedel"
    price_kind: material
    unit: "шт"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "schiedel_vent_channel_4x_item"
    fallback_key: "schiedel_vent_channel_4x_unit_price"
    allow_manual_override: true
    notes: "Added 2026-08-05, same gap as 1x above. ARK's own schiedel_channel_items uses 4x."

  - key: schiedel_vent_channel_cvent_unit_price
    estimate_line_code: schiedel_vent_channel_cvent
    label_ru: "Вентиляционный канал CVENT Schiedel"
    price_kind: material
    unit: "шт"
    required: false
    default_source: price_registry_with_fallback
    registry_code: "schiedel_vent_channel_cvent_item"
    fallback_key: "schiedel_vent_channel_cvent_unit_price"
    allow_manual_override: true
    notes: "Added 2026-08-05, same gap as 1x above. required: false — Elena: CVENT is a rare product line ('бывает достаточно редко'), no real project has used it yet; the calculator only reads this price when a schiedel_channel_items row actually has product_type=cvent."

  - key: schiedel_masonry_gas_block_d400_unit_price
    estimate_line_code: schiedel_masonry_gas_block_d400
    label_ru: "Газобетонный блок D400 150x250x650 мм для кладки вентканалов"
    price_kind: material
    unit: "м3"
    required: false
    default_source: price_registry_with_fallback
    registry_code: "schiedel_masonry_gas_block_d400_m3"
    fallback_key: "schiedel_masonry_gas_block_d400_unit_price"
    allow_manual_override: true
    notes: "Added 2026-08-05, same gap as 1x above. required: false — schiedel_masonry_gas_block_items[] itself is optional/additive; the calculator only reads this price when a row with density=D400 is actually present."

  - key: schiedel_masonry_gas_block_d500_unit_price
    estimate_line_code: schiedel_masonry_gas_block_d500
    label_ru: "Газобетонный блок D500 150x250x650 мм для кладки вентканалов"
    price_kind: material
    unit: "м3"
