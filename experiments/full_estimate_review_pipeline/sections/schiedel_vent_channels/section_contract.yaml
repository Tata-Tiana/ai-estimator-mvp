    fallback_key: "schiedel_masonry_gas_block_d500_unit_price"
    allow_manual_override: true
    notes: "Added 2026-08-05, same gap as 1x above. required: false — same reasoning as d400 above (density=D500)."

  - key: schiedel_delivery_truck_price
    estimate_line_code: schiedel_delivery
    label_ru: "Доставка вентканалов, машина"
    price_kind: material
    unit: "маш"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "schiedel_delivery_truck"
    fallback_key: "schiedel_delivery_truck_price"
    allow_manual_override: true
    notes: ""

  - key: schiedel_delivery_work_price
    estimate_line_code: schiedel_delivery
    label_ru: "Доставка вентканалов, работа"
    price_kind: work
    unit: "маш"
    required: true
    default_source: fallback_manual_review
    registry_code: ""
    fallback_key: "schiedel_delivery_work_price"
    allow_manual_override: true
    notes: "No registry code in current calculator; review/fallback price is required."

defaults:
  - key: project_name
    label_ru: "Название проекта"
    source_class: DEFAULT
    value: null
    unit: ""
    calculator_input_path: "project_name"
    source_note: "Set by job/project metadata, not extracted from section table."
    allow_override_later: true
    notes: ""

  - key: consumables_rate
    label_ru: "Коэффициент расходников и амортизации инструмента"
    source_class: DEFAULT
    value: 0.03
    unit: ""
    calculator_input_path: "consumables_rate"
    source_note: "Business coefficient from calculator method; not extracted from project PDF."
    allow_override_later: true
    notes: "Applied to direct Schiedel cost base before consumables."

supplier_inputs:
  - key: schiedel_delivery_trips
    label_ru: "Количество доставок вентканалов"
    unit: "маш"
    source_class: MANUAL_REVIEW
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: ""
    calculator_input_path: "schiedel_delivery_trips"
    normalized_json_path: "sections.schiedel_vent_channels.supplier_inputs.schiedel_delivery_trips.value"
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Введите или подтвердите количество доставок вентканалов."
    notes: "Manual logistics input; not extracted from PDF by default."

auto_calculated:
  - key: schiedel_direct_cost_base_before_consumables
    label_ru: "База прямых затрат Schiedel до расходников"
    source_class: AUTO_CALCULATED
    formula: "masonry work + sum(schiedel_channel_items material by product_type) + delivery"
    leaf_inputs:
      - ref: review_parameters.schiedel_masonry_total_length_m
        source_class: AUTO_PROJECT
      - ref: review_parameters.schiedel_channel_items
        source_class: AUTO_PROJECT
      - ref: supplier_inputs.schiedel_delivery_trips
        source_class: MANUAL_REVIEW
      - ref: price_keys
        source_class: PRICE
    calculator_input_path: ""
    notes: "Updated 2026-07-29 - formula/leaf_inputs previously referenced the removed schiedel_vent_channel_2x_count/_3x_count supplier inputs; now matches calculator.py's real dynamic schiedel_channel_items[] sum. schiedel_masonry_control_length_m (the old vent_channel_1/2_height/count cross-check) was deleted outright, not updated - the shaft-height/count tracking it depended on was removed from the calculator entirely 2026-07-26 (Elena: 'не надо считать шахты, это не важно'), no replacement control value exists or is needed."

  - key: schiedel_consumables_amount
    label_ru: "Расходные материалы, амортизация инструмента"
    source_class: AUTO_CALCULATED
    formula: "schiedel_direct_cost_base_before_consumables * consumables_rate"
    leaf_inputs:
      - ref: auto_calculated.schiedel_direct_cost_base_before_consumables
        source_class: AUTO_CALCULATED
      - ref: defaults.consumables_rate
        source_class: DEFAULT
    calculator_input_path: ""
    notes: ""

calculator_input_mapping:
  - input_path: "project_name"
    from:
      ref: "defaults.project_name"
      source_class: DEFAULT
    required: true
    transform: job_metadata_project_name
    fallback: null
    notes: ""

  - input_path: "schiedel_masonry_total_length_m"
    from:
      ref: "review_parameters.schiedel_masonry_total_length_m"
      source_class: AUTO_PROJECT
    required: true
    transform: number_m
    fallback: null
    notes: ""

  - input_path: "schiedel_channel_items"
    from:
      ref: "review_parameters.schiedel_channel_items"
      source_class: AUTO_PROJECT
    required: false
    transform: schiedel_channel_items_to_calculator_items
    fallback: []
    notes: "Added 2026-07-29, replaces the removed vent_channel_1/2_height_m, vent_channel_2_count (dead shaft-tracking control fields, calculator.py stopped reading them 2026-07-26) and schiedel_vent_channel_2x_count/_3x_count (dead fixed-pair fields, same date) mappings. calculate_schiedel_vent_channels() reads input_data.get('schiedel_channel_items') as a list of {product_type, quantity_pcs} and sums by product_type - an empty/missing list is valid (all channel quantities compute as zero), matching the case where the PDF only gives linear meters and extraction correctly leaves the group empty per the 2026-07-28 rule in target_aliases_ru.yaml."

  - input_path: "schiedel_delivery_trips"
    from:
      ref: "supplier_inputs.schiedel_delivery_trips"
      source_class: MANUAL_REVIEW
    required: true
    transform: number_count
    fallback: null
    notes: ""

  - input_path: "*"
    from:
      ref: "defaults + price_keys"
      source_class: DEFAULT
    required: true
    transform: fill_remaining_calculator_fields
    fallback: null
    notes: "Adapter must fill defaults and resolved prices without copying old fixture values."

estimate_lines:
  - code: schiedel_masonry_work
    name_ru: "Кладка вентканалов Schiedel"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=schiedel_masonry_work]"
    quantity:
      formula: "schiedel_masonry_total_length_m"
      formula_model:
        type: reference
        ref: "review_parameters.schiedel_masonry_total_length_m"
      leaf_inputs:
        - ref: "review_parameters.schiedel_masonry_total_length_m"
          source_class: AUTO_PROJECT
    prices:
      material_unit_price_key: null
      work_unit_price_key: schiedel_masonry_work_rate_per_m
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "Use raw reviewed length, not rounded display quantity."

  - code: schiedel_vent_channel_2x_36_25
    name_ru: "Вентиляционный канал 2х,36/25 см Schiedel"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=schiedel_vent_channel_2x_36_25]"
    quantity:
      formula: "schiedel_vent_channel_2x_count"
      formula_model:
        type: reference
        ref: "supplier_inputs.schiedel_vent_channel_2x_count"
      leaf_inputs:
        - ref: "supplier_inputs.schiedel_vent_channel_2x_count"
          source_class: SUPPLIER_INPUT
    prices:
      material_unit_price_key: schiedel_vent_channel_2x_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "STALE 2026-07-29 — quantity still references the deleted supplier_inputs.schiedel_vent_channel_2x_count. The calculator now produces one dynamic line per product_type actually present in schiedel_channel_items[] (1x/2x/3x/4x/cvent, see calculate_schiedel_vent_channels()'s channel_breakdown), not a fixed 2x/3x pair — this estimate_lines list needs a real redesign for dynamic per-product-type lines (same shape problem price_keys already solved for rebar_<class>_d<diameter>_m). Left as-is, not fixed: this affects only the not-yet-built final-estimate-workbook layer (no build_input.py exists for this section), not the review workbook. Do not read this quantity formula as current."

  - code: schiedel_vent_channel_3x_52_25
    name_ru: "Вентиляционный канал 3х,52/25 см Schiedel"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=schiedel_vent_channel_3x_52_25]"
    quantity:
      formula: "schiedel_vent_channel_3x_count"
      formula_model:
        type: reference
        ref: "supplier_inputs.schiedel_vent_channel_3x_count"
      leaf_inputs:
        - ref: "supplier_inputs.schiedel_vent_channel_3x_count"
          source_class: SUPPLIER_INPUT
    prices:
      material_unit_price_key: schiedel_vent_channel_3x_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: "STALE 2026-07-29 — same issue as schiedel_vent_channel_2x_36_25 above, see its notes."

  - code: schiedel_delivery
    name_ru: "Доставка вентканалов"
    unit: "маш"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=schiedel_delivery]"
    quantity:
