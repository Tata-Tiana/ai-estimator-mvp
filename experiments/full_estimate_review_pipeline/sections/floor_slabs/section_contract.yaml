contract_version: 0.1

section:
  code: floor_slabs
  name_ru: "Плиты перекрытия/покрытия"
  calculator_module: "experiments/floor_slab_1_calculator/floor_slab_calculator.py"
  status: draft
  owner_notes: "P5 clean-slate replacement for the old floor_slab_1/floor_slab_2 contracts (2026-08-10). One physical slab pour = one row of floor_slab_zones[], identified by zone_id, not by floor number. The calculator (calculate_floor_slab_pour(), the shared engine both old sections used to call through separate wrappers) runs once per included zone; this contract describes that single-pour shape, and core/job_runner.py's orchestrator fans it out across every zone found in a project. calculator_module points at the shared engine directly (not floor_slab_1_calculator.py/floor_slab_2_calculator's translation wrappers) because after the P5 adapter ships, floor_slabs/build_input.py calls it directly with no per-floor wrapper needed. See P5_SLAB_DATA_CONTRACT.md for the full design and P5_SLAB_CLEAN_SCHEMA_INVENTORY.md for the migration inventory."

source_files:
  calculator: "experiments/floor_slab_1_calculator/floor_slab_calculator.py"
  calculator_readme: "experiments/floor_slab_1_calculator/README.md"
  existing_cases: []
  related_docs:
    - "experiments/full_estimate_review_pipeline/P5_SLAB_DATA_CONTRACT.md"
    - "experiments/full_estimate_review_pipeline/P5_SLAB_CLEAN_SCHEMA_INVENTORY.md"
    - "experiments/full_estimate_review_pipeline/FLOOR_SLAB_UNIFICATION_PLAN.md"
    - "docs/report_floor_slab_1_calculator.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

# Every value that used to be a whole-section flat scalar (bетон/опалубка/утепление/manual costs) is
# now a column of floor_slab_zones[] instead - one physical slab = one row, no "1st floor"/"2nd floor"
# distinction. Beams/EPS/rebar/rare-extras are their own repeated groups, each row tagged with the
# zone_id of the physical slab it belongs to (build_extraction_notes_report.py's
# floor_slab_zone_tagging_diagnostics() already checks this tagging for real extraction output).
review_parameters:
  - key: floor_slab_zones
    label_ru: "Плиты перекрытия/покрытия (каждая физическая плита — своя строка)"
    unit: ""
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_zones"
    calculator_input_path: "floor_slab_zones"
    normalized_json_path: "sections.floor_slabs.parameters.floor_slab_zones.rows"
    value_kind: repeated_rows
    row_key_field: zone_id
    production_input: true
    item_label_columns: [display_name, source_level]
    correction_columns: [display_name, source_level, slab_mark, slab_kind, concrete_slab_volume_m3, concrete_total_with_beams_m3, slab_thickness_m, slab_edge_perimeter_m, formwork_under_slab_area_m2, formwork_edge_area_m2, formwork_edge_and_beam_combined_area_m2, formwork_beams_side_area_m2, formwork_beams_bottom_area_m2, manual_formwork_rebar_crane_shifts, manual_rebar_metal_delivery_trucks, manual_concrete_pump_shifts, manual_technical_supervision_amount, manual_formwork_rental_supplier_quote_total, include_in_estimate]
    columns:
      - {key: zone_id, label_ru: "Идентификатор плиты (внутренний)", unit: "", value_kind: string}
      - {key: display_name, label_ru: "Название плиты (по PDF)", unit: "", value_kind: string}
      - {key: source_level, label_ru: "Отметка/уровень", unit: "", value_kind: string}
      - {key: slab_mark, label_ru: "Марка плиты (ПМ1/ПМ2 и т.п.)", unit: "", value_kind: string}
      - {key: slab_kind, label_ru: "Тип плиты", unit: "", value_kind: string}
      - {key: concrete_slab_volume_m3, label_ru: "Бетон плиты (без балок)", unit: "м3", value_kind: number}
      - {key: concrete_total_with_beams_m3, label_ru: "Бетон плиты + балок, контрольный итог по PDF", unit: "м3", value_kind: number}
      - {key: slab_thickness_m, label_ru: "Толщина плиты", unit: "м", value_kind: number}
      - {key: slab_edge_perimeter_m, label_ru: "Периметр торца плиты", unit: "мп", value_kind: number}
      - {key: formwork_under_slab_area_m2, label_ru: "Опалубка под плитой", unit: "м2", value_kind: number}
      - {key: formwork_edge_area_m2, label_ru: "Опалубка торца плиты (без балок)", unit: "м2", value_kind: number}
      - {key: formwork_edge_and_beam_combined_area_m2, label_ru: "Опалубка торца плиты + балок (объединено, разделить нельзя)", unit: "м2", value_kind: number}
      - {key: formwork_beams_side_area_m2, label_ru: "Опалубка балок, боковая (override; иначе сумма из floor_slab_beam_items)", unit: "м2", value_kind: number}
      - {key: formwork_beams_bottom_area_m2, label_ru: "Опалубка балок, нижняя (override; иначе сумма из floor_slab_beam_items)", unit: "м2", value_kind: number}
      - {key: manual_formwork_rebar_crane_shifts, label_ru: "Смены крана на эту плиту", unit: "смена", value_kind: number}
      - {key: manual_rebar_metal_delivery_trucks, label_ru: "Доставка арматуры/металла на эту плиту", unit: "маш", value_kind: number}
      - {key: manual_concrete_pump_shifts, label_ru: "Смены бетононасоса на эту плиту", unit: "смена", value_kind: number}
      - {key: manual_technical_supervision_amount, label_ru: "Технадзор на эту плиту (₽, вручную)", unit: "₽", value_kind: number}
      - {key: manual_formwork_rental_supplier_quote_total, label_ru: "КП поставщика на аренду опалубки, итого (служебное)", unit: "₽", value_kind: number}
      - {key: include_in_estimate, label_ru: "Включить плиту в смету", unit: "", value_kind: boolean}
    parser_mapping:
      target_codes: ["floor_slab_zones"]
      group_codes: ["floor_slab_zones"]
      aliases_ru: ["плита перекрытия", "плита покрытия", "ПМ1", "ПМ2", "плита второго света", "плита лестницы", "плита кухни", "плита гостиной"]
      expected_unit: ""
      notes: "One row per physical slab/pour. See target_aliases_ru.yaml's floor_slab_zones entry for the full extraction rule."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте каждую плиту проекта: должна быть отдельная строка на каждую физическую плиту/заливку (не на этаж). Заполните бетон, опалубку и ручные поля (кран/насос/доставка/технадзор — свои для каждой плиты, не общий пул)."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation:
      numeric: false
      min_rows: 1
      sum_checks: []
    notes: "concrete_total_with_beams_m3 is diagnostic/control ONLY - never used to derive slab or beam concrete; only valid when the PDF prints an explicit combined total row (see build_extraction_notes_report.py's floor_slab_beam_concrete_total_diagnostics(), which flags this field being filled without an 'Итого'-style signal in the row's own evidence). formwork_beams_side_area_m2/formwork_beams_bottom_area_m2 are optional overrides - when null (not 0), the calculator falls back to summing floor_slab_beam_items[same zone_id].formwork_area_m2/bottom_formwork_area_m2, same convention the old floor_slab_1/floor_slab_2 beams_formwork_area_m2 fields used. formwork_edge_area_m2 and formwork_edge_and_beam_combined_area_m2 are mutually exclusive per zone (same rule the old floor_slab_1_edge_and_beam_formwork_area_combined_m2 field had) - use the combined field only when the PDF genuinely cannot split slab-edge from beam-vertical formwork for that zone. Manual fields (crane/pump/metal-delivery/tech-supervision/formwork-rental-quote) are per-zone by Elena's own explicit ruling (2026-08-10, see elena_per_pour_manual_costs_ruling memory) - NOT a shared pool split across zones; each real pour has its own, default 0/blank, filled in manually. include_in_estimate defaults to true when absent - set false for a real physical slab that is deliberately excluded from this pass (e.g. not yet priced) without deleting its row."

  - key: floor_slab_eps_items
    label_ru: "Утепление ЭППС плит перекрытия/покрытия (по плите, по роли)"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_eps_items"
    calculator_input_path: "floor_slab_eps_items"
    normalized_json_path: "sections.floor_slabs.parameters.floor_slab_eps_items.rows"
    value_kind: repeated_rows
    row_key_field: zone_id
    production_input: true
    item_label_columns: [zone_id, role]
    correction_columns: [role, material_name, thickness_mm, volume_m3, area_m2, length_m]
    columns:
      - {key: zone_id, label_ru: "Плита (floor_slab_zones.zone_id)", unit: "", value_kind: string}
      - {key: role, label_ru: "Роль утепления", unit: "", value_kind: string}
      - {key: material_name, label_ru: "Материал", unit: "", value_kind: string}
      - {key: thickness_mm, label_ru: "Толщина материала", unit: "мм", value_kind: number}
      - {key: volume_m3, label_ru: "Объём (по спецификации)", unit: "м3", value_kind: number}
      - {key: area_m2, label_ru: "Площадь (если дана готовой)", unit: "м2", value_kind: number}
      - {key: length_m, label_ru: "Длина работ по торцу (если дана готовой)", unit: "мп", value_kind: number}
      - {key: height_m, label_ru: "Высота (только если PDF даёт явно — обычно не бывает)", unit: "м", value_kind: number}
    parser_mapping:
      target_codes: ["floor_slab_eps_items"]
      group_codes: ["floor_slab_eps_items"]
      aliases_ru: ["ЭППС", "утепление низа плиты", "утепление торца плиты", "утепление борта плиты"]
      expected_unit: ""
      notes: "role enum: slab_bottom, slab_edge, combined_bottom_and_edge, unknown. Slab EPS only - beam insulation lives on floor_slab_beam_items rows, lintel insulation lives in load_bearing_walls_lintels. See target_aliases_ru.yaml."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если у плиты есть утепление ЭППС, проверьте каждую роль (торец/низ/объединено) отдельной строкой; если утепления нет, оставьте пустым - это нормальный случай, не ошибка."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation: {numeric: false, min_rows: 0, sum_checks: []}
    notes: >
      Readiness for automatic WORK calculation is per-role, decided 2026-08-10 (Elena + Codex) - see
      P5_SLAB_DATA_CONTRACT.md's "Готовность к автоматическому расчёту работ по утеплению" section, the
      canonical source, do not re-derive this rule from memory when writing the adapter:
      slab_edge material (EPS volume to order) is ready from area_m2 or volume_m3 (area derived as
      volume_m3/thickness_mm with needs_review); slab_edge WORK (м.п. rate line) needs length_m
      specifically - material and work readiness are independent, a slab_edge row can be material-ready
      and work-not-ready at the same time. slab_bottom uses one area (area_m2 or volume_m3/thickness_mm)
      for both material and work - single readiness. combined_bottom_and_edge is material-only ever - its
      volume can show as a reference/control quantity, but neither edge nor bottom WORK lines may be
      auto-computed from it; the review workbook must show that zone's insulation work as
      needs_review/manual with an explicit action asking Elena to either split the volume by torец/низ or
      confirm a methodology. The adapter must NEVER invent an edge_insulation_height_m (no such field
      exists anywhere in this schema on purpose - no real project ever prints it) and must NEVER fall back
      to a perimeter-based area estimate to route around missing length_m. A zone with zero
      floor_slab_eps_items rows at all is a normal "this slab has no insulation" outcome, not needs_review
      - concrete/formwork/rebar/beams for that zone still calculate normally regardless of insulation
      readiness; only the insulation work lines for that specific zone are affected.

  - key: floor_slab_beam_items
    label_ru: "Ж/Б балки плит перекрытия/покрытия"
    unit: "шт"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_beam_items"
    calculator_input_path: "floor_slab_beam_items"
    normalized_json_path: "sections.floor_slabs.parameters.floor_slab_beam_items.rows"
    value_kind: repeated_rows
    row_key_field: beam_id
    production_input: true
    item_label_columns: [zone_id, mark]
    correction_columns: [mark, length_m, width_m, height_m, count, concrete_volume_m3, formwork_area_m2, bottom_formwork_area_m2, insulated_length_m, insulation_area_m2]
    columns:
      - {key: zone_id, label_ru: "Плита (floor_slab_zones.zone_id)", unit: "", value_kind: string}
      - {key: beam_id, label_ru: "Идентификатор балки", unit: "", value_kind: string}
      - {key: mark, label_ru: "Марка балки", unit: "", value_kind: string}
      - {key: name, label_ru: "Наименование", unit: "", value_kind: string}
      - {key: length_m, label_ru: "Длина", unit: "м", value_kind: number}
      - {key: width_m, label_ru: "Ширина", unit: "м", value_kind: number}
      - {key: height_m, label_ru: "Высота", unit: "м", value_kind: number}
      - {key: count, label_ru: "Количество", unit: "шт", value_kind: number}
      - {key: concrete_volume_m3, label_ru: "Бетон (если дан готовым)", unit: "м3", value_kind: number}
      - {key: formwork_area_m2, label_ru: "Опалубка боковая (если дана готовой)", unit: "м2", value_kind: number}
      - {key: bottom_formwork_area_m2, label_ru: "Опалубка нижняя", unit: "м2", value_kind: number}
      - {key: insulated_length_m, label_ru: "Утепляемая длина торца балки", unit: "мп", value_kind: number}
      - {key: insulation_area_m2, label_ru: "Площадь утепления торца балки", unit: "м2", value_kind: number}
    parser_mapping:
      target_codes: ["floor_slab_beam_items"]
      group_codes: ["floor_slab_beam_items"]
      aliases_ru: ["ведомость балок", "спецификация балок", "балки Б-"]
      expected_unit: ""
      notes: "Every beam belongs to exactly one zone_id. Beam insulation (insulated_length_m/insulation_area_m2) lives here, never in floor_slab_eps_items."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если у плиты есть балки, проверьте их построчно; если балок нет, оставьте пустым."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation: {numeric: false, min_rows: 0, sum_checks: []}
    notes: "width_m optional when a row combines beams of different cross-sections - give concrete_volume_m3/formwork_area_m2 ready instead in that case, same rule the old beam_items group had. count null means 1 row/mark, not 0. Beam concreting work is priced by height: height_m<=0.25 by length (beam_concreting_work), height_m>0.25 by concrete_volume_m3 (beam_concreting_work_tall) - see estimate_lines below."

  - key: floor_slab_rebar_items
    label_ru: "Арматура плит перекрытия/покрытия и балок"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_rebar_items"
    calculator_input_path: "floor_slab_rebar_items"
    normalized_json_path: "sections.floor_slabs.parameters.floor_slab_rebar_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    production_input: true
    item_label_columns: [zone_id, steel_class, diameter_mm]
    correction_columns: [component, spec_length_m, kg_per_meter]
    columns:
      - {key: zone_id, label_ru: "Плита (floor_slab_zones.zone_id)", unit: "", value_kind: string}
      - {key: component, label_ru: "Компонент", unit: "", value_kind: string}
      - {key: code, label_ru: "Код", unit: "", value_kind: string}
      - {key: name, label_ru: "Наименование", unit: "", value_kind: string}
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: spec_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: kg_per_meter, label_ru: "Масса 1 м", unit: "кг/м", value_kind: number}
      - {key: rod_length_m, label_ru: "Длина прутка", unit: "м", value_kind: number}
      - {key: unit_price_per_m, label_ru: "Цена за метр", unit: "руб/мп", value_kind: number}
    parser_mapping:
      target_codes: ["floor_slab_rebar_items"]
      group_codes: ["floor_slab_rebar_items"]
      aliases_ru: ["арматура плиты перекрытия", "спецификация арматуры плиты"]
      expected_unit: "мп"
      notes: "component enum: slab, beam, additional, unknown - disambiguates by construction role, not by floor number (no `floor` field in this group by design, zone_id already identifies which physical slab). Primary PDF unit is м.п.; do not require PDF total kg."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте позиции арматуры каждой плиты по диаметрам, каждая строка спецификации отдельной строкой, с привязкой к нужной плите."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation: {numeric: false, min_rows: 0, sum_checks: []}
    notes: "unit_price_per_m is not a PDF value - adapter-filled from rebar_unit_price_by_item (registry_code rebar_<class>_d<diameter>_m), same convention the old floor_slab_1_rebar_items/floor_slab_2_rebar_items columns used. rod_length_m usually a catalog/standard rod length by diameter (e.g. 11.7m), not a PDF quantity unless the PDF gives an explicit rod-length table. Rebar rod-purchase rounding pools by (zone_id, component, steel_class, diameter_mm) - same zone-scoped pooling calculate_rebar_items_pooled() already proved exact on real TRC data, just keyed by zone_id now instead of (floor, zone_context)."

  - key: floor_slab_additional_items
    label_ru: "Дополнительные элементы плит перекрытия/покрытия (редкие)"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_additional_items"
    calculator_input_path: "floor_slab_additional_items"
    normalized_json_path: "sections.floor_slabs.parameters.floor_slab_additional_items.rows"
    value_kind: repeated_rows
    row_key_field: name
    production_input: true
    item_label_columns: [zone_id, name]
    correction_columns: [item_type, quantity, unit]
    columns:
      - {key: zone_id, label_ru: "Плита (floor_slab_zones.zone_id)", unit: "", value_kind: string}
      - {key: item_type, label_ru: "Тип элемента", unit: "", value_kind: string}
      - {key: name, label_ru: "Наименование строки", unit: "", value_kind: string}
      - {key: quantity, label_ru: "Количество", unit: "", value_kind: number}
      - {key: unit, label_ru: "Ед. изм.", unit: "", value_kind: string}
    parser_mapping:
      target_codes: ["floor_slab_additional_items"]
      group_codes: ["floor_slab_additional_items"]
      aliases_ru: ["балка в теле плиты", "ребро в теле плиты", "закладная деталь"]
      expected_unit: ""
      notes: "Rare project-specific components (extra concrete lines in the slab body such as 'ребро 50мм в теле плиты', embedded steel, unique details) not covered by the normal concrete/formwork/EPS/beam/rebar groups. Do not turn into mandatory rows for every slab. Same physical case the old additional_concrete_items group covered."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если в спецификации есть редкая дополнительная строка для этой плиты, впишите её сюда; если такой строки нет, оставьте пустым."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation: {numeric: false, min_rows: 0, sum_checks: []}
    notes: "Purely additive - when empty/absent, calculator behavior is unaffected. Currently only wired for extra concrete-volume rows (same money path as the old additional_concrete_items group: adds to concrete material/delivery ordering, never to formwork area or the slab's own concreting-work volume); non-concrete item_type rows are diagnostic/captured only until a real need to price them appears."

price_keys:
  - {key: formwork_rate_per_m2, estimate_line_code: formwork_set_rental_material, label_ru: "Комплект опалубки перекрытия", price_kind: material, unit: "м2", required: true, default_source: price_registry_with_fallback, registry_code: "formwork_rental_m2", fallback_key: "formwork_rate_per_m2", allow_manual_override: true, notes: ""}
  - {key: formwork_delivery_rate_per_trip, estimate_line_code: formwork_delivery_return_manipulator, label_ru: "Доставка, вывоз опалубки манипулятором", price_kind: material, unit: "маш", required: true, default_source: price_registry_with_fallback, registry_code: "formwork_delivery_truck", fallback_key: "formwork_delivery_rate_per_trip", allow_manual_override: true, notes: ""}
  - {key: crane_shift_rate, estimate_line_code: formwork_rebar_crane_supply, label_ru: "Подача опалубки, арматуры автокраном", price_kind: material, unit: "смена", required: true, default_source: price_registry_with_fallback, registry_code: "crane_shift", fallback_key: "crane_shift_rate", allow_manual_override: true, notes: ""}
  - {key: formwork_consumables_rate_per_m2, estimate_line_code: formwork_consumables, label_ru: "Расходные материалы для установки опалубки", price_kind: material, unit: "м2", required: true, default_source: price_registry_with_fallback, registry_code: "formwork_consumables_m2", fallback_key: "formwork_consumables_rate_per_m2", allow_manual_override: true, notes: ""}
  - {key: plywood_unit_price, estimate_line_code: plywood_fk_18mm_for_edges_and_non_multiple_places, label_ru: "Фанера ФК 1,52 x 1,52 толщиной 18 мм", price_kind: material, unit: "лист", required: true, default_source: price_registry_with_fallback, registry_code: "plywood_1520x1520_18mm_sheet", fallback_key: "plywood_unit_price", allow_manual_override: true, notes: ""}
  - {key: timber_unit_price, estimate_line_code: formwork_timber_gost, label_ru: "Пиломатериал обрезной для устройства опалубки", price_kind: material, unit: "м3", required: true, default_source: price_registry_with_fallback, registry_code: "timber_m3", fallback_key: "timber_unit_price", allow_manual_override: true, notes: ""}
  - {key: rebar_unit_price_by_item, estimate_line_code: rebar_items_dynamic, label_ru: "Арматура плиты перекрытия по диаметрам", price_kind: material, unit: "мп", required: true, default_source: price_registry_with_fallback, registry_code: "rebar_<class>_d<diameter>_m", fallback_key: "rebar_items.unit_price_per_m", allow_manual_override: true, notes: "Resolved per row of floor_slab_rebar_items."}
  - {key: rebar_metal_delivery_unit_price, estimate_line_code: rebar_metal_delivery, label_ru: "Доставка арматуры, металла", price_kind: material, unit: "маш", required: true, default_source: price_registry_with_fallback, registry_code: "metal_delivery_truck", fallback_key: "rebar_metal_delivery_unit_price", allow_manual_override: true, notes: "Only used in production (metal_delivery_calc_method=section_output_only)."}
  - {key: slab_concreting_work_rate_per_m3, estimate_line_code: floor_slab_concreting_work, label_ru: "Бетонирование плиты перекрытия", price_kind: work, unit: "м3", required: true, default_source: price_registry_with_fallback, registry_code: "concrete_placing_work_m3", fallback_key: "slab_concreting_work_rate_per_m3", allow_manual_override: true, notes: ""}
  - {key: beam_concreting_work_rate_per_m, estimate_line_code: beam_concreting_work, label_ru: "Бетонирование балок высотой до 250мм", price_kind: work, unit: "мп", required: false, default_source: price_registry_with_fallback, registry_code: "beam_concrete_placing_work_m", fallback_key: "beam_concreting_work_rate_per_m", allow_manual_override: true, notes: "Only required when a zone has beams with height_m<=0.25."}
  - {key: beam_concreting_work_rate_per_m3, estimate_line_code: beam_concreting_work_tall, label_ru: "Бетонирование балок высотой более 250мм", price_kind: work, unit: "м3", required: false, default_source: price_registry_with_fallback, registry_code: "beam_concrete_placing_work_m3", fallback_key: "beam_concreting_work_rate_per_m3", allow_manual_override: true, notes: "Only required when a zone has beams with height_m>0.25. Confirmed against real TRC/ARK smetas that both split beam concreting work by height with different units (мп vs м3) - see FLOOR_SLAB_UNIFICATION_PLAN.md P1.1."}
  - {key: concrete_unit_price_per_m3, estimate_line_code: concrete_b22_5_m300_material, label_ru: "Бетон В22,5 М300", price_kind: material, unit: "м3", required: true, default_source: price_registry_with_fallback, registry_code: "concrete_b22_5_m3", fallback_key: "concrete_unit_price_per_m3", allow_manual_override: true, notes: ""}
  - {key: concrete_delivery_rate_per_trip, estimate_line_code: concrete_delivery, label_ru: "Доставка бетона до объекта", price_kind: material, unit: "рейс", required: true, default_source: price_registry_with_fallback, registry_code: "concrete_delivery_trip", fallback_key: "concrete_delivery_rate_per_trip", allow_manual_override: true, notes: ""}
  - {key: concrete_pump_rate, estimate_line_code: concrete_pump_32m, label_ru: "Работа бетононасоса", price_kind: material, unit: "смена", required: true, default_source: price_registry_with_fallback, registry_code: "concrete_pump_32m_shift", fallback_key: "concrete_pump_rate", allow_manual_override: true, notes: "2026-08-10: unified registry_code, dropping the old floor_slab_1-vs-floor_slab_2 split (concrete_pump_32m_shift_floor_slab_1/_floor_slab_2) that made no sense once there are N zones, not 2 sections. Real projects sometimes use a bigger pump for an upper-floor pour than for the ground-floor/foundation pour (confirmed TRC, ARK) - if a specific pour genuinely needs a different pump price than the rest of the project, that is a sheet-02 manual override for now, not a separate registry_code per zone; a real per-zone price mechanism is future work if this turns out to matter often."}
  - {key: edge_beam_insulation_work_rate_per_m, estimate_line_code: edge_beam_insulation_work, label_ru: "Утепление торцов плиты и балок", price_kind: work, unit: "мп", required: false, default_source: price_registry_with_fallback, registry_code: "edge_insulation_work_m", fallback_key: "edge_beam_insulation_work_rate_per_m", allow_manual_override: true, notes: "Only required when a zone's edge insulation work is ready to calculate (see floor_slab_eps_items readiness rule above)."}
  - {key: bottom_slab_insulation_work_rate_per_m2, estimate_line_code: bottom_slab_insulation_work, label_ru: "Утепление низа плиты", price_kind: work, unit: "м2", required: false, default_source: price_registry_with_fallback, registry_code: "eps_bottom_slab_insulation_work_m2", fallback_key: "bottom_slab_insulation_work_rate_per_m2", allow_manual_override: true, notes: "Only required when a zone has a ready bottom_slab_eps_work_area_m2 > 0."}
  - {key: eps_unit_price_per_m3, estimate_line_code: eps_penoplex_osnova_100mm, label_ru: "Пеноплэкс Основа 100 мм", price_kind: material, unit: "м3", required: false, default_source: price_registry_with_fallback, registry_code: "eps_penoplex_osnova_100_m3", fallback_key: "eps_unit_price_per_m3", allow_manual_override: true, calculator_input_path: "insulation.eps_unit_price_per_m3", notes: "Calculator reads this from the insulation sub-dict, not rates. Only required when a zone has any EPS volume at all (material-only combined_bottom_and_edge rows still need this)."}
  - {key: foam_unit_price_per_can, estimate_line_code: eps_glue_foam, label_ru: "Клей-пена для ЭППС", price_kind: material, unit: "баллон", required: false, default_source: price_registry_with_fallback, registry_code: "eps_foam_glue_can", fallback_key: "foam_unit_price_per_can", allow_manual_override: true, calculator_input_path: "insulation.foam_unit_price_per_can", notes: "Calculator reads this from the insulation sub-dict, not rates. Only required when a zone has any EPS area at all."}
  - {key: technical_supervision_amount, estimate_line_code: technical_supervision, label_ru: "Технический надзор", price_kind: work, unit: "-", required: false, default_source: price_registry_with_fallback, registry_code: "technical_supervision_fixed", fallback_key: "technical_supervision_amount", allow_manual_override: true, calculator_input_path: "manual_lines.technical_supervision_amount", notes: "Price-like manual amount, per zone (floor_slab_zones.manual_technical_supervision_amount) - 2026-08-10: every zone can carry a real technical-supervision charge now, not just floor_slab_1-shaped ones. The old floor_slab_2_calculator.py hardcoded this to 0 unconditionally (a real calculator-engine limitation, not a business rule) - removing that hardcode is part of the known adapter/calculator debt logged in P5_SLAB_DATA_CONTRACT.md."}

# insulation_calc_method is intentionally NOT a fixed section-wide default (unlike the old floor_slab_1
# contract's spec_work_quantities / floor_slab_2's perimeter_based split). The adapter derives it per
# zone from which floor_slab_eps_items roles/fields are actually present for that zone - see the
# floor_slab_eps_items readiness rule above. Never perimeter_based, never a height fallback.
defaults:
  - {key: formwork_areas_calc_method, label_ru: "Метод площадей опалубки", source_class: DEFAULT, value: "spec_formwork_areas", unit: "", calculator_input_path: "formwork_areas_calc_method", source_note: "Production mode from calculator README - both old sections always used a spec-based formwork area mode.", allow_override_later: false, notes: ""}
  - {key: rebar_calc_method, label_ru: "Метод арматуры", source_class: DEFAULT, value: "spec_length_items", unit: "", calculator_input_path: "rebar_calc_method", source_note: "Production mode from calculator README.", allow_override_later: false, notes: ""}
  - {key: rebar_waste_coeff, label_ru: "Коэффициент запаса арматуры", source_class: DEFAULT, value: 1.05, unit: "", calculator_input_path: "rebar_items[*].waste_coeff", source_note: "Business/material waste default, same value used everywhere else in the pipeline.", allow_override_later: true, notes: "Per-item, injected into each rebar_items row by the adapter, same pattern foundation_slab's rod_length_m default uses."}
  - {key: formwork_rate_calc_method, label_ru: "Метод ставки опалубки", source_class: DEFAULT, value: "direct_section_rate", unit: "", calculator_input_path: "rates.formwork_rate_calc_method", source_note: "Production mode from calculator README.", allow_override_later: false, notes: ""}
  - {key: formwork_delivery_calc_method, label_ru: "Метод доставки опалубки", source_class: DEFAULT, value: "area_threshold", unit: "", calculator_input_path: "rates.formwork_delivery_calc_method", source_note: "Production mode from calculator README.", allow_override_later: false, notes: ""}
  - {key: formwork_delivery_threshold_m2, label_ru: "Порог доставки опалубки", source_class: DEFAULT, value: 180, unit: "м2", calculator_input_path: "rates.formwork_delivery_threshold_m2", source_note: "Business threshold; calculator's own hidden default (both old contracts relied on it implicitly, floor_slab_2 declared it explicitly) - declared explicitly here so it is visible/overridable per project.", allow_override_later: true, notes: ""}
  - {key: metal_delivery_calc_method, label_ru: "Метод доставки металла", source_class: DEFAULT, value: "section_output_only", unit: "", calculator_input_path: "rates.metal_delivery_calc_method", source_note: "Production mode from calculator README; box calculator combines metal weights across sections.", allow_override_later: false, notes: ""}
  - {key: beam_concreting_calc_method, label_ru: "Метод бетонирования балок", source_class: DEFAULT, value: "height_split", unit: "", calculator_input_path: "rates.beam_concreting_calc_method", source_note: "Elena's ruling 2026-08-09 (see beam_concreting_work_rate_per_m3's own price_key note): beams over 0.25m height are priced by concrete volume (м3), not length - confirmed against real TRC/ARK smetas.", allow_override_later: false, notes: "Reconciles a real pre-existing inconsistency: the old floor_slab_1 contract already had this (updated 2026-08-09), but floor_slab_2's contract was never updated to match and still said single_rate as of P5 - height_split is the more current, evidence-checked value, applied uniformly to every zone now."}
  - {key: concrete_waste_coeff, label_ru: "Коэффициент запаса бетона", source_class: DEFAULT, value: 1.05, unit: "", calculator_input_path: "rates.concrete_waste_coeff", source_note: "Business/material waste default.", allow_override_later: true, notes: ""}
  - {key: concrete_round_step_m3, label_ru: "Шаг округления заказа бетона", source_class: DEFAULT, value: 1, unit: "м3", calculator_input_path: "rates.concrete_round_step_m3", source_note: "Supplier/business order rounding - was only explicit in the old floor_slab_2 contract (floor_slab_1 relied on the calculator's implicit whole-m3 ceiling, which is the same behavior as step=1); declared explicitly here for every zone.", allow_override_later: true, notes: ""}
  - {key: eps_thickness_m, label_ru: "Толщина ЭППС", source_class: DEFAULT, value: 0.1, unit: "м", calculator_input_path: "insulation.eps_thickness_m", source_note: "Catalog/formula default for EPS 100 mm - matches floor_slab_eps_items.thickness_mm=100 in every real project seen so far (TRC/ARK/USV).", allow_override_later: true, notes: "Per-item thickness_mm from floor_slab_eps_items overrides this per row when the PDF gives a different thickness (e.g. 50mm) - see target_aliases_ru.yaml's floor_slab_eps_items notes."}
  - {key: eps_waste_coeff, label_ru: "Коэффициент запаса ЭППС", source_class: DEFAULT, value: 1.05, unit: "", calculator_input_path: "insulation.eps_waste_coeff", source_note: "Business/material waste default.", allow_override_later: true, notes: ""}
  - {key: eps_pack_volume_m3, label_ru: "Объем одной упаковки ЭППС 100 мм", source_class: DEFAULT, value: 0.2773, unit: "м3", calculator_input_path: "insulation.eps_pack_volume_m3", source_note: "Catalog pack volume, same value both old calculators used.", allow_override_later: true, notes: "Needed to order EPS by full packs."}
  - {key: foam_coverage_m2_per_can, label_ru: "Покрытие клей-пены", source_class: DEFAULT, value: 10, unit: "м2/баллон", calculator_input_path: "insulation.foam_coverage_m2_per_can", source_note: "Formula/catalog default.", allow_override_later: true, notes: ""}
  - {key: foam_min_cans, label_ru: "Минимум баллонов клей-пены на плиту", source_class: DEFAULT, value: 1, unit: "баллон", calculator_input_path: "insulation.foam_min_cans", source_note: "Business minimum - was only explicit in the old floor_slab_2 contract (floor_slab_1's calculator call left it implicitly 0); adopting the more conservative explicit value for every zone.", allow_override_later: true, notes: ""}
  - {key: mixer_capacity_m3, label_ru: "Объем миксера бетона", source_class: DEFAULT, value: 9, unit: "м3", calculator_input_path: "rates.mixer_capacity_m3", source_note: "Supplier/business default.", allow_override_later: true, notes: ""}
  - {key: max_rebar_delivery_weight_per_truck_kg, label_ru: "Максимальный вес металла на машину", source_class: DEFAULT, value: 10000, unit: "кг", calculator_input_path: "rates.max_rebar_delivery_weight_per_truck_kg", source_note: "Box-level delivery capacity default, shared across every rebar-bearing section.", allow_override_later: true, notes: ""}
  - {key: plywood_sheet_working_area_m2, label_ru: "Рабочая площадь листа фанеры", source_class: DEFAULT, value: 2.3, unit: "м2", calculator_input_path: "rates.plywood_sheet_working_area_m2", source_note: "Catalog/formula default from manual review.", allow_override_later: true, notes: ""}
  - {key: reserve_plywood_sheets, label_ru: "Резерв листов фанеры", source_class: DEFAULT, value: 10, unit: "лист", calculator_input_path: "rates.reserve_plywood_sheets", source_note: "Business/formula default from manual review.", allow_override_later: true, notes: ""}
  - {key: non_multiple_places_coeff, label_ru: "Коэффициент некратных мест", source_class: DEFAULT, value: 0.2, unit: "", calculator_input_path: "rates.non_multiple_places_coeff", source_note: "Business/formula default from manual review.", allow_override_later: true, notes: ""}
  - {key: timber_thickness_m, label_ru: "Толщина пиломатериала для опалубки", source_class: DEFAULT, value: 0.05, unit: "м", calculator_input_path: "rates.timber_thickness_m", source_note: "Catalog/formula default.", allow_override_later: true, notes: ""}
  - {key: additional_timber_coeff, label_ru: "Коэффициент дополнительного пиломатериала для доборов", source_class: DEFAULT, value: 0.1, unit: "", calculator_input_path: "rates.additional_timber_coeff", source_note: "Formula default from floor slab calculator production cases.", allow_override_later: true, notes: ""}
  - {key: additional_timber_thickness_m, label_ru: "Толщина дополнительного пиломатериала для доборов", source_class: DEFAULT, value: 0.05, unit: "м", calculator_input_path: "rates.additional_timber_thickness_m", source_note: "Catalog/formula default.", allow_override_later: true, notes: ""}
  - {key: overhang_sheet_equivalent, label_ru: "Legacy-эквивалент листов фанеры для свесов и доборов", source_class: DEFAULT, value: 0, unit: "лист", calculator_input_path: "rates.overhang_sheet_equivalent", source_note: "Legacy compatibility default - no universal project/smeta row ever found for this field; ordinary plywood/timber is already calculated from formwork areas.", allow_override_later: false, exclude_from_manual_values_registry: true, notes: "Do not show on manual sheet 01-1."}
  - {key: logistics_and_supply_percent, label_ru: "Коэффициент логистики и снабжения", source_class: DEFAULT, value: 0.01, unit: "", calculator_input_path: "overheads.logistics_and_supply_percent", source_note: "Business overhead default.", allow_override_later: true, notes: ""}
  - {key: consumables_and_tool_percent, label_ru: "Коэффициент расходников и амортизации", source_class: DEFAULT, value: 0.03, unit: "", calculator_input_path: "overheads.consumables_and_tool_percent", source_note: "Business overhead default.", allow_override_later: true, notes: ""}

# No top-level supplier_inputs block: crane/pump/metal-delivery/tech-supervision/formwork-rental-quote
# are floor_slab_zones[] columns now (manual_formwork_rebar_crane_shifts etc. above), not whole-section
# scalars - each physical slab has its own, per Elena's 2026-08-10 ruling. The old floor_slab_1/
# floor_slab_2 contracts each had their own top-level supplier_inputs block for these exact fields;
# that pattern assumed one manual value per section, which stopped being true the moment a section can
# contain N pours.

calculator_input_mapping:
  - input_path: "*"
    from:
      ref: "review_parameters + defaults + price_keys"
      source_class: MIXED
    required: true
    transform: build_floor_slabs_input_for_zone
    fallback: null
    notes: "Adapter (review_to_calculator/sections/floor_slabs/build_input.py, not yet written - see P5_SLAB_DATA_CONTRACT.md's Adapter section) runs once per included floor_slab_zones row, building one calculate_floor_slab_pour() input (geometry, beams, rates, rebar_items, insulation, overheads, manual_lines) filtered to that zone_id. Must not create a [combined] whole-section fallback when a row cannot be attached to a zone - that is a readiness blocker, not a soft default (P5_SLAB_DATA_CONTRACT.md's Adapter section)."

# One entry per calculator output line - the shared engine's own native line set (calculate_floor_slab_
# pour() body, formerly floor_slab_1_calculator.py's logic - see floor_slab_calculator.py's own
# docstring). Every pour (each included floor_slab_zones row) produces this same set of lines; core/
# job_runner.py's orchestrator collects one pour block per zone into the final smeta, not one block per
# "floor". Formulas below are written per-zone (evaluated once per pour, using that zone's own rows from
# the 4 dependent groups) - not summed across zones first.
estimate_lines:
  - code: slab_formwork_installation_control
    name_ru: "Монтаж опалубки под монолитное перекрытие"
    unit: "м2"
    enabled_by_default: true
    line_role: zero_control_line
    calculator_result_path: "estimate_lines[code=slab_formwork_installation_control]"
    quantity:
      formula: "zone.formwork_under_slab_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero control/client line from calculator."

  - code: formwork_set_rental_material
    name_ru: "Комплект опалубки перекрытия"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_set_rental_material]"
    quantity:
      formula: "zone.formwork_under_slab_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: formwork_rate_per_m2, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: formwork_delivery_return_manipulator
    name_ru: "Доставка, вывоз опалубки манипулятором"
    unit: "маш"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_delivery_return_manipulator]"
    quantity:
      formula: "2 машины if zone.formwork_under_slab_area_m2 <= formwork_delivery_threshold_m2 else 4 машины"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
        - {ref: "defaults.formwork_delivery_calc_method", source_class: DEFAULT}
        - {ref: "defaults.formwork_delivery_threshold_m2", source_class: DEFAULT}
    prices: {material_unit_price_key: formwork_delivery_rate_per_trip, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Production mode area_threshold, per zone."

  - code: formwork_rebar_crane_supply
    name_ru: "Подача опалубки, арматуры автокраном"
    unit: "смена"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_rebar_crane_supply]"
    quantity:
      formula: "zone.manual_formwork_rebar_crane_shifts"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: crane_shift_rate, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Manual per-zone quantity."

  - code: formwork_consumables
    name_ru: "Расходные материалы для установки опалубки"
    unit: "-"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_consumables]"
    quantity:
      formula: "1 fixed line; amount = zone.formwork_under_slab_area_m2 * formwork_consumables_rate_per_m2"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: formwork_consumables_rate_per_m2, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Calculator displays quantity 1 but total is area-based."

  - code: edge_beam_formwork_installation_control
    name_ru: "Монтаж опалубки из доски 50 мм и фанеры для балок и отбортовки плиты"
    unit: "м2"
    enabled_by_default: true
    line_role: zero_control_line
    calculator_result_path: "estimate_lines[code=edge_beam_formwork_installation_control]"
    quantity:
      formula: "zone.formwork_edge_area_m2 + beams_side_area(zone) + beams_bottom_area(zone)  # or zone.formwork_edge_and_beam_combined_area_m2 + beams_bottom_area(zone) when the combined field is used instead"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero control/client line. beams_side_area(zone)/beams_bottom_area(zone) = zone.formwork_beams_side_area_m2/formwork_beams_bottom_area_m2 override when present, else sum of that zone's floor_slab_beam_items.formwork_area_m2/bottom_formwork_area_m2."

  - code: plywood_fk_18mm_for_edges_and_non_multiple_places
    name_ru: "Фанера ФК 1,52 x 1,52 толщиной 18 мм для некратных мест и торцов"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=plywood_fk_18mm_for_edges_and_non_multiple_places]"
    quantity:
      formula: "ceil((zone.formwork_edge_area_m2 + beams_side_area(zone)) / plywood_sheet_working_area_m2 + (zone.formwork_under_slab_area_m2 * non_multiple_places_coeff) / plywood_sheet_working_area_m2 + reserve_plywood_sheets)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.plywood_sheet_working_area_m2", source_class: DEFAULT}
        - {ref: "defaults.non_multiple_places_coeff", source_class: DEFAULT}
        - {ref: "defaults.reserve_plywood_sheets", source_class: DEFAULT}
    prices: {material_unit_price_key: plywood_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: formwork_timber_gost
    name_ru: "Пиломатериал обрезной для устройства опалубки ГОСТ"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_timber_gost]"
    quantity:
      formula: "(zone.formwork_edge_area_m2 + beams_side_area(zone)) * timber_thickness_m + (((zone.formwork_under_slab_area_m2 * non_multiple_places_coeff) / plywood_sheet_working_area_m2) + overhang_sheet_equivalent) * additional_timber_coeff * additional_timber_thickness_m"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.timber_thickness_m", source_class: DEFAULT}
        - {ref: "defaults.non_multiple_places_coeff", source_class: DEFAULT}
        - {ref: "defaults.plywood_sheet_working_area_m2", source_class: DEFAULT}
        - {ref: "defaults.overhang_sheet_equivalent", source_class: DEFAULT}
        - {ref: "defaults.additional_timber_coeff", source_class: DEFAULT}
        - {ref: "defaults.additional_timber_thickness_m", source_class: DEFAULT}
    prices: {material_unit_price_key: timber_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "overhang_sheet_equivalent is a hidden legacy compatibility default of 0."

  - code: floor_slab_rebar_frame_assembly_control
    name_ru: "Изготовление и монтаж каркаса армирования перекрытия из арматуры"
    unit: "мп"
    enabled_by_default: true
    line_role: zero_control_line
    calculator_result_path: "estimate_lines[code=floor_slab_rebar_frame_assembly_control]"
    quantity:
      formula: "sum(rebar_item.order_length_m for that zone)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_rebar_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Order length calculated per rebar row from spec_length_m, rod length, waste and rounding, pooled by (zone_id, component, steel_class, diameter_mm)."

  - code: rebar_items_dynamic
    name_ru: "Арматура плиты перекрытия по диаметрам"
    unit: "мп"
    enabled_by_default: true
    line_role: dynamic_material_rows
    calculator_result_path: "estimate_lines[code=rebar_*]"
    quantity:
      formula: "per-row order_length_m from that zone's floor_slab_rebar_items"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_rebar_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: rebar_unit_price_by_item, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "One calculator line per rebar row/diameter within that zone; code generated from steel class and diameter."

  - code: rebar_metal_delivery
    name_ru: "Доставка арматуры, металла"
    unit: "маш"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=rebar_metal_delivery]"
    quantity:
      formula: "zone.manual_rebar_metal_delivery_trucks (box-level allocation, production mode section_output_only)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: rebar_metal_delivery_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Quantity naturally 0 for a pour where this zone's rebar weight doesn't cross the box-level 10-tonne threshold."

  - code: floor_slab_concreting_work
    name_ru: "Бетонирование монолитной плиты перекрытия бетоном В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=floor_slab_concreting_work]"
    quantity:
      formula: "zone.concrete_slab_volume_m3  # slab concrete only, already excludes beams - beam concrete never subtracted here because it was never added (concrete_slab_volume_m3 is the slab-only spec row, not a combined total)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: slab_concreting_work_rate_per_m3, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "P5 change from the old floor_slab_1 behavior: the old contract's total_concrete_volume_from_spec_m3 was a combined figure the calculator subtracted beam volume from internally. The new floor_slab_zones.concrete_slab_volume_m3 is defined as slab-only from the start (P5_SLAB_DATA_CONTRACT.md's Бетон section: 'бетон плиты и бетон балок не смешивать'), so no subtraction happens in the adapter - verify this matches the calculator's actual internal handling when build_input.py is written (calculate_floor_slab_pour() may still expect a combined figure and do its own subtraction; if so the adapter must pass concrete_slab_volume_m3 + sum(beam concrete) as geometry.total_concrete_volume_from_spec_m3 instead of concrete_slab_volume_m3 alone - check before shipping the adapter, do not assume)."

  - code: beam_concreting_work
    name_ru: "Бетонирование балок высотой до 250мм бетоном В22,5 (М300)"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=beam_concreting_work]"
    quantity:
      formula: "sum(beam.length_m * beam.count for that zone's floor_slab_beam_items where beam.height_m <= 0.25)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: beam_concreting_work_rate_per_m, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "beam_concreting_calc_method=height_split (see defaults above). Beam concrete material stays in m3 on the concrete material line regardless of height."

  - code: beam_concreting_work_tall
    name_ru: "Бетонирование балок высотой более 250мм бетоном В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=beam_concreting_work_tall]"
    quantity:
      formula: "sum(beam.concrete_volume_m3 for that zone's floor_slab_beam_items where beam.height_m > 0.25)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: beam_concreting_work_rate_per_m3, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Taller beams need proportionally more concrete/formwork per meter than a flat length-rate reflects - confirmed against real TRC/ARK smetas."

  - code: concrete_b22_5_m300_material
    name_ru: "Бетон марки В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=concrete_b22_5_m300_material]"
    quantity:
      formula: "ceil(zone_total_concrete_m3 * concrete_waste_coeff)  # zone_total_concrete_m3 = zone.concrete_slab_volume_m3 + sum(that zone's floor_slab_beam_items.concrete_volume_m3) + sum(that zone's floor_slab_additional_items concrete rows)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_additional_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.concrete_waste_coeff", source_class: DEFAULT}
    prices: {material_unit_price_key: concrete_unit_price_per_m3, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Material order uses the FULL zone concrete total (slab + beams + any additional-items concrete rows), unlike the work line above which is slab-only - same distinction the old contracts already made between concreting-work volume and material-order volume."

  - code: concrete_delivery
    name_ru: "Доставка бетона до объекта"
    unit: "рейс"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=concrete_delivery]"
    quantity:
      formula: "ceil(zone_total_concrete_m3 * concrete_waste_coeff / mixer_capacity_m3)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_additional_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.concrete_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.mixer_capacity_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: concrete_delivery_rate_per_trip, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Per zone/pour, same zone_total_concrete_m3 as the material line above."

  - code: concrete_pump_32m
    name_ru: "Работа бетононасоса"
    unit: "смена"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=concrete_pump_32m]"
    quantity:
      formula: "zone.manual_concrete_pump_shifts"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: concrete_pump_rate, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Manual per-zone quantity; do not compute from concrete volume."

  - code: formwork_dismantling_zero_internal
    name_ru: "Демонтаж опалубки после завершения бетонирования"
    unit: "м2"
    enabled_by_default: true
    line_role: client_only_zero_internal_line
    calculator_result_path: "estimate_lines[code=formwork_dismantling_zero_internal]"
    quantity:
      formula: "zone.formwork_under_slab_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero/internal display line; not a production paid quantity."

  - code: edge_beam_insulation_work
    name_ru: "Устройство утепления по наружной стороне торцов плиты, балок"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=edge_beam_insulation_work]"
    quantity:
      formula: "slab_edge_work_length(zone) + sum(that zone's floor_slab_beam_items.insulated_length_m)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_eps_items", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: edge_beam_insulation_work_rate_per_m, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "slab_edge_work_length(zone) = that zone's floor_slab_eps_items[role=slab_edge].length_m; needs_review/blocked when only a combined_bottom_and_edge row exists with no split length (see floor_slab_eps_items readiness rule). Beam insulation only from explicit insulated_length_m, never inferred from full beam length."

  - code: bottom_slab_insulation_work
    name_ru: "Устройство утепления низа плиты"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=bottom_slab_insulation_work]"
    quantity:
      formula: "slab_bottom_work_area(zone)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_eps_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: bottom_slab_insulation_work_rate_per_m2, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "slab_bottom_work_area(zone) = that zone's floor_slab_eps_items[role=slab_bottom].area_m2, or volume_m3/thickness_mm when only volume is given (needs_review). needs_review/blocked when only a combined_bottom_and_edge row exists with no split area."

  - code: eps_penoplex_osnova_100mm
    name_ru: "Экструдированный пенополистирол Пеноплэкс Основа 100 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps_penoplex_osnova_100mm]"
    quantity:
      formula: "ceil(zone_total_eps_volume_m3 * eps_waste_coeff / eps_pack_volume_m3) * eps_pack_volume_m3  # zone_total_eps_volume_m3 = sum of ALL that zone's floor_slab_eps_items.volume_m3, every role including combined_bottom_and_edge - material is never blocked by the work-readiness rule"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_eps_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.eps_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.eps_pack_volume_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: eps_unit_price_per_m3, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Material ordering uses the honest total volume regardless of whether edge/bottom work could be split - see the readiness rule on floor_slab_eps_items above."

  - code: eps_glue_foam
    name_ru: "Клей-пена для ЭППС"
    unit: "баллон"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps_glue_foam]"
    quantity:
      formula: "ceil(zone_total_eps_material_area_m2 / foam_coverage_m2_per_can)  # zone_total_eps_material_area_m2 = sum of that zone's floor_slab_eps_items area_m2 (or volume_m3/thickness_mm) across ready roles, plus sum(that zone's floor_slab_beam_items.insulation_area_m2)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_eps_items", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_slab_beam_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.foam_coverage_m2_per_can", source_class: DEFAULT}
        - {ref: "defaults.foam_min_cans", source_class: DEFAULT}
    prices: {material_unit_price_key: foam_unit_price_per_can, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Beam EPS material area comes directly from floor_slab_beam_items.insulation_area_m2, not derived from beam length/height."

  - code: logistics_and_supply
    name_ru: "Логистика, и снабжение"
    unit: "-"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=logistics_and_supply]"
    quantity:
      formula: "1; amount = zone_base_subtotal_raw * logistics_and_supply_percent"
      leaf_inputs:
        - {ref: "defaults.logistics_and_supply_percent", source_class: DEFAULT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Percent overhead line, computed on that pour's own subtotal."

  - code: consumables_tool_depreciation
    name_ru: "Расходные материалы, амортизация инструмента"
    unit: "комплект"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=consumables_tool_depreciation]"
    quantity:
      formula: "1; amount = zone_base_subtotal_raw * consumables_and_tool_percent"
      leaf_inputs:
        - {ref: "defaults.consumables_and_tool_percent", source_class: DEFAULT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Percent overhead line, computed on that pour's own subtotal."

  - code: technical_supervision
    name_ru: "Технический надзор"
    unit: "-"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=technical_supervision]"
    quantity:
      formula: "1 fixed line; amount = zone.manual_technical_supervision_amount"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_zones", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: technical_supervision_amount, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Per-zone manual amount, default 0/blank, filled in manually per real pour - see floor_slab_zones.manual_technical_supervision_amount. Every zone can carry a real amount now (see technical_supervision_amount price_key's own note about the old floor_slab_2 hardcoded-zero debt)."

workbook_layout:
  review_workbook:
    include_on_constructor: true
    project_sheet: "01_Проверка проекта"
    price_sheet: "02_Цены себестоимости"
    details_sheet: "03_Детали объемов"
    candidates_sheet: "05_Кандидаты parser"
    raw_sheet: "06_Сырые данные parser"
  final_estimate_workbook:
    section_order: null
    section_row_name: "Плита перекрытия/покрытия"
    white_zone: "A:I"
    calc_zone: "J:O"
    helper_zone: "P:V"
    mini_table_zone: "W:AA+"

checks:
  required_source_classes: [AUTO_PROJECT, AUTO_CALCULATED, DEFAULT, PRICE, SUPPLIER_INPUT, MANUAL_REVIEW]
  required_review_parameters:
    - floor_slab_zones
  forbidden_production_inputs:
    - old_fixture_values
    - old_expected_result_values
    - display_quantity_overrides
    - legacy_usv_geometry_default
    - floor_slab_1_scalar_targets
    - floor_slab_2_scalar_targets
  expected_estimate_line_count_per_pour: 25
  contamination_check:
    old_project_markers_allowed: false
    fixture_values_allowed: false
    old_expected_result_values_allowed: false
  fail_if:
    - "workbook rows are built from old floor_slab_1/floor_slab_2 contracts instead of this one"
    - "a floor_slab_zones row has no zone_id"
    - "a floor_slab_eps_items/floor_slab_beam_items/floor_slab_rebar_items/floor_slab_additional_items row's zone_id does not match any floor_slab_zones[].zone_id"
    - "adapter creates a [combined] whole-project fallback pour instead of failing a readiness blocker for an unattributable row"
    - "adapter silently invents edge_insulation_height_m or falls back to perimeter_based when a zone's insulation data is combined_bottom_and_edge only"
    - "estimate line count for a single pour differs from 25 without explanation"
