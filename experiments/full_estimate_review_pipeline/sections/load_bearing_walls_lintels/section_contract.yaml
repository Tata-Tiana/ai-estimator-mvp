    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Same ordered volume as lintel_concrete_b22_5_m300_material. Formula changed 2026-07-15 (combined U-block+monolithic); made conditional — only returned when the combined need is > 0."

  - code: floor_2_u_block_lintel_cutting
    name_ru: "Резка блока под перемычку (U-блок), 2-й этаж"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=floor_2_u_block_lintel_cutting]"
