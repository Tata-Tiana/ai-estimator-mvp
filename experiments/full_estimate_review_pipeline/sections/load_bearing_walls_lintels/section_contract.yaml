    label_ru: "Расходные материалы и амортизация инструмента, legacy сумма"
    unit: "руб."
    source_class: SUPPLIER_INPUT
    required: false
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "walls_consumables_tool_amortization_amount_raw"
    normalized_json_path: "sections.load_bearing_walls_lintels.supplier_inputs.walls_consumables_tool_amortization_amount_raw.value"
    exclude_from_manual_values_registry: true
    value_kind: money
    review_behavior:
