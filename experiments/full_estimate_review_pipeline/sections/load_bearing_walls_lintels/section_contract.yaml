    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Purchased volume rounded up to full pallets."

  - code: main_gas_block_d500_600x250x250_material
    name_ru: "Газобетонный блок D500 600x250x250 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=main_gas_block_d500_600x250x250_material]"
    quantity:
      formula: "ceil_to_pallet(main_wall_gas_block_250_spec_volume_m3 * gas_block_waste_coeff, gas_block_d500_250_pallet_volume_m3)"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_gas_block_250_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.gas_block_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.gas_block_d500_250_pallet_volume_m3", source_class: DEFAULT}
