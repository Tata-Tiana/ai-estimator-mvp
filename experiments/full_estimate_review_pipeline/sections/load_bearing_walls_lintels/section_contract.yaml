auto_calculated:
  - {key: lintel_concrete_order_volume_m3, label_ru: "Заказной объем бетона перемычек", source_class: AUTO_CALCULATED, formula: "max(lintel_concrete_min_order_volume_m3, ceil(lintel_concrete_spec_volume_m3))", leaf_inputs: [{ref: review_parameters.lintel_concrete_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: defaults.lintel_concrete_min_order_volume_m3, source_class: DEFAULT}], calculator_input_path: "", notes: "Feeds both lintel_concrete_b22_5_m300_material and manual_concrete_lifting. Production spec_volume mode does NOT apply concrete_waste_coeff (only the legacy_length_section mode does) — found 2026-07-10 that the pre-existing lintel_concrete_b22_5_m300_material line in this contract incorrectly multiplied by concrete_waste_coeff; fixed alongside this entry."}
  - {key: gas_block_delivery_total_volume_m3, label_ru: "Суммарный закупочный объем блоков для доставки", source_class: AUTO_CALCULATED, formula: "main_gas_block_d400_600x400x250_material.order_volume_m3 + main_gas_block_d500_600x250x250_material.order_volume_m3 + floor_2_gas_block_d400_material.order_volume_m3 + parapet_gas_block_d400_material.order_volume_m3 + vent_chimney_gas_block_d500_600x150x250_material.order_volume_m3", leaf_inputs: [{ref: review_parameters.main_wall_gas_block_400_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.main_wall_gas_block_250_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.floor_2_masonry_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.parapet_masonry_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.vent_chimney_gas_block_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.floors_count, source_class: AUTO_PROJECT}, {ref: supplier_inputs.flat_roof_enabled, source_class: MANUAL_REVIEW}, {ref: defaults.gas_block_waste_coeff, source_class: DEFAULT}, {ref: defaults.gas_block_d400_pallet_volume_m3, source_class: DEFAULT}, {ref: defaults.gas_block_d500_250_pallet_volume_m3, source_class: DEFAULT}, {ref: defaults.gas_block_d500_150_pallet_volume_m3, source_class: DEFAULT}], calculator_input_path: "", notes: "The floor_2/parapet/vent terms are each 0 whenever that group's own estimate lines are disabled (floors_count != 2, or no flat roof) — no special-casing needed in the sum itself."}
  - {key: gas_block_delivery_trucks, label_ru: "Количество машин доставки блоков", source_class: AUTO_CALCULATED, formula: "ceil(gas_block_delivery_total_volume_m3 / gas_block_delivery_truck_capacity_m3)", leaf_inputs: [{ref: auto_calculated.gas_block_delivery_total_volume_m3, source_class: AUTO_CALCULATED}, {ref: defaults.gas_block_delivery_truck_capacity_m3, source_class: DEFAULT}], calculator_input_path: "", notes: "Feeds gas_blocks_and_mix_delivery and gas_blocks_unloading_manipulator (same quantity for both) and the crane-shift threshold below."}
  - {key: main_walls_crane_shifts, label_ru: "Смены автокрана 25т для несущих стен", source_class: AUTO_CALCULATED, formula: "1 if gas_block_delivery_trucks <= 3 else 2", leaf_inputs: [{ref: auto_calculated.gas_block_delivery_trucks, source_class: AUTO_CALCULATED}], calculator_input_path: "", notes: "Production mode is delivery_trucks_threshold; legacy manual shift count is not production."}

calculator_input_mapping:
  - input_path: "project_name"
    from:
      ref: "defaults.project_name"
      source_class: DEFAULT
    required: true
    transform: job_metadata_project_name
    fallback: null
    notes: ""

  - input_path: "*"
    from:
      ref: "review_parameters + supplier_inputs + defaults + price_keys"
      source_class: MIXED
    required: true
    transform: build_load_bearing_walls_lintels_input
    fallback: null
    notes: "Adapter must fill calculator defaults and resolved price fields without copying old fixture values."

estimate_lines:
  - code: scaffolding_setup_dismantling
    name_ru: "Устройство лесов, подмостей для кладки, демонтаж лесов"
    unit: "компл"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=scaffolding_setup_dismantling]"
    quantity:
      formula: "floors_count * scaffolding_setup_units_per_floor"
      leaf_inputs:
        - {ref: "review_parameters.floors_count", source_class: AUTO_PROJECT}
        - {ref: "defaults.scaffolding_setup_units_per_floor", source_class: DEFAULT}
    prices: {material_unit_price_key: null, work_unit_price_key: scaffolding_setup_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: cutoff_waterproofing_under_first_row_blocks
    name_ru: "Гидроизоляция поверхности под первый ряд блоков"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=cutoff_waterproofing_under_first_row_blocks]"
    quantity:
      formula: "cutoff_waterproofing_load_bearing_walls_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.cutoff_waterproofing_load_bearing_walls_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: cutoff_waterproofing_material_unit_price, work_unit_price_key: cutoff_waterproofing_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Not partition walls."

  - code: main_load_bearing_wall_masonry_work
    name_ru: "Кладка внешних, внутренних стен из газобетонных блоков"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=main_load_bearing_wall_masonry_work]"
    quantity:
      formula: "main_wall_gas_block_400_spec_volume_m3 + main_wall_gas_block_250_spec_volume_m3"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_gas_block_400_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.main_wall_gas_block_250_spec_volume_m3", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: main_wall_masonry_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: lintel_concreting_work
    name_ru: "Бетонирование перемычек"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=lintel_concreting_work]"
    quantity:
      formula: "lintel_total_length_m"
      leaf_inputs:
        - {ref: "review_parameters.lintel_total_length_m", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: lintel_concreting_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: lintel_concrete_b22_5_m300_material
    name_ru: "Бетон В22,5 М300 для перемычек"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=lintel_concrete_b22_5_m300_material]"
    quantity:
      formula: "lintel_concrete_order_volume_m3"
      leaf_inputs:
        - {ref: "auto_calculated.lintel_concrete_order_volume_m3", source_class: AUTO_CALCULATED}
    prices: {material_unit_price_key: concrete_m300_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Fixed 2026-07-10: previous formula incorrectly multiplied lintel_concrete_spec_volume_m3 by concrete_waste_coeff. Verified directly against calculate_lintel_concrete() in load_bearing_walls_lintels_calculator.py — the spec_volume branch (production mode) does not apply concrete_waste_coeff at all, only the legacy_length_section branch does. Same order volume also feeds manual_concrete_lifting."

  - code: scaffolding_timber_material
    name_ru: "Пиломатериал обрезной хвойных пород для устройства лесов, подмостей 2 сорт ГОСТ"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=scaffolding_timber_material]"
    quantity:
      formula: "floors_count * scaffolding_timber_m3_per_floor"
      leaf_inputs:
        - {ref: "review_parameters.floors_count", source_class: AUTO_PROJECT}
        - {ref: "defaults.scaffolding_timber_m3_per_floor", source_class: DEFAULT}
    prices: {material_unit_price_key: scaffolding_timber_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: main_gas_block_d400_600x400x250_material
    name_ru: "Газобетонный блок D400 600x400x250 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=main_gas_block_d400_600x400x250_material]"
    quantity:
      formula: "ceil_to_pallet(main_wall_gas_block_400_spec_volume_m3 * gas_block_waste_coeff, gas_block_d400_pallet_volume_m3)"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_gas_block_400_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.gas_block_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.gas_block_d400_pallet_volume_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: gas_block_d400_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Purchased volume rounded up to full pallets."

  - code: main_gas_block_d500_600x250x250_material
    name_ru: "Газобетонный блок D500 600x250x250 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=main_gas_block_d500_600x250x250_material]"
    quantity:
      formula: "ceil_to_pallet(main_wall_gas_block_250_spec_volume_m3 * gas_block_waste_coeff, gas_block_d500_250_pallet_volume_m3)"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_gas_block_250_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.gas_block_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.gas_block_d500_250_pallet_volume_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: gas_block_d500_250_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Purchased volume rounded up to full pallets."

  - code: main_gas_block_adhesive
    name_ru: "Монтажный клей для блоков 25 кг"
    unit: "мешок"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=main_gas_block_adhesive]"
    quantity:
      formula: "ceil((main_wall_gas_block_400_spec_volume_m3 + main_wall_gas_block_250_spec_volume_m3) * adhesive_consumption_bag_per_m3 * adhesive_waste_coeff)"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_gas_block_400_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.main_wall_gas_block_250_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.adhesive_consumption_bag_per_m3", source_class: DEFAULT}
        - {ref: "defaults.adhesive_waste_coeff", source_class: DEFAULT}
    prices: {material_unit_price_key: adhesive_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Glue for main load-bearing walls only; floor_2/parapet glue are separate lines."

  - code: sand_concrete_m300_first_row
    name_ru: "Пескобетон (ЦПС) М300 40 кг"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=sand_concrete_m300_first_row]"
    quantity:
      formula: "ceil(cutoff_waterproofing_load_bearing_walls_area_m2 * sand_concrete_consumption_kg_per_m2_per_10mm * sand_concrete_thickness_factor / sand_concrete_bag_weight_kg)"
      leaf_inputs:
        - {ref: "review_parameters.cutoff_waterproofing_load_bearing_walls_area_m2", source_class: AUTO_PROJECT}
        - {ref: "defaults.sand_concrete_consumption_kg_per_m2_per_10mm", source_class: DEFAULT}
        - {ref: "defaults.sand_concrete_thickness_factor", source_class: DEFAULT}
        - {ref: "defaults.sand_concrete_bag_weight_kg", source_class: DEFAULT}
    prices: {material_unit_price_key: sand_concrete_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Leveling layer under first row of blocks."

  - code: u_block_lintel_cutting
    name_ru: "Резка блока под перемычку (U-блок)"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=u_block_lintel_cutting]"
    quantity:
      formula: "lintel_total_length_m / gas_block_length_m"
      leaf_inputs:
        - {ref: "review_parameters.lintel_total_length_m", source_class: AUTO_PROJECT}
        - {ref: "defaults.gas_block_length_m", source_class: DEFAULT}
    prices: {material_unit_price_key: null, work_unit_price_key: u_block_cutting_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Unit stays pieces; do not convert to meters."

  - code: main_wall_chasing_for_d10_reinforcement
    name_ru: "Штробление блоков под дополнительное усиление, армирование арматурой диаметром 10 мм"
    unit: "мп"
    enabled_by_default: true
    line_role: control_zero_row
    calculator_result_path: "estimate_lines[code=main_wall_chasing_for_d10_reinforcement]"
    quantity:
      formula: "sum(main_wall_rebar_items.spec_length_m)"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_rebar_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero-priced control row; payable rebar is the main_wall_rebar_items dynamic rows below."

  - code: main_wall_rebar_items
    name_ru: "Арматура несущих стен по диаметрам"
    unit: "мп"
    enabled_by_default: true
    line_role: dynamic_material_rows
    calculator_result_path: "estimate_lines[code=load_bearing_walls_floor_*_rebar_*]"
    quantity:
      formula: "ceil(spec_length_m * rebar_waste_coeff / rod_length_m) * rod_length_m per row"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_rebar_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.rebar_waste_coeff", source_class: DEFAULT}
    prices: {material_unit_price_key: rebar_unit_price_by_item, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "One estimate line per row of main_wall_rebar_items, any diameter/class. Line code/name auto-derived when not supplied in the row, e.g. load_bearing_walls_floor_1_rebar_a500_d10."

  - code: gas_blocks_and_mix_delivery
    name_ru: "Доставка блоков, смеси"
    unit: "маш"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=gas_blocks_and_mix_delivery]"
    quantity:
      formula: "gas_block_delivery_trucks"
      leaf_inputs:
        - {ref: "auto_calculated.gas_block_delivery_trucks", source_class: AUTO_CALCULATED}
    prices: {material_unit_price_key: gas_block_delivery_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: gas_blocks_unloading_manipulator
    name_ru: "Разгрузка блоков, смеси манипулятором"
    unit: "маш"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=gas_blocks_unloading_manipulator]"
    quantity:
      formula: "gas_block_delivery_trucks"
      leaf_inputs:
        - {ref: "auto_calculated.gas_block_delivery_trucks", source_class: AUTO_CALCULATED}
    prices: {material_unit_price_key: gas_block_unloading_manipulator_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Same quantity as gas_blocks_and_mix_delivery."

  - code: main_walls_blocks_crane_moving_25t
    name_ru: "Перемещение блоков, смеси автокраном 25 т"
    unit: "смена"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=main_walls_blocks_crane_moving_25t]"
    quantity:
      formula: "main_walls_crane_shifts"
      leaf_inputs:
        - {ref: "auto_calculated.main_walls_crane_shifts", source_class: AUTO_CALCULATED}
    prices: {material_unit_price_key: crane_25t_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Production mode is delivery_trucks_threshold; legacy manual shift count is not production."

  - code: lintel_rebar_frame_assembly
    name_ru: "Изготовление и монтаж каркаса армирования перемычек"
    unit: "мп"
    enabled_by_default: true
    line_role: control_zero_row
    calculator_result_path: "estimate_lines[code=lintel_rebar_frame_assembly]"
    quantity:
      formula: "sum(lintel_rebar_items.order_length_m)"
      leaf_inputs:
        - {ref: "review_parameters.lintel_rebar_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero-priced aggregate row before the dynamic lintel_rebar_items rows."

  - code: lintel_rebar_items
    name_ru: "Арматура перемычек по диаметрам"
    unit: "мп"
    enabled_by_default: true
    line_role: dynamic_material_rows
    calculator_result_path: "estimate_lines[code=lintels_floor_*_rebar_*]"
    quantity:
      formula: "ceil(spec_length_m * rebar_waste_coeff / rod_length_m) * rod_length_m per row"
      leaf_inputs:
        - {ref: "review_parameters.lintel_rebar_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.rebar_waste_coeff", source_class: DEFAULT}
    prices: {material_unit_price_key: rebar_unit_price_by_item, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "One estimate line per row of lintel_rebar_items, any diameter/class, e.g. lintels_floor_1_rebar_a500_d12 and lintels_floor_1_rebar_a240_d6."

  - code: lintel_concrete_delivery
    name_ru: "Доставка бетона до объекта"
    unit: "рейс"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=lintel_concrete_delivery]"
    quantity:
      formula: "concrete_delivery_trips"
      leaf_inputs:
        - {ref: "supplier_inputs.concrete_delivery_trips", source_class: SUPPLIER_INPUT}
    prices: {material_unit_price_key: concrete_delivery_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Supplier/manual quantity; not a reusable default."

  - code: manual_concrete_lifting
    name_ru: "Перенос, подъем бетона вручную"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=manual_concrete_lifting]"
    quantity:
      formula: "lintel_concrete_order_volume_m3"
      leaf_inputs:
        - {ref: "auto_calculated.lintel_concrete_order_volume_m3", source_class: AUTO_CALCULATED}
    prices: {material_unit_price_key: null, work_unit_price_key: manual_concrete_lifting_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Same ordered volume as lintel_concrete_b22_5_m300_material."

  - code: floor_2_masonry_work
    name_ru: "Кладка несущих стен 2-го этажа из газобетонных блоков"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=floor_2_masonry_work]"
    quantity:
      formula: "floor_2_masonry_volume_m3 when floors_count = 2"
      leaf_inputs:
        - {ref: "review_parameters.floors_count", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_2_masonry_volume_m3", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: main_wall_masonry_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: floor_2_gas_block_d400_material
    name_ru: "Газобетонный блок D400 600x400x250мм для кладки над кухней-гостиной"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=floor_2_gas_block_d400_material]"
    quantity:
      formula: "ceil_to_pallet(floor_2_masonry_volume_m3 * gas_block_waste_coeff, gas_block_d400_pallet_volume_m3) when floors_count = 2"
      leaf_inputs:
        - {ref: "review_parameters.floors_count", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_2_masonry_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.gas_block_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.gas_block_d400_pallet_volume_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: gas_block_d400_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Material row for floor_2/current upper masonry block."

  - code: floor_2_masonry_glue
    name_ru: "Монтажный клей для блоков 25 кг, кладка над кухней-гостиной"
    unit: "мешок"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=floor_2_masonry_glue]"
    quantity:
      formula: "ceil(floor_2_masonry_volume_m3 * adhesive_consumption_bag_per_m3 * adhesive_waste_coeff) when floors_count = 2"
      leaf_inputs:
        - {ref: "review_parameters.floors_count", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_2_masonry_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.adhesive_consumption_bag_per_m3", source_class: DEFAULT}
        - {ref: "defaults.adhesive_waste_coeff", source_class: DEFAULT}
    prices: {material_unit_price_key: adhesive_unit_price, work_unit_price_key: null, fixed_amount_key: null}
