    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=main_load_bearing_wall_masonry_work]"
    quantity:
      formula: "main_wall_gas_block_400_spec_volume_m3 + main_wall_gas_block_250_spec_volume_m3"
      leaf_inputs:
        - {ref: "review_parameters.main_wall_gas_block_400_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.main_wall_gas_block_250_spec_volume_m3", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: main_wall_masonry_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: lintel_concreting_work
    name_ru: "Бетонирование перемычек"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=lintel_concreting_work]"
    quantity:
      formula: "lintel_total_length_m"
      leaf_inputs:
        - {ref: "review_parameters.lintel_total_length_m", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: lintel_concreting_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Made conditional 2026-07-15: only returned when lintel_total_length_m > 0 (floor 1 may have no U-block lintels — see review_parameters.lintel_total_length_m)."

  - code: lintel_concrete_b22_5_m300_material
    name_ru: "Бетон В22,5 М300 для перемычек"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=lintel_concrete_b22_5_m300_material]"
    quantity:
      formula: "max(1, ceil(lintel_required_concrete_volume_m3 + floor_1_lintel_monolithic_concrete_volume_m3))"
      leaf_inputs:
        - {ref: "review_parameters.lintel_concrete_spec_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.floor_1_lintel_monolithic_concrete_volume_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.lintel_concrete_min_order_volume_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: concrete_m300_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Fixed 2026-07-10: previous formula incorrectly multiplied lintel_concrete_spec_volume_m3 by concrete_waste_coeff. Verified directly against calculate_lintel_concrete() in load_bearing_walls_lintels_calculator.py — the spec_volume branch (production mode) does not apply concrete_waste_coeff at all, only the legacy_length_section branch does. Formula changed 2026-07-15: now combines U-block + monolithic concrete need for floor 1 into one purchase (same truck, Elena) before the 1 m3 minimum; made conditional — only returned when the combined need is > 0. Same order volume also feeds manual_concrete_lifting."

  - code: scaffolding_timber_material
