checks:
  required_source_classes: [AUTO_PROJECT, DEFAULT, AUTO_CALCULATED, PRICE, SUPPLIER_INPUT, MANUAL_REVIEW]
  required_review_parameters:
    - floors_count
    - cutoff_waterproofing_load_bearing_walls_area_m2
    - main_wall_gas_block_400_spec_volume_m3
    - main_wall_gas_block_250_spec_volume_m3
    - lintel_total_length_m
    - lintel_concrete_spec_volume_m3
    - main_wall_rebar_items
    - lintel_rebar_items
  forbidden_production_inputs:
    - old_fixture_values
    - old_expected_result_values
    - display_quantity_overrides
    - legacy_second_light_addon
    - legacy_wall_geometry
    - legacy_weight_items
    - legacy_manual_toggle
  expected_estimate_line_count: 30
  contamination_check:
    old_project_markers_allowed: false
    fixture_values_allowed: false
    old_expected_result_values_allowed: false
  notes: "estimate_lines fully built out 2026-07-10 from catalogs/estimate_line_catalog.yaml, verified directly against load_bearing_walls_lintels_calculator.py line by line (23 always-present lines + up to 7 conditional lines when both floors_count=2 and flat_roof_enabled with parapet/vent volumes > 0 = 30 max simultaneous; the catalog header's calculator_estimate_line_count: 27 was stale/inaccurate, superseded by this direct count). Two real bugs found and fixed during verification, both pure contract-YAML corrections (no calculator code touched): (1) lintel_concrete_b22_5_m300_material incorrectly applied concrete_waste_coeff, which production spec_volume mode never does; (2) vent_chimney_gas_block_cladding_work's gate was missing the vent_chimney_gas_block_spec_volume_m3 > 0 condition alongside flat_roof_enabled. Also found and fixed a structural gap: this contract had no auto_calculated or checks sections at all before this pass, and was missing 9 required LoadBearingWallsLintelsInput dataclass fields with no calculator-side default (added as new defaults/price_keys entries, documented individually with 2026-07-10 dates) — without them the adapter would fail to construct the calculator input at all, in production mode or otherwise."
