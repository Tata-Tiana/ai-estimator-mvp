contract_version: 0.1

section:
  code: load_bearing_walls_lintels
  name_ru: "Стены и перемычки"
  calculator_module: "experiments/load_bearing_walls_lintels_calculator/load_bearing_walls_lintels_calculator.py"
  status: draft
  owner_notes: "Production contract: spec modes only where available; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/load_bearing_walls_lintels_calculator/load_bearing_walls_lintels_calculator.py"
  calculator_readme: "experiments/load_bearing_walls_lintels_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_load_bearing_walls_lintels_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: floors_count
    label_ru: "Количество этажей для расчета стен"
    unit: "эт."
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floors_count"
    calculator_input_path: "floors_count"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floors_count.value"
    value_kind: integer
    parser_mapping:
      target_codes: ["floors_count"]
      aliases_ru: ["количество этажей", "этажность", "2 этажа", "1 этаж"]
      expected_unit: "шт"
      notes: "MVP calculator supports only 1 or 2 floors."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_fallback_if_no_wall_block_items"
      action_ru: "Проверьте этажность только если нет строк wall_block_items, по которым калькулятор может определить второй уровень."
    validation: {numeric: true, min_value: 1, max_value: 2}
    notes: "2026-07-23: no longer the source of truth for floor_2 wall masonry OR scaffolding tier
      count when wall_block_items[] is used — both now derive from whether a wall_block_items row
      with wall_role='floor_2' actually exists, not from this PDF-text-derived field. This value is
      still required as a fallback for legacy inputs (no wall_block_items supplied) and is still
      shown for review, but real projects have shown the PDF's literal 'этажность' text and the
      calculator's real per-tier pricing need are different things that do not reliably coincide
      (ЮСВ: text says 1, real second tier exists; АРК: no text at all). See
      fact_of_data_vs_text_signal_principle memory and
      ARK_TRC_USV_WALL_ROOF_LINTEL_FINDINGS_PLAN.md section 10."

  - key: cutoff_waterproofing_load_bearing_walls_area_m2
    label_ru: "Гидроизоляция под первый ряд несущих стен, площадь"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "cutoff_waterproofing_load_bearing_walls_area"
    calculator_input_path: "cutoff_waterproofing_load_bearing_walls_area_m2"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.cutoff_waterproofing_load_bearing_walls_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["cutoff_waterproofing_load_bearing_walls_area"]
      aliases_ru: ["гидроизоляция под первый ряд блоков", "отсечная гидроизоляция стен", "гидроизоляция несущих стен"]
      expected_unit: "м2"
      notes: "Production uses spec_area. Do not reconstruct from wall lengths."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь отсечной гидроизоляции только под несущие стены."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not include partition walls."

  - key: main_wall_gas_block_400_spec_volume_m3
    label_ru: "Газобетон D400 600x400x250 для основных стен, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "main_wall_gas_block_400_spec_volume"
    calculator_input_path: "main_wall_gas_block_400_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.main_wall_gas_block_400_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["main_wall_gas_block_400_spec_volume"]
      aliases_ru: ["газобетон D400 600x400x250", "блок D400 400 мм", "наружные несущие стены D400"]
      expected_unit: "м3"
      notes: "Main load-bearing wall block volume only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем D400 400 мм для основных несущих стен."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: main_wall_gas_block_250_spec_volume_m3
    label_ru: "Газобетон D500 600x250x250 для основных стен, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "main_wall_gas_block_250_spec_volume"
    calculator_input_path: "main_wall_gas_block_250_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.main_wall_gas_block_250_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["main_wall_gas_block_250_spec_volume"]
      aliases_ru: ["газобетон D500 600x250x250", "блок D500 250 мм", "внутренние несущие стены D500"]
      expected_unit: "м3"
      notes: "Main load-bearing 250 mm wall block volume only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем D500 250 мм для основных несущих стен."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: lintel_total_length_m
    label_ru: "Суммарная длина перемычек в U-блоках, 1-й этаж"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "lintel_total_length"
    calculator_input_path: "lintel_total_length_m"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.lintel_total_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["lintel_total_length"]
      aliases_ru: ["суммарная длина перемычек", "перемычки итого длина", "ведомость перемычек", "длина перемычек в u-блоках"]
      expected_unit: "мп"
      notes: "PDFs give this as an explicit total line in the lintel materials spec table (e.g. 'Длина перемычек в U-блоках'), verified against real ЮСВ/ТРЦ КР2 drawings 2026-07-12 — not a mark-by-mark table. U-block portion only; see lintel_1_monolithic_concrete_volume_m3 for the monolithic portion."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть перемычки в U-блоках, проверьте суммарную длину. Перемычек на этаже может не быть вовсе, или быть только монолитными — Елена, 2026-07-15."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not use this row for slab beams. Made optional 2026-07-15 — a floor may have no U-block lintels at all (only monolithic, or no lintels at all)."

  - key: lintel_concrete_spec_volume_m3
    label_ru: "Бетон перемычек в U-блоках, объем по спецификации, 1-й этаж"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "lintel_concrete_volume"
    calculator_input_path: "lintel_concrete_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.lintel_concrete_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["lintel_concrete_volume"]
      aliases_ru: ["бетон перемычек", "бетон для перемычек", "перемычка бетон", "бетон перемычек в u-блоке"]
      expected_unit: "м3"
      notes: "Lintel concrete only; not slab or beam concrete. U-block portion only; see lintel_1_monolithic_concrete_volume_m3 for the monolithic portion (material purchase combines both, work lines stay split)."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть перемычки в U-блоках, проверьте объем бетона по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Made optional 2026-07-15, same reasoning as lintel_total_length_m."

  - key: floor_2_lintel_ublock_total_length_m
    label_ru: "Суммарная длина перемычек в U-блоках, 2-й этаж"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_2_lintel_total_length"
    calculator_input_path: "floor_2_lintel_ublock_total_length_m"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_2_lintel_ublock_total_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_2_lintel_total_length"]
      aliases_ru: ["суммарная длина перемычек 2 этаж", "перемычки 2-го этажа итого длина", "длина перемычек в u-блоках 2 этаж"]
      expected_unit: "мп"
      notes: "Same table as lintel_total_length_m but for floor 2's own spec table. Independent of floor 1 — Elena, 2026-07-15: lintels may be present on either floor, both, or neither."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 2-м этаже есть перемычки в U-блоках, проверьте суммарную длину."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-15. Confirmed on real ТРЦ project (2-й этаж: 20,5 м.п., 35 шт резки U-блока) — floor_2 needs its own length, not shared with floor 1."

  - key: floor_2_lintel_concrete_spec_volume_m3
    label_ru: "Бетон перемычек в U-блоках, объем по спецификации, 2-й этаж"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_2_lintel_concrete_volume"
    calculator_input_path: "floor_2_lintel_concrete_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_2_lintel_concrete_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_2_lintel_concrete_volume"]
      aliases_ru: ["бетон перемычек 2 этаж", "бетон перемычек в u-блоке 2 этаж"]
      expected_unit: "м3"
      notes: "Floor 2's U-block portion only; combined with floor_2_lintel_monolithic_concrete_volume_m3 for the material purchase line."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 2-м этаже есть перемычки в U-блоках, проверьте объем бетона по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-15."

  - key: floor_2_concrete_delivery_trips
    label_ru: "Доставка бетона до объекта, рейсов, 2-й этаж"
    unit: "рейс"
    source_class: MANUAL_REVIEW
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_2_concrete_delivery_trips"
    calculator_input_path: "floor_2_concrete_delivery_trips"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_2_concrete_delivery_trips.value"
    value_kind: scalar
    parser_mapping:
      target_codes: []
      aliases_ru: []
      expected_unit: "рейс"
      notes: "Manual/business input, not a PDF extraction target — mirrors the existing concrete_delivery_trips field for floor 1."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 2-м этаже есть перемычки (любого типа), укажите количество рейсов доставки бетона."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-15."

  - key: floor_1_lintel_monolithic_concrete_volume_m3
    label_ru: "Бетон монолитных перемычек, объем, 1-й этаж"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_1_lintel_monolithic_concrete_volume"
    calculator_input_path: "floor_1_lintel_monolithic_concrete_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_1_lintel_monolithic_concrete_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_1_lintel_monolithic_concrete_volume"]
      aliases_ru: ["бетон монолитных перемычек 1 этаж", "монолитные перемычки бетон", "бетонирование монолитных перемычек"]
      expected_unit: "м3"
      notes: "Monolithic (poured-in-place) lintels are a second construction method alongside U-block lintels — Elena, 2026-07-15: present in at least 50% of projects, independently of U-block lintels, on either floor."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть монолитные перемычки, проверьте объем бетона."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-15. When present (>0), triggers the monolithic concrete/formwork block. Updated 2026-07-29 (Elena): monolithic lintels are not always insulated, and when insulated may cover only part of their length, so insulation uses its own floor_X_lintel_monolithic_insulation_length_m and must not be inferred from concrete volume."

  - key: floor_1_lintel_monolithic_total_length_m
    label_ru: "Монолитные перемычки, общая длина, 1-й этаж"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_1_lintel_monolithic_total_length"
    calculator_input_path: "floor_1_lintel_monolithic_total_length_m"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_1_lintel_monolithic_total_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_1_lintel_monolithic_total_length"]
      aliases_ru: ["общая длина монолитных перемычек", "длина монолитных перемычек", "монолитные перемычки общая длина"]
      expected_unit: "мп"
      notes: "Added 2026-07-28. Work quantity for monolithic lintel concreting. Do not use concrete volume and do not substitute insulation length — insulation may cover only part of monolithic lintels."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть монолитные перемычки, проверьте их общую длину для строки бетонирования."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-28. Needed because monolithic lintel concreting work is priced by length in м.п.; concrete volume remains a separate material/purchase input."

  - key: floor_1_lintel_monolithic_insulation_length_m
    label_ru: "Утепление торца монолитной перемычки, длина, 1-й этаж"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_1_lintel_insulation_length"
    calculator_input_path: "floor_1_lintel_monolithic_insulation_length_m"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_1_lintel_monolithic_insulation_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_1_lintel_insulation_length"]
      aliases_ru: ["утепление торца монолитной перемычки", "устройство утепления перемычки"]
      expected_unit: "мп"
      notes: "Direct spec value, not derived from monolithic concrete volume — do not reconstruct from geometry."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть монолитные перемычки, проверьте длину утепления торца. Не все монолитные перемычки обязательно утеплены — берите длину только тех, что реально утеплены по спецификации, не всю длину монолитных перемычек."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-15. Confirmed by Elena 2026-07-29 and by a real project case: edge insulation does not always cover every monolithic lintel on a floor — this must be the length of only the insulated part of lintels, not the total monolithic lintel length. Feeds both the insulation work line and the glue-foam quantity, so an inflated length overcounts both."

  - key: floor_1_lintel_formwork_horizontal_area_m2
    label_ru: "Опалубка монолитной перемычки, 1-й этаж — горизонтальная площадь"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_1_lintel_formwork_horizontal_area"
    calculator_input_path: "floor_1_lintel_formwork_horizontal_area_m2"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_1_lintel_formwork_horizontal_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_1_lintel_formwork_horizontal_area"]
      aliases_ru: ["опалубка монолитной перемычки горизонтальная площадь", "горизонтальная опалубка перемычки"]
      expected_unit: "m2"
      notes: "Added 2026-07-25. Real projects never give a ready plywood sheet count or timber m3 — always this raw area. Calculator derives sheets/timber from horizontal+vertical area combined."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть монолитные перемычки, проверьте горизонтальную площадь опалубки."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-08-05. Fixes a real gap found while auditing the ТРЦ run: extraction has produced this target_code since 2026-07-25 (calculator_targets_compact.json/target_aliases_ru.yaml), and the calculator dataclass field floor_1_lintel_formwork_horizontal_area_m2 has existed since the same date (see lintel_monolithic_formwork_from_area_shipped memory) - but no review_parameters entry ever wired extraction to this calculator input. Real project area (e.g. ТРЦ: 0,5 m2) was silently never reaching the calculator, so formwork_plywood_qty/formwork_timber_volume_m3 computed from a missing area defaulted toward zero - plywood/timber cost silently dropped from the estimate with no needs_review/missing flag anywhere."

  - key: floor_1_lintel_formwork_vertical_area_m2
    label_ru: "Опалубка монолитной перемычки, 1-й этаж — вертикальная площадь"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_1_lintel_formwork_vertical_area"
    calculator_input_path: "floor_1_lintel_formwork_vertical_area_m2"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_1_lintel_formwork_vertical_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_1_lintel_formwork_vertical_area"]
      aliases_ru: ["опалубка монолитной перемычки вертикальная площадь", "вертикальная опалубка перемычки"]
      expected_unit: "m2"
      notes: "Added 2026-07-25. Pairs with floor_1_lintel_formwork_horizontal_area — see its notes."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть монолитные перемычки, проверьте вертикальную площадь опалубки."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-08-05. Same gap/fix as floor_1_lintel_formwork_horizontal_area_m2 — see its notes."

  - key: floor_1_lintel_formwork_plywood_qty
    label_ru: "Фанера для опалубки монолитных перемычек, 1-й этаж"
    unit: "шт"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_1_lintel_formwork_plywood_qty"
    calculator_input_path: "floor_1_lintel_formwork_plywood_qty"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_1_lintel_formwork_plywood_qty.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_1_lintel_formwork_plywood_qty"]
      aliases_ru: ["фанера для опалубки перемычек", "фанера перемычки"]
      expected_unit: "шт"
      notes: "Material only — Elena, 2026-07-15: 'в СС работы на устройство опалубки нет' (no formwork-installation work line; U-block lintels need no formwork at all)."
    review_behavior:
      show_to_user: false
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Legacy only. Removed from the calculator 2026-07-25 (Elena: real PDFs never give a ready sheet count) — plywood is now derived from formwork area, see calculate_monolithic_lintel_block's formwork_plywood_qty output."
