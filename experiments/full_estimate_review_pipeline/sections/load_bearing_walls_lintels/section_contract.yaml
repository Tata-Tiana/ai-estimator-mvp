  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: floors_count
    label_ru: "Количество этажей для расчета стен"
    unit: "эт."
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floors_count"
    calculator_input_path: "floors_count"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floors_count.value"
    value_kind: integer
    parser_mapping:
      target_codes: ["floors_count"]
      aliases_ru: ["количество этажей", "этажность", "2 этажа", "1 этаж"]
      expected_unit: "шт"
      notes: "MVP calculator supports only 1 or 2 floors."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте этажность для раздела стен."
    validation: {numeric: true, min_value: 1, max_value: 2}
    notes: "Used for floors_based scaffolding and optional 2nd floor wall block."

  - key: cutoff_waterproofing_load_bearing_walls_area_m2
