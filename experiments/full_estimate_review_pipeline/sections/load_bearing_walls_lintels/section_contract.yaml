contract_version: 0.1

section:
  code: load_bearing_walls_lintels
  name_ru: "Стены и перемычки"
  calculator_module: "experiments/load_bearing_walls_lintels_calculator/load_bearing_walls_lintels_calculator.py"
  status: draft
  owner_notes: "Production contract: spec modes only where available; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/load_bearing_walls_lintels_calculator/load_bearing_walls_lintels_calculator.py"
  calculator_readme: "experiments/load_bearing_walls_lintels_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_load_bearing_walls_lintels_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: floors_count
    label_ru: "Количество этажей для расчета стен"
    unit: "эт."
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floors_count"
    calculator_input_path: "floors_count"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floors_count.value"
    value_kind: integer
    parser_mapping:
      target_codes: ["floors_count"]
      aliases_ru: ["количество этажей", "этажность", "2 этажа", "1 этаж"]
      expected_unit: "шт"
      notes: "MVP calculator supports only 1 or 2 floors."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте этажность для раздела стен."
    validation: {numeric: true, min_value: 1, max_value: 2}
    notes: "Used for floors_based scaffolding and optional 2nd floor wall block."

  - key: cutoff_waterproofing_load_bearing_walls_area_m2
    label_ru: "Гидроизоляция под первый ряд несущих стен, площадь"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "cutoff_waterproofing_load_bearing_walls_area"
    calculator_input_path: "cutoff_waterproofing_load_bearing_walls_area_m2"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.cutoff_waterproofing_load_bearing_walls_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["cutoff_waterproofing_load_bearing_walls_area"]
      aliases_ru: ["гидроизоляция под первый ряд блоков", "отсечная гидроизоляция стен", "гидроизоляция несущих стен"]
      expected_unit: "м2"
      notes: "Production uses spec_area. Do not reconstruct from wall lengths."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь отсечной гидроизоляции только под несущие стены."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not include partition walls."

  - key: main_wall_gas_block_400_spec_volume_m3
    label_ru: "Газобетон D400 600x400x250 для основных стен, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "main_wall_gas_block_400_spec_volume"
    calculator_input_path: "main_wall_gas_block_400_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.main_wall_gas_block_400_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["main_wall_gas_block_400_spec_volume"]
      aliases_ru: ["газобетон D400 600x400x250", "блок D400 400 мм", "наружные несущие стены D400"]
      expected_unit: "м3"
      notes: "Main load-bearing wall block volume only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем D400 400 мм для основных несущих стен."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: main_wall_gas_block_250_spec_volume_m3
    label_ru: "Газобетон D500 600x250x250 для основных стен, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "main_wall_gas_block_250_spec_volume"
    calculator_input_path: "main_wall_gas_block_250_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.main_wall_gas_block_250_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["main_wall_gas_block_250_spec_volume"]
      aliases_ru: ["газобетон D500 600x250x250", "блок D500 250 мм", "внутренние несущие стены D500"]
      expected_unit: "м3"
      notes: "Main load-bearing 250 mm wall block volume only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем D500 250 мм для основных несущих стен."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: lintel_total_length_m
    label_ru: "Суммарная длина перемычек"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "lintel_total_length"
    calculator_input_path: "lintel_total_length_m"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.lintel_total_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["lintel_total_length", "lintel_items"]
      aliases_ru: ["суммарная длина перемычек", "перемычки итого длина", "ведомость перемычек"]
      expected_unit: "мп"
      notes: "Production uses spec_total_length. Row-by-row lintel_items may be kept as diagnostics."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте суммарную длину перемычек."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not use this row for slab beams."

  - key: lintel_concrete_spec_volume_m3
    label_ru: "Бетон перемычек, объем по спецификации"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "lintel_concrete_volume"
    calculator_input_path: "lintel_concrete_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.lintel_concrete_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["lintel_concrete_volume"]
      aliases_ru: ["бетон перемычек", "бетон для перемычек", "перемычка бетон"]
      expected_unit: "м3"
      notes: "Lintel concrete only; not slab or beam concrete."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем бетона перемычек по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: floor_2_masonry_volume_m3
    label_ru: "Кладка несущих стен 2-го этажа, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_2_masonry_volume"
    calculator_input_path: "floor_2_masonry_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.floor_2_masonry_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_2_masonry_volume"]
      aliases_ru: ["несущие стены 2 этажа", "кладка стен 2-го этажа", "газобетон 2 этаж"]
      expected_unit: "м3"
      notes: "Required only when floors_count is 2."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если в проекте два этажа, проверьте объем кладки несущих стен 2-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: parapet_masonry_volume_m3
    label_ru: "Кладка парапета, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "parapet_masonry_volume"
    calculator_input_path: "parapet_masonry_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.parapet_masonry_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["parapet_masonry_volume"]
      aliases_ru: ["кладка парапета", "парапеты газобетон", "объем парапетов"]
      expected_unit: "м3"
      notes: "Usually comes from flat roof context."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если есть плоская кровля с парапетом, проверьте объем кладки парапета."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: vent_chimney_gas_block_spec_volume_m3
    label_ru: "Газобетон 150 мм для обкладки вентканалов, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "vent_chimney_gas_block_150_volume"
    calculator_input_path: "vent_chimney_gas_block_spec_volume_m3"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.vent_chimney_gas_block_spec_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["vent_chimney_gas_block_150_volume", "vent_chimney_cladding_segments"]
      aliases_ru: ["обкладка вентканалов газобетон 150", "газобетон D500 150 мм вентканалы", "обкладка дымохода и вентканалов"]
      expected_unit: "м3"
      notes: "Do not confuse with Schiedel block piece counts."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если есть обкладка вентканалов, проверьте объем газобетона 150 мм."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: main_wall_rebar_items
    label_ru: "Арматура несущих стен по диаметрам"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "main_wall_rebar_items"
    calculator_input_path: "main_wall_rebar_items"
    normalized_json_path: "sections.load_bearing_walls_lintels.parameters.main_wall_rebar_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    columns:
      - {key: floor, label_ru: "Этаж", unit: "", value_kind: integer}
      - {key: component, label_ru: "Компонент", unit: "", value_kind: string}
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: spec_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: kg_per_meter, label_ru: "Масса 1 м", unit: "кг/м", value_kind: number}
      - {key: rod_length_m, label_ru: "Длина прутка", unit: "м", value_kind: number}
      - {key: unit_price_per_m, label_ru: "Цена за метр", unit: "руб/м", value_kind: number}
    parser_mapping:
      target_codes: ["main_wall_rebar_items"]
      aliases_ru: ["арматура несущих стен", "армирование кладки несущих стен"]
      expected_unit: "мп"
      notes: "Primary PDF unit is m.п.; do not compute kg in chat extraction unless kg is explicit in PDF. rod_length_m is a catalog/spec value; unit_price_per_m is adapter-filled from rebar_unit_price_by_item, not a PDF value — do not ask the parser for it."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте позиции арматуры несущих стен по диаметрам, каждая строка спецификации отдельной строкой."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Primary PDF unit is m.п.; do not compute kg in chat extraction unless kg is explicit in PDF."

