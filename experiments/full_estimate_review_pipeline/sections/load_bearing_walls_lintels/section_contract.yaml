    notes: "Legacy compatibility only. Production calculates this row from section subtotal by walls_consumables_rate."

auto_calculated:
  - {key: lintel_concrete_order_volume_m3, label_ru: "Заказной объем бетона перемычек в U-блоке, 1-й этаж (без монолита)", source_class: AUTO_CALCULATED, formula: "max(lintel_concrete_min_order_volume_m3, ceil(lintel_concrete_spec_volume_m3))", leaf_inputs: [{ref: review_parameters.lintel_concrete_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: defaults.lintel_concrete_min_order_volume_m3, source_class: DEFAULT}], calculator_input_path: "", notes: "Diagnostic-only as of 2026-07-15 — no longer feeds any estimate line directly. lintel_concrete_b22_5_m300_material and manual_concrete_lifting now use the combined U-block+monolithic formula (see those estimate_lines entries) instead of this U-block-only value. Production spec_volume mode does NOT apply concrete_waste_coeff (only the legacy_length_section mode does) — found 2026-07-10 that the pre-existing lintel_concrete_b22_5_m300_material line in this contract incorrectly multiplied by concrete_waste_coeff; fixed alongside this entry."}
  - {key: gas_block_delivery_total_volume_m3, label_ru: "Суммарный закупочный объем блоков для доставки", source_class: AUTO_CALCULATED, formula: "main_gas_block_d400_600x400x250_material.order_volume_m3 + main_gas_block_d500_600x250x250_material.order_volume_m3 + floor_2_gas_block_d400_material.order_volume_m3 + parapet_gas_block_d400_material.order_volume_m3 + vent_chimney_gas_block_d500_600x150x250_material.order_volume_m3", leaf_inputs: [{ref: review_parameters.main_wall_gas_block_400_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.main_wall_gas_block_250_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.floor_2_masonry_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.parapet_masonry_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.vent_chimney_gas_block_spec_volume_m3, source_class: AUTO_PROJECT}, {ref: review_parameters.floors_count, source_class: AUTO_PROJECT}, {ref: auto_calculated.flat_roof_enabled, source_class: AUTO_CALCULATED}, {ref: defaults.gas_block_waste_coeff, source_class: DEFAULT}, {ref: defaults.gas_block_d400_pallet_volume_m3, source_class: DEFAULT}, {ref: defaults.gas_block_d500_250_pallet_volume_m3, source_class: DEFAULT}, {ref: defaults.gas_block_d500_150_pallet_volume_m3, source_class: DEFAULT}], calculator_input_path: "", notes: "The floor_2/parapet/vent terms are each 0 whenever that group's own estimate lines are disabled (floors_count != 2, or no flat roof) — no special-casing needed in the sum itself."}
  - {key: gas_block_delivery_trucks, label_ru: "Количество машин доставки блоков", source_class: AUTO_CALCULATED, formula: "ceil(gas_block_delivery_total_volume_m3 / gas_block_delivery_truck_capacity_m3)", leaf_inputs: [{ref: auto_calculated.gas_block_delivery_total_volume_m3, source_class: AUTO_CALCULATED}, {ref: defaults.gas_block_delivery_truck_capacity_m3, source_class: DEFAULT}], calculator_input_path: "", notes: "Feeds gas_blocks_and_mix_delivery and gas_blocks_unloading_manipulator (same quantity for both) and the crane-shift threshold below."}
  - {key: main_walls_crane_shifts, label_ru: "Смены автокрана 25т для несущих стен", source_class: AUTO_CALCULATED, formula: "1 if gas_block_delivery_trucks <= 3 else 2", leaf_inputs: [{ref: auto_calculated.gas_block_delivery_trucks, source_class: AUTO_CALCULATED}], calculator_input_path: "", notes: "Production mode is delivery_trucks_threshold; legacy manual shift count is not production."}

calculator_input_mapping:
  - input_path: "project_name"
    from:
      ref: "defaults.project_name"
      source_class: DEFAULT
    required: true
    transform: job_metadata_project_name
    fallback: null
    notes: ""

  - input_path: "*"
    from:
      ref: "review_parameters + supplier_inputs + defaults + price_keys"
      source_class: MIXED
    required: true
    transform: build_load_bearing_walls_lintels_input
    fallback: null
    notes: "Adapter must fill calculator defaults and resolved price fields without copying old fixture values."

estimate_lines:
  - code: scaffolding_setup_dismantling
    name_ru: "Устройство лесов, подмостей для кладки, демонтаж лесов"
    unit: "компл"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=scaffolding_setup_dismantling]"
    quantity:
      formula: "floors_count * scaffolding_setup_units_per_floor"
      leaf_inputs:
        - {ref: "review_parameters.floors_count", source_class: AUTO_PROJECT}
        - {ref: "defaults.scaffolding_setup_units_per_floor", source_class: DEFAULT}
    prices: {material_unit_price_key: null, work_unit_price_key: scaffolding_setup_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: cutoff_waterproofing_under_first_row_blocks
    name_ru: "Гидроизоляция поверхности под первый ряд блоков"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=cutoff_waterproofing_under_first_row_blocks]"
    quantity:
      formula: "cutoff_waterproofing_load_bearing_walls_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.cutoff_waterproofing_load_bearing_walls_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: cutoff_waterproofing_material_unit_price, work_unit_price_key: cutoff_waterproofing_work_unit_price, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Not partition walls."

  - code: main_load_bearing_wall_masonry_work
