    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=manual_concrete_lifting]"
    quantity:
      formula: "max(1, ceil(lintel_required_concrete_volume_m3 + floor_1_lintel_monolithic_concrete_volume_m3))"
