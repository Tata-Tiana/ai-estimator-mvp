      aliases_ru: ["гидроизоляция под первый ряд блоков", "отсечная гидроизоляция стен", "гидроизоляция несущих стен"]
      expected_unit: "м2"
      notes: "Production uses spec_area. Do not reconstruct from wall lengths."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь отсечной гидроизоляции только под несущие стены."
