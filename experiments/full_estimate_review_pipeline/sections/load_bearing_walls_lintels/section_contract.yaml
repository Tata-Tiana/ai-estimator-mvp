      expected_unit: "мп"
      notes: "PDFs give this as an explicit total line in the lintel materials spec table (e.g. 'Длина перемычек в U-блоках'), verified against real ЮСВ/ТРЦ КР2 drawings 2026-07-12 — not a mark-by-mark table. U-block portion only; see lintel_1_monolithic_concrete_volume_m3 for the monolithic portion."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_applicable"
      action_ru: "Если на 1-м этаже есть перемычки в U-блоках, проверьте суммарную длину. Перемычек на этаже может не быть вовсе, или быть только монолитными — Елена, 2026-07-15."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not use this row for slab beams. Made optional 2026-07-15 — a floor may have no U-block lintels at all (only monolithic, or no lintels at all)."

