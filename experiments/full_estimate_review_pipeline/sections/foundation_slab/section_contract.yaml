  - {key: thermal_insert_50_pack_multiple_qty, label_ru: "Кратность пачки термовставки 50 мм", source_class: DEFAULT, value: 0.2776, unit: "м3", calculator_input_path: "thermal_insert_50_pack_multiple_qty", source_note: "Fixed 2026-08-08: was null (real bug - the estimate line's own note said 'must be filled before this line can run', but the adapter never filled it, so pack-rounding was silently skipped and the estimate line showed the raw waste-adjusted quantity instead of a purchasable pack quantity). 0.2776 is this calculator's own established, tested value for a standard Пеноплэкс ГЕО pack (same constant used for eps50_pack_volume_m3/eps100_pack_volume_m3 and already present in multiple foundation_slab_calculator test fixtures, e.g. test_foundation_slab_thermal_inserts_combined_length/input.json).", allow_override_later: true, notes: ""}
  - {key: thermal_insert_100_pack_multiple_qty, label_ru: "Кратность пачки термовставки 100 мм", source_class: DEFAULT, value: 0.2776, unit: "м3", calculator_input_path: "thermal_insert_100_pack_multiple_qty", source_note: "Fixed 2026-08-08: same null-default bug as thermal_insert_50_pack_multiple_qty - see that field's source_note.", allow_override_later: true, notes: ""}
  - {key: rebar_waste_coeff, label_ru: "Коэффициент запаса арматуры", source_class: DEFAULT, value: 1.05, unit: "", calculator_input_path: "rebar_waste_coeff", source_note: "Business/material waste default.", allow_override_later: true, notes: ""}
  - {key: rod_length_m, label_ru: "Длина хлыста арматуры", source_class: DEFAULT, value: 11.7, unit: "м", calculator_input_path: "rebar_items[*].rod_length_m", source_note: "Catalog default unless item overrides.", allow_override_later: true, notes: ""}
  - {key: concrete_waste_coeff, label_ru: "Коэффициент запаса бетона", source_class: DEFAULT, value: 1.05, unit: "", calculator_input_path: "concrete_waste_coeff", source_note: "Fixed 2026-08-08: was 1.02, inconsistent with both the rest of this pipeline (rebar/sand/thermal-insert waste coefficients are all 1.05) and every real project's own formula. Checked real Excel formulas across 7 independent concrete-order rows spanning all 3 reference projects - all exactly base_volume*1.05, rounded up to a truck/order step. Confirmed this was the real cause of one reference project's concrete quantity gap (46.5 vs its real 48 m3 for the same 45.58 m3 slab).", allow_override_later: true, notes: ""}
  - {key: concrete_round_step_m3, label_ru: "Шаг округления бетона", source_class: DEFAULT, value: 0.5, unit: "м3", calculator_input_path: "concrete_round_step_m3", source_note: "Delivery/order rounding default.", allow_override_later: true, notes: ""}
  - {key: box_metal_delivery_capacity_kg, label_ru: "Вместимость доставки металла", source_class: DEFAULT, value: 10000, unit: "кг", calculator_input_path: "box_metal_delivery_capacity_kg", source_note: "Box-level logistics default.", allow_override_later: true, notes: ""}
