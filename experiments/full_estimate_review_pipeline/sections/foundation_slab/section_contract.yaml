auto_calculated:
  - {key: eps50_laying_area_m2, label_ru: "Площадь укладки ЭППС 50 мм", source_class: AUTO_CALCULATED, formula: "eps50_under_slab_volume_m3 / eps50_thickness_m", leaf_inputs: [{ref: review_parameters.eps50_under_slab_volume_m3, source_class: AUTO_PROJECT}, {ref: defaults.eps50_thickness_m, source_class: DEFAULT}], calculator_input_path: "", notes: "Work area, not PDF input."}
  - {key: plywood_sheets, label_ru: "Количество листов фанеры", source_class: AUTO_CALCULATED, formula: "ceil(slab_side_formwork_area_m2 * plywood_waste_coeff / (plywood_sheet_width_m * plywood_sheet_height_m))", leaf_inputs: [{ref: review_parameters.slab_side_formwork_area_m2, source_class: AUTO_PROJECT}, {ref: defaults.plywood_waste_coeff, source_class: DEFAULT}], calculator_input_path: "", notes: ""}
  - {key: concrete_order_volume_m3, label_ru: "Заказной объем бетона", source_class: AUTO_CALCULATED, formula: "round_up_to_step(concrete_project_volume_m3 * concrete_waste_coeff, concrete_round_step_m3)", leaf_inputs: [{ref: review_parameters.concrete_project_volume_m3, source_class: AUTO_PROJECT}, {ref: defaults.concrete_waste_coeff, source_class: DEFAULT}], calculator_input_path: "", notes: ""}
  - {key: rebar_frame_assembly_quantity_m, label_ru: "Закупочная длина арматуры", source_class: AUTO_CALCULATED, formula: "sum(round_up(spec_length_m * rebar_waste_coeff / rod_length_m) * rod_length_m)", leaf_inputs: [{ref: review_parameters.foundation_rebar_items, source_class: AUTO_PROJECT}, {ref: defaults.rebar_waste_coeff, source_class: DEFAULT}, {ref: defaults.rod_length_m, source_class: DEFAULT}], calculator_input_path: "", notes: ""}

calculator_input_mapping:
  - {input_path: "project_name", from: {ref: "defaults.project_name", source_class: DEFAULT}, required: true, transform: job_metadata_project_name, fallback: null, notes: ""}
  - {input_path: "membrane_area_m2", from: {ref: "review_parameters.membrane_area_m2", source_class: AUTO_PROJECT}, required: true, transform: number_m2, fallback: null, notes: ""}
  - {input_path: "slab_side_formwork_area_m2", from: {ref: "review_parameters.slab_side_formwork_area_m2", source_class: AUTO_PROJECT}, required: true, transform: number_m2, fallback: null, notes: ""}
  - {input_path: "eps50_under_slab_volume_m3", from: {ref: "review_parameters.eps50_under_slab_volume_m3", source_class: AUTO_PROJECT}, required: true, transform: number_m3, fallback: null, notes: ""}
  - {input_path: "concrete_project_volume_m3", from: {ref: "review_parameters.concrete_project_volume_m3", source_class: AUTO_PROJECT}, required: true, transform: number_m3, fallback: null, notes: ""}
