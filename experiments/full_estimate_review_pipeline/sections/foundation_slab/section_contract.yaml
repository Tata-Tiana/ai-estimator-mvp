  name_ru: "Фундаментная плита"
  calculator_module: "experiments/foundation_slab_calculator/foundation_slab_calculator.py"
  status: draft
  owner_notes: "Production contract: spec areas/volumes/lengths only; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/foundation_slab_calculator/foundation_slab_calculator.py"
  calculator_readme: "experiments/foundation_slab_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_foundation_slab_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
