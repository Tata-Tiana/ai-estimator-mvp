  - {key: concrete_pump_shifts, label_ru: "Работа бетононасоса, смены", unit: "смена", source_class: MANUAL_REVIEW, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "concrete_pump_shifts", normalized_json_path: "sections.foundation_slab.supplier_inputs.concrete_pump_shifts.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Введите или подтвердите смены бетононасоса."}, notes: ""}
  - {key: logistics_and_supply_amount, label_ru: "Логистика и снабжение", unit: "руб", source_class: MANUAL_REVIEW, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "logistics_and_supply_amount", normalized_json_path: "sections.foundation_slab.supplier_inputs.logistics_and_supply_amount.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Введите или подтвердите фиксированную сумму логистики и снабжения."}, notes: ""}
