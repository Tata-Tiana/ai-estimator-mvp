workbook_layout:
  review_workbook:
    include_on_constructor: true
    project_sheet: "01_Проверка проекта"
    price_sheet: "02_Цены себестоимости"
    details_sheet: "03_Детали объемов"
    candidates_sheet: "05_Кандидаты parser"
    raw_sheet: "06_Сырые данные parser"
  final_estimate_workbook:
    section_order: 2
    section_row_name: "ФУНДАМЕНТНАЯ ПЛИТА"
    white_zone: "A:I"
    calc_zone: "J:O"
    helper_zone: "P:V"
    mini_table_zone: "W:AA+"

checks:
  required_source_classes: [AUTO_PROJECT, DEFAULT, AUTO_CALCULATED, PRICE, SUPPLIER_INPUT, MANUAL_REVIEW]
  required_review_parameters:
    - membrane_area_m2
    - slab_side_formwork_area_m2
    - eps50_under_slab_volume_m3
    - concrete_project_volume_m3
  forbidden_production_inputs:
    - old_fixture_values
    - old_expected_result_values
    - display_quantity_overrides
    - legacy_perimeter_height
    - legacy_weight_to_length
  expected_estimate_line_count: 30
  contamination_check:
    old_project_markers_allowed: false
    fixture_values_allowed: false
    old_expected_result_values_allowed: false
  notes: "This is the first production contract pass; legacy compatibility inputs remain outside review workbook."
