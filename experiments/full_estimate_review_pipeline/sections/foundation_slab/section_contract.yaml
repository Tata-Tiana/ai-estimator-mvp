  - {key: eps50_pack_volume_m3, label_ru: "Объем пачки ЭППС 50 мм", source_class: DEFAULT, value: 0.2776, unit: "м3", calculator_input_path: "eps50_pack_volume_m3", source_note: "Catalog/package value, not PDF extraction.", allow_override_later: true, notes: "Resolved 2026-08-05: same pack volume as eps100_pack_volume_m3 in this section, confirmed identical (0.2776 m3) in 3 real delivered estimates — Пеноплэкс ГЕО packaging is the same physical unit regardless of board thickness. Same value filled in waterproofing.eps50_pack_volume_m3."}
