  - {key: rebar_metal_delivery_trucks, label_ru: "Доставка арматуры и металла, машины", unit: "маш", source_class: MANUAL_REVIEW, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "rebar_metal_delivery_trucks", normalized_json_path: "sections.foundation_slab.supplier_inputs.rebar_metal_delivery_trucks.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Введите или подтвердите количество машин доставки арматуры/металла."}, notes: "Suggested value is box-level, but actual line remains manual."}
