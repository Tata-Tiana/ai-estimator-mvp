  - {key: logistics_and_supply_rate, label_ru: "Коэффициент логистики и снабжения", source_class: DEFAULT, value: 0.02, unit: "", calculator_input_path: "logistics_and_supply_rate", source_note: "Middle default from checked estimate templates: 1.5%-2.5%.", allow_override_later: true, notes: "Editable business coefficient; not a project quantity and not a price."}
  - {key: consumables_tool_amortization_calc_method, label_ru: "Метод расчета расходников и амортизации", source_class: DEFAULT, value: "section_total_rate", unit: "", calculator_input_path: "consumables_tool_amortization_calc_method", source_note: "Production coefficient mode, added 2026-08-03.", allow_override_later: false, notes: "Legacy fixed amount remains supported by calculator only for old cases."}
  - {key: consumables_tool_amortization_rate, label_ru: "Коэффициент расходников и амортизации", source_class: DEFAULT, value: 0.03, unit: "", calculator_input_path: "consumables_tool_amortization_rate", source_note: "Repeated 3% in checked estimate templates.", allow_override_later: true, notes: "Editable business coefficient; not a project quantity and not a price."}
  - {key: technical_supervision_amount, label_ru: "Технический надзор", source_class: DEFAULT, value: 5000, unit: "руб.", calculator_input_path: "technical_supervision_amount", source_note: "Confirmed 2 of 3 real projects' delivered smetas (ТРЦ/АРК; ЮСВ was 10000, an outlier) - fixed amount, not scaled by section size (checked: ranges 0.27%-0.39% of section total across projects, no consistent ratio).", allow_override_later: true, notes: "Business default, not a project quantity from PDF - no longer routed through price registry."}

supplier_inputs:
  - {key: rebar_crane_shifts, label_ru: "Подача арматуры автокраном, смены", unit: "смена", source_class: MANUAL_REVIEW, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "rebar_crane_shifts", normalized_json_path: "sections.foundation_slab.supplier_inputs.rebar_crane_shifts.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Введите или подтвердите смены подачи арматуры автокраном."}, notes: "source_class AUTO_CALCULATED -> MANUAL_REVIEW 2026-07-30 (reverted): no real crane-shift-count formula exists anywhere in the codebase (checked all calculators - the only real formula, main_walls_crane_shifts, is for block delivery, unrelated). The 2026-07-30 automation wrongly reused the box_calculator's delivery-truck allocation for crane shifts by assumption; real smeta data from a reference project disproved this (crane count 2 != delivery count 1 for the same section, floor_slab_1). Elena's final ruling: crane stays purely manual, no invented formula - box_calculator is repurposed for rebar_metal_delivery_trucks below instead, which is what it was actually designed and named for."}
  - {key: rebar_metal_delivery_trucks, label_ru: "Доставка арматуры и металла, машины", unit: "маш", source_class: AUTO_CALCULATED, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "rebar_metal_delivery_trucks", normalized_json_path: "sections.foundation_slab.supplier_inputs.rebar_metal_delivery_trucks.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Автоматически по общему поставочному весу арматуры коробки (box-калькулятор, накопление 10 т) — проверьте и поправьте при необходимости."}, notes: "source_class MANUAL_REVIEW -> AUTO_CALCULATED 2026-07-30: value now comes from compute_rebar_metal_delivery_allocation() in populate_review_workbook_from_extraction.py (box_calculator's 10-tonne threshold allocation across all 4 rebar-bearing sections) - this is exactly what metal_delivery_allocator.py was designed and named for, unlike the crane-shift use we've now reverted above. Still allow_manual_override: true - Elena can correct per section after seeing the total weight."}
  - {key: box_total_metal_weight_kg, label_ru: "Общий поставочный вес металла коробки для контроля доставки", unit: "кг", source_class: AUTO_CALCULATED, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "box_total_metal_weight_kg", normalized_json_path: "sections.foundation_slab.supplier_inputs.box_total_metal_weight_kg.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Автоматически: сумма поставочного веса арматуры по всем разделам с арматурой (box-калькулятор)."}, notes: "source_class MANUAL_REVIEW -> AUTO_CALCULATED 2026-07-30: NOT removable - foundation_slab_calculator.py requires this field unconditionally (validate() and calculate_rebar_block()) to compute suggested_box_metal_delivery_trucks. It is hidden on sheet 01 by populate_review_workbook_from_extraction.py, because Elena sees the same box-wide total once in the final summary row."}
  - {key: concrete_pump_shifts, label_ru: "Работа бетононасоса, смены", unit: "смена", source_class: MANUAL_REVIEW, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "concrete_pump_shifts", normalized_json_path: "sections.foundation_slab.supplier_inputs.concrete_pump_shifts.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Введите или подтвердите смены бетононасоса."}, notes: ""}
  - {key: logistics_and_supply_amount, label_ru: "Логистика и снабжение, legacy сумма", unit: "руб", source_class: SUPPLIER_INPUT, required: false, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "logistics_and_supply_amount", normalized_json_path: "sections.foundation_slab.supplier_inputs.logistics_and_supply_amount.value", exclude_from_manual_values_registry: true, review_behavior: {show_to_user: false, allow_manual_override: true, status_if_missing: "optional", action_ru: "Legacy fixed amount only; production uses logistics_and_supply_rate."}, notes: "Legacy compatibility only. Production calculates this row from section subtotal by logistics_and_supply_rate."}
  - {key: consumables_tool_amortization_amount, label_ru: "Расходные материалы, амортизация инструмента, legacy сумма", unit: "руб", source_class: SUPPLIER_INPUT, required: false, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "consumables_tool_amortization_amount", normalized_json_path: "sections.foundation_slab.supplier_inputs.consumables_tool_amortization_amount.value", exclude_from_manual_values_registry: true, review_behavior: {show_to_user: false, allow_manual_override: true, status_if_missing: "optional", action_ru: "Legacy fixed amount only; production uses consumables_tool_amortization_rate."}, notes: "Legacy compatibility only. Production calculates this row from section subtotal by consumables_tool_amortization_rate."}
  - {key: concrete_mixer_volume_m3, label_ru: "Объем миксера бетона", unit: "м3", source_class: MANUAL_REVIEW, required: true, review_sheet: "01_Проверка проекта", target_code: "", calculator_input_path: "concrete_mixer_volume_m3", normalized_json_path: "sections.foundation_slab.supplier_inputs.concrete_mixer_volume_m3.value", review_behavior: {show_to_user: true, allow_manual_override: true, status_if_missing: "manual_required", action_ru: "Введите объем миксера бетона (влияет на кол-во рейсов доставки, типичное значение 9 м3, см. manual_values_registry.xlsx)."}, notes: "Fixed 2026-08-08: was a silent DEFAULT (7 м3) with no real source (\"Logistics default\"). Checked real Excel formulas in 3 delivered smetas: two of the three reference projects use CEILING(volume/9) -> 9 м3, the third uses CEILING.MATH(volume/7) -> 7 м3. No documented reason for that third project's difference (zone/site-access/supplier fleet - unclear), so this is NOT a stable system rule and must not be hardcoded. required:true (not SUPPLIER_INPUT-optional like earthworks' manual_refinement_depth_m) deliberately: foundation_slab_calculator.py's concrete_mixer_volume_m3 has no Python-level dataclass default, and build_input.py's generic supplier_inputs loop defaults any missing required:false field to 0 - that would divide by zero here. Forcing required:true (same style as sibling fields rebar_crane_shifts/concrete_pump_shifts) makes Elena confirm the real number every project instead of risking a silent 0/wrong value. Typical value 9 (majority pattern) lives in manual_values_registry.xlsx (section_code=foundation_slab, key=concrete_mixer_volume_m3) as a reference only, not an auto-fallback."}

auto_calculated:
  - {key: eps50_laying_area_m2, label_ru: "Площадь укладки ЭППС 50 мм", source_class: AUTO_CALCULATED, formula: "eps50_under_slab_volume_m3 / eps50_thickness_m", leaf_inputs: [{ref: review_parameters.eps50_under_slab_volume_m3, source_class: AUTO_PROJECT}, {ref: defaults.eps50_thickness_m, source_class: DEFAULT}], calculator_input_path: "", notes: "Work area, not PDF input."}
  - {key: plywood_sheets, label_ru: "Количество листов фанеры", source_class: AUTO_CALCULATED, formula: "ceil(slab_side_formwork_area_m2 * plywood_waste_coeff / (plywood_sheet_width_m * plywood_sheet_height_m))", leaf_inputs: [{ref: review_parameters.slab_side_formwork_area_m2, source_class: AUTO_PROJECT}, {ref: defaults.plywood_waste_coeff, source_class: DEFAULT}], calculator_input_path: "", notes: ""}
  - {key: concrete_order_volume_m3, label_ru: "Заказной объем бетона", source_class: AUTO_CALCULATED, formula: "round_up_to_step(concrete_project_volume_m3 * concrete_waste_coeff, concrete_round_step_m3)", leaf_inputs: [{ref: review_parameters.concrete_project_volume_m3, source_class: AUTO_PROJECT}, {ref: defaults.concrete_waste_coeff, source_class: DEFAULT}], calculator_input_path: "", notes: ""}
  - {key: rebar_frame_assembly_quantity_m, label_ru: "Закупочная длина арматуры", source_class: AUTO_CALCULATED, formula: "sum(round_up(spec_length_m * rebar_waste_coeff / rod_length_m) * rod_length_m)", leaf_inputs: [{ref: review_parameters.foundation_rebar_items, source_class: AUTO_PROJECT}, {ref: defaults.rebar_waste_coeff, source_class: DEFAULT}, {ref: defaults.rod_length_m, source_class: DEFAULT}], calculator_input_path: "", notes: ""}
  - {key: membrane_rolls, label_ru: "Количество рулонов мембраны PLANTER", source_class: AUTO_CALCULATED, formula: "ceil(membrane_area_m2 * membrane_overlap_coeff / membrane_roll_area_m2)", leaf_inputs: [{ref: review_parameters.membrane_area_m2, source_class: AUTO_PROJECT}, {ref: defaults.membrane_overlap_coeff, source_class: DEFAULT}, {ref: defaults.membrane_roll_area_m2, source_class: DEFAULT}], calculator_input_path: "", notes: "Found missing 2026-07-10 while building out estimate_lines — feeds both planter_standard_material and planterband_material."}

calculator_input_mapping:
  - {input_path: "project_name", from: {ref: "defaults.project_name", source_class: DEFAULT}, required: true, transform: job_metadata_project_name, fallback: null, notes: ""}
  - {input_path: "membrane_area_m2", from: {ref: "review_parameters.membrane_area_m2", source_class: AUTO_PROJECT}, required: true, transform: number_m2, fallback: null, notes: ""}
  - {input_path: "slab_side_formwork_area_m2", from: {ref: "review_parameters.slab_side_formwork_area_m2", source_class: AUTO_PROJECT}, required: true, transform: number_m2, fallback: null, notes: ""}
  - {input_path: "eps50_under_slab_volume_m3", from: {ref: "review_parameters.eps50_under_slab_volume_m3", source_class: AUTO_PROJECT}, required: true, transform: number_m3, fallback: null, notes: ""}
  - {input_path: "concrete_project_volume_m3", from: {ref: "review_parameters.concrete_project_volume_m3", source_class: AUTO_PROJECT}, required: true, transform: number_m3, fallback: null, notes: ""}
  - {input_path: "rebar_items", from: {ref: "review_parameters.foundation_rebar_items", source_class: AUTO_PROJECT}, required: true, transform: foundation_rebar_rows_to_calculator_items, fallback: null, notes: ""}
  - {input_path: "*", from: {ref: "defaults + price_keys + supplier_inputs", source_class: DEFAULT}, required: true, transform: fill_remaining_calculator_fields, fallback: null, notes: "Adapter must not copy old fixture values."}

