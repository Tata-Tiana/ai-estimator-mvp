contract_version: 0.1

section:
  code: foundation_slab
  name_ru: "Фундаментная плита"
  calculator_module: "experiments/foundation_slab_calculator/foundation_slab_calculator.py"
  status: draft
  owner_notes: "Production contract: spec areas/volumes/lengths only; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/foundation_slab_calculator/foundation_slab_calculator.py"
  calculator_readme: "experiments/foundation_slab_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_foundation_slab_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: membrane_area_m2
    label_ru: "Площадь мембраны PLANTER под фундаментной плитой"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "membrane_area_m2"
    calculator_input_path: "membrane_area_m2"
    normalized_json_path: "sections.foundation_slab.parameters.membrane_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["membrane_area_m2"]
      aliases_ru: ["мембрана PLANTER", "площадь мембраны", "профилированная мембрана"]
      expected_unit: "м2"
      notes: "Membrane work/material base area."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь мембраны под фундаментной плитой."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: slab_side_formwork_area_m2
    label_ru: "Площадь опалубки бортов фундаментной плиты"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "slab_side_formwork_area"
    calculator_input_path: "slab_side_formwork_area_m2"
    normalized_json_path: "sections.foundation_slab.parameters.slab_side_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["slab_side_formwork_area"]
      aliases_ru: ["опалубка бортов", "площадь опалубки бортов", "опалубка торца фундаментной плиты"]
      expected_unit: "м2"
      notes: "Production uses spec area. Do not reconstruct from perimeter and edge height."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь опалубки бортов по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with EPS 100 mm edge volume."

  - key: eps50_under_slab_volume_m3
    label_ru: "ЭППС 50 мм под фундаментной плитой, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "eps_50_under_slab_volume"
    calculator_input_path: "eps50_under_slab_volume_m3"
    normalized_json_path: "sections.foundation_slab.parameters.eps50_under_slab_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["eps_50_under_slab_volume"]
      aliases_ru: ["ЭППС 50 мм под плитой", "ЭППС 50 мм низ плиты", "утепление под плитой ЭППС 50"]
      expected_unit: "м3"
      notes: "Volume below slab; laying area is calculated as volume / thickness."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем ЭППС 50 мм под фундаментной плитой."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with m2 laying area."

  - key: concrete_project_volume_m3
    label_ru: "Проектный объем бетона фундаментной плиты"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "concrete_project_volume"
    calculator_input_path: "concrete_project_volume_m3"
    normalized_json_path: "sections.foundation_slab.parameters.concrete_project_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["concrete_project_volume"]
      aliases_ru: ["бетон фундаментной плиты", "бетон плиты фундамента", "бетон В22,5 фундаментная плита"]
      expected_unit: "м3"
      notes: "Foundation slab concrete only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте проектный объем бетона фундаментной плиты."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not merge with floor slab, beam, lintel, or wall concrete."

  - key: thermal_insert_50_length_m
    label_ru: "Термовставка 50 мм, длина"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_50_length"
    calculator_input_path: "thermal_insert_50_length_m"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_50_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_50_length"]
      aliases_ru: ["термовставка 50 мм длина", "термовставки 50 мм", "термовкладыш 50 мм длина"]
      expected_unit: "мп"
      notes: "Work length, not material volume."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте длину термовставок 50 мм."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: thermal_insert_100_length_m
    label_ru: "Термовставка 100 мм, длина"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_100_length"
    calculator_input_path: "thermal_insert_100_length_m"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_100_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_100_length"]
      aliases_ru: ["термовставка 100 мм длина", "термовставки 100 мм", "термовкладыш 100 мм длина"]
      expected_unit: "мп"
      notes: "Work length, not material volume."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте длину термовставок 100 мм."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: thermal_insert_50_material_spec_qty
    label_ru: "Термовставка 50 мм, материал по спецификации"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_50_material_spec_qty"
    calculator_input_path: "thermal_insert_50_material_spec_qty"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_50_material_spec_qty.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_50_material_spec_qty"]
      aliases_ru: ["термовставка 50 мм объем", "материал термовставок 50 мм", "ЭППС термовставка 50"]
      expected_unit: "м3"
      notes: "Material quantity, not work length."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте материал термовставок 50 мм по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: thermal_insert_100_material_spec_qty
    label_ru: "Термовставка 100 мм, материал по спецификации"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_100_material_spec_qty"
    calculator_input_path: "thermal_insert_100_material_spec_qty"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_100_material_spec_qty.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_100_material_spec_qty"]
      aliases_ru: ["термовставка 100 мм объем", "материал термовставок 100 мм", "ЭППС термовставка 100"]
      expected_unit: "м3"
      notes: "Material quantity, not work length."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте материал термовставок 100 мм по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: foundation_rebar_items
    label_ru: "Арматура фундаментной плиты по диаметрам"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "foundation_rebar_items"
    calculator_input_path: "rebar_items"
    normalized_json_path: "sections.foundation_slab.parameters.foundation_rebar_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    columns:
      - {key: name, label_ru: "Наименование", unit: "", value_kind: string}
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: source_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: kg_per_meter, label_ru: "Масса 1 м", unit: "кг/м", value_kind: number}
    parser_mapping:
      target_codes: ["foundation_rebar_items"]
      aliases_ru: ["арматура фундаментной плиты", "спецификация арматуры плиты", "сетка фундаментной плиты"]
      expected_unit: "мп"
      notes: "One row per rebar position (diameter/class); production primary PDF unit is m.п., do not require PDF total weight."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте позиции арматуры фундаментной плиты по диаметрам, каждая строка спецификации отдельной строкой."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it. Calculator adapter reads sheet 01 (this entry) only, never the mirror."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Production primary PDF unit is m.п.; do not require PDF total weight."

