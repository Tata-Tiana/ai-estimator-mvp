contract_version: 0.1

section:
  code: foundation_slab
  name_ru: "Фундаментная плита"
  calculator_module: "experiments/foundation_slab_calculator/foundation_slab_calculator.py"
  status: draft
  owner_notes: "Production contract: spec areas/volumes/lengths only; no old fixture values or Excel-match overrides."
  ownership:
    element_types: [slab_body]
    rebar_component_types: [slab_body, thermal_insert_reinforcement]
    notes: "The section owns slab bodies and slab/thermal-insert reinforcement only. Ribs, foundation walls, strips, beams, column footings and pads belong to grillage."

source_files:
  calculator: "experiments/foundation_slab_calculator/foundation_slab_calculator.py"
  calculator_readme: "experiments/foundation_slab_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_foundation_slab_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: membrane_area_m2
    label_ru: "Площадь мембраны PLANTER под фундаментной плитой"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "membrane_area_m2"
    calculator_input_path: "membrane_area_m2"
    normalized_json_path: "sections.foundation_slab.parameters.membrane_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["membrane_area_m2"]
      aliases_ru: ["мембрана PLANTER", "площадь мембраны", "профилированная мембрана"]
      expected_unit: "м2"
      notes: "Membrane work/material base area."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_zones_incomplete"
      action_ru: "Проверьте общий итог, если площадь PLANTER не заполнена во всех включённых зонах."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: slab_side_formwork_area_m2
    label_ru: "Площадь опалубки бортов фундаментной плиты"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "slab_side_formwork_area"
    calculator_input_path: "slab_side_formwork_area_m2"
    normalized_json_path: "sections.foundation_slab.parameters.slab_side_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["slab_side_formwork_area"]
      aliases_ru: ["опалубка бортов", "площадь опалубки бортов", "опалубка торца фундаментной плиты"]
      expected_unit: "м2"
      notes: "Production uses spec area. Do not reconstruct from perimeter and edge height."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_zones_incomplete"
      action_ru: "Проверьте общий итог, если площадь бортов не заполнена во всех включённых зонах."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with EPS 100 mm edge volume."

  - key: eps50_under_slab_volume_m3
    label_ru: "ЭППС 50 мм под фундаментной плитой, объем"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "eps_50_under_slab_volume"
    calculator_input_path: "eps50_under_slab_volume_m3"
    normalized_json_path: "sections.foundation_slab.parameters.eps50_under_slab_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["eps_50_under_slab_volume"]
      aliases_ru: ["ЭППС 50 мм под плитой", "ЭППС 50 мм низ плиты", "утепление под плитой ЭППС 50"]
      expected_unit: "м3"
      notes: "Volume below slab; laying area is calculated as volume / thickness."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_zones_incomplete"
      action_ru: "Проверьте общий итог, если горизонтальный ЭППС не заполнен во всех включённых зонах."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with m2 laying area."

  - key: concrete_project_volume_m3
    label_ru: "Проектный объем бетона фундаментной плиты"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "concrete_project_volume"
    calculator_input_path: "concrete_project_volume_m3"
    normalized_json_path: "sections.foundation_slab.parameters.concrete_project_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["concrete_project_volume"]
      aliases_ru: ["бетон фундаментной плиты", "бетон плиты фундамента", "бетон В22,5 фундаментная плита"]
      expected_unit: "м3"
      notes: "Foundation slab concrete only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required_if_zones_incomplete"
      action_ru: "Проверьте общий итог, если бетон не заполнен во всех включённых зонах."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not merge with floor slab, beam, lintel, or wall concrete."

  - key: slab_zones
    label_ru: "Фундаментная плита по зонам"
    unit: ""
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "slab_zones"
    calculator_input_path: "slab_zones"
    normalized_json_path: "sections.foundation_slab.parameters.slab_zones.rows"
    value_kind: repeated_rows
    row_key_field: zone_id
    production_input: true
    item_label_columns: [display_name, level, thickness_m]
    correction_columns: [concrete_volume_m3, membrane_area_m2, side_formwork_area_m2, horizontal_insulation_volume_m3, thickness_m, area_m2, horizontal_insulation_thickness_mm, horizontal_insulation_area_m2, display_name, level, concrete_grade, horizontal_insulation_material, include_in_estimate]
    columns:
      - {key: zone_id, label_ru: "Идентификатор зоны", unit: "", value_kind: string}
      - {key: display_name, label_ru: "Название по проекту", unit: "", value_kind: string}
      - {key: context, label_ru: "Контекст (совместимость)", unit: "", value_kind: string}
      - {key: element_type, label_ru: "Тип элемента", unit: "", value_kind: string}
      - {key: level, label_ru: "Уровень / отметка", unit: "", value_kind: string}
      - {key: thickness_m, label_ru: "Толщина плиты", unit: "м", value_kind: number}
      - {key: area_m2, label_ru: "Площадь плиты", unit: "м2", value_kind: number}
      - {key: concrete_grade, label_ru: "Марка бетона", unit: "", value_kind: string}
      - {key: concrete_volume_m3, label_ru: "Бетон", unit: "м3", value_kind: number}
      - {key: membrane_area_m2, label_ru: "PLANTER под зоной", unit: "м2", value_kind: number}
      - {key: side_formwork_area_m2, label_ru: "Опалубка бортов", unit: "м2", value_kind: number}
      - {key: horizontal_insulation_material, label_ru: "Горизонтальный утеплитель", unit: "", value_kind: string}
      - {key: horizontal_insulation_thickness_mm, label_ru: "Толщина утеплителя", unit: "мм", value_kind: number}
      - {key: horizontal_insulation_area_m2, label_ru: "Площадь утеплителя", unit: "м2", value_kind: number}
      - {key: horizontal_insulation_volume_m3, label_ru: "Объём утеплителя", unit: "м3", value_kind: number}
      - {key: include_in_estimate, label_ru: "Включить зону", unit: "", value_kind: boolean}
    parser_mapping:
      target_codes: ["slab_zones"]
      group_codes: ["slab_zones"]
      aliases_ru: ["фундаментная плита", "плита основания пола", "зона фундаментной плиты"]
      expected_unit: ""
      notes: "One row per physical slab, slab part or thickness/level zone. element_type is always slab_body. Preserve the printed project title in display_name; do not route ribs, walls, strips, beams, column footings or pads here."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте каждую плиту или зону: название, уровень, толщину и проектные количества. Рёбра и другие элементы ростверка здесь не указываются."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false, min_rows: 1, unique_by: [zone_id]}
    notes: "The calculator consumes all supported zone quantities. General scalar totals remain compatible simple-scenario inputs and controls: a complete zone breakdown drives calculation, no zone breakdown falls back to the scalar, a partial breakdown requires the scalar, and conflicting complete totals stop calculation. Empty means that the source has no split, not zero."

  - key: thermal_insert_50_length_m
    label_ru: "Термовставка 50 мм, длина"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_50_length"
    calculator_input_path: "thermal_insert_50_length_m"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_50_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_50_length"]
      aliases_ru: ["термовставка 50 мм длина", "термовставки 50 мм", "термовкладыш 50 мм длина"]
      expected_unit: "мп"
      notes: "Work length, not material volume."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Заполняйте только если в проекте явно есть термовставка 50 мм с отдельной длиной. Если термовставок нет или есть только 100 мм — оставьте пустым."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Optional production input. Thermal inserts can be absent, can be only 100 mm, can be classic 50+100 mm, or can be represented by thermal_insert_items for arbitrary sizes. Do not force a missing 50 mm layer into zero/found."

  - key: thermal_insert_100_length_m
    label_ru: "Термовставка 100 мм, длина"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_100_length"
    calculator_input_path: "thermal_insert_100_length_m"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_100_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_100_length"]
      aliases_ru: ["термовставка 100 мм длина", "термовставки 100 мм", "термовкладыш 100 мм длина"]
      expected_unit: "мп"
      notes: "Work length, not material volume."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Заполняйте только если в проекте явно есть термовставка 100 мм с отдельной длиной. Если термовставок нет — оставьте пустым."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Optional production input. May be the only standard thermal-insert layer in a project; in that case the 50 mm fields stay empty."

  - key: thermal_insert_combined_length_m
    label_ru: "Термовставка, длина (общая на оба слоя)"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_combined_length_m"
    calculator_input_path: "thermal_insert_combined_length_m"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_combined_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_combined_length_m"]
      aliases_ru: ["длина термовставок", "термовставки длина", "термовкладыш длина", "общая длина термовставок"]
      expected_unit: "мп"
      notes: "Use only when the PDF gives one shared length for both EPS layers together, not two separate lengths — see thermal_insert_50_length_m/thermal_insert_100_length_m notes for the mutual-exclusion rule."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Заполняйте это поле ТОЛЬКО если в спецификации одна общая длина термовставок на оба слоя ЭППС. Если длины даны раздельно по 50мм/100мм — используйте два поля выше, это оставьте пустым."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-27. Closes the extraction-routing gap for projects where one shared length would otherwise get duplicated into both thermal_insert_50_length_m and thermal_insert_100_length_m, double-billing installation work. Mutually exclusive with the two length fields above — fill this one OR those two, never both. Optional: leave empty when thermal inserts are absent or when only one layer has its own explicit length."

  - key: thermal_insert_50_material_spec_qty
    label_ru: "Термовставка 50 мм, материал по спецификации"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_50_material_spec_qty"
    calculator_input_path: "thermal_insert_50_material_spec_qty"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_50_material_spec_qty.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_50_material_spec_qty"]
      aliases_ru: ["термовставка 50 мм объем", "материал термовставок 50 мм", "ЭППС термовставка 50"]
      expected_unit: "м3"
      notes: "Material quantity, not work length."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Заполняйте только если в проекте явно есть материал термовставок 50 мм. Если слой 50 мм отсутствует — оставьте пустым."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Optional production input. Missing is valid when the project has no 50 mm thermal-insert layer."

  - key: thermal_insert_100_material_spec_qty
    label_ru: "Термовставка 100 мм, материал по спецификации"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_100_material_spec_qty"
    calculator_input_path: "thermal_insert_100_material_spec_qty"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_100_material_spec_qty.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["thermal_insert_100_material_spec_qty"]
      aliases_ru: ["термовставка 100 мм объем", "материал термовставок 100 мм", "ЭППС термовставка 100"]
      expected_unit: "м3"
      notes: "Material quantity, not work length."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Заполняйте только если в проекте явно есть материал термовставок 100 мм. Если термовставок нет — оставьте пустым."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Optional production input. May be present without a matching 50 mm material row."

  - key: thermal_insert_items
    label_ru: "Термовставки по проекту"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "thermal_insert_items"
    calculator_input_path: "thermal_insert_items"
    normalized_json_path: "sections.foundation_slab.parameters.thermal_insert_items.rows"
    value_kind: repeated_rows
    row_key_field: eps_size
    production_input: true
    item_label_columns: [eps_size]
    correction_columns: [length_m, material_spec_qty_m3, pack_multiple_qty]
    columns:
      - {key: eps_size, label_ru: "Типоразмер (по PDF)", unit: "", value_kind: string}
      - {key: length_m, label_ru: "Длина установки", unit: "мп", value_kind: number}
      - {key: material_spec_qty_m3, label_ru: "Материал по спецификации", unit: "м3", value_kind: number}
      - {key: pack_multiple_qty, label_ru: "Кратность пачки", unit: "м3", value_kind: number}
      - {key: material_unit_price, label_ru: "Цена материала", unit: "", value_kind: number}
    parser_mapping:
      target_codes: ["thermal_insert_items"]
      aliases_ru: ["термовставка", "термовкладыш"]
      expected_unit: ""
      notes: "Added 2026-07-26. Use when the PDF gives thermal inserts by an arbitrary size/type (eps_size as printed, e.g. '100x400x160') instead of a fixed 50mm+100mm split — one row per size. Do not force a project with a single size into the 50/100 fields above (leave those empty and use this group instead); do not use this group when the PDF genuinely gives the 50/100 split (use thermal_insert_50/100_* fields as before)."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Справочно: проверьте типоразмеры и длины термовставок по строкам PDF."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case, thermal_insert_mode='items'). Purely additive — when absent, calculator behavior for thermal_insert_mode='legacy'/'standard_50_100' is unaffected. Requires thermal_insert_mode='items' to be read by the calculator. production_input: true (unlike foundation_wall_items/column_footing_items) because this group is actually wired into foundation_slab_calculator.py and must render per-row on sheet 01, not collapse to a single placeholder row."

  - key: foundation_rebar_items
    label_ru: "Арматура фундаментной плиты по диаметрам"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "foundation_rebar_items"
    calculator_input_path: "rebar_items"
    normalized_json_path: "sections.foundation_slab.parameters.foundation_rebar_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    production_input: true
    item_label_columns: [zone_id, component, steel_class, diameter_mm]
    correction_columns: [source_length_m, kg_per_meter, zone_id, component]
    columns:
      - {key: zone_id, label_ru: "Зона плиты (slab_zones.zone_id)", unit: "", value_kind: string}
      - {key: component, label_ru: "Компонент", unit: "", value_kind: string}
      - {key: name, label_ru: "Наименование", unit: "", value_kind: string}
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: source_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: kg_per_meter, label_ru: "Масса 1 м", unit: "кг/м", value_kind: number}
    parser_mapping:
      target_codes: ["foundation_rebar_items"]
      aliases_ru: ["арматура фундаментной плиты", "спецификация арматуры плиты", "сетка фундаментной плиты", "армирование термовставок", "арматурный каркас термовставки"]
      expected_unit: "мп"
      notes: "One row per rebar position (diameter/class). component enum: slab_body, thermal_insert_reinforcement. zone_id is optional only when a specification is common to the entire foundation slab section. Never place reinforcement of ribs, foundation walls, strips, beams, column footings or pads in this group."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте позиции арматуры тела плиты и усиления в местах термовставок. Арматура рёбер, стен, лент, балок, подколонников и подпятников относится к ростверку."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it. Calculator adapter reads sheet 01 (this entry) only, never the mirror."
    validation: {numeric: true, min_value: 0, max_value: null, allowed_components: [slab_body, thermal_insert_reinforcement]}
    notes: "Production primary PDF unit is m.п.; do not require PDF total weight. zone_id/component are review and ownership fields in this stage; the adapter strips them before calling the current calculator."

  - key: foundation_wall_items
    label_ru: "Стены фундамента/цоколя"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "foundation_wall_items"
    calculator_input_path: ""
    normalized_json_path: "sections.foundation_slab.parameters.foundation_wall_items.rows"
    value_kind: repeated_rows
    row_key_field: context
    production_input: false
    ownership_target: grillage
    item_label_columns: [context]
    correction_columns: [concrete_volume_m3, vertical_formwork_area_m2, planter_membrane_area_m2, waterproofing_coating_area_m2]
    columns:
      - {key: context, label_ru: "Участок стены (по PDF)", unit: "", value_kind: string}
      - {key: concrete_volume_m3, label_ru: "Бетон", unit: "м3", value_kind: number}
      - {key: vertical_formwork_area_m2, label_ru: "Вертикальная опалубка", unit: "м2", value_kind: number}
      - {key: planter_membrane_area_m2, label_ru: "Мембрана PLANTER", unit: "м2", value_kind: number}
      - {key: waterproofing_coating_area_m2, label_ru: "Обмазочная гидроизоляция", unit: "м2", value_kind: number}
      - {key: waterproofing_extent, label_ru: "Охват гидроизоляции (по PDF)", unit: "", value_kind: string}
    parser_mapping:
      target_codes: ["foundation_wall_items"]
      aliases_ru: ["стена фундамента", "стена цоколя", "стена приямка"]
      expected_unit: ""
      notes: "Fundament/цоколь walls below +0,000, distinct from the slab and from above-grade load-bearing walls. context is a free string, do not invent a classification the PDF doesn't state."
