  - {code: foundation_slab_concreting_work, name_ru: "Бетонирование фундаментной плиты", unit: "м3", enabled_by_default: true, calculator_result_path: "estimate_lines[code=foundation_slab_concreting_work]", quantity: {formula: "concrete_project_volume_m3", leaf_inputs: [{ref: review_parameters.concrete_project_volume_m3, source_class: AUTO_PROJECT}]}, prices: {material_unit_price_key: null, work_unit_price_key: concreting_work_unit_price, fixed_amount_key: null}, helper_cells: [], validation: {formula_ready_required: true, excel_formula_exportable: true}, notes: ""}
