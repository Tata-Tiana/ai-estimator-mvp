ui_rules:
  sheet_01:
    preserve_old_readable_layout_until_p6_replacement_is_verified: true
    human_columns_only:
      - "Что проверяем"
      - "Найдено в проекте"
      - "Ед."
      - "Статус"
      - "Уверенность"
      - "Что нужно сделать"
      - "Источник"
      - "Фрагмент проекта"
      - "Комментарий Елены"
    one_row_one_parameter: true
    grey_reference_groups_only:
      - wall_chasing_rebar_items
      - lintel_rebar_items
    color_repeated_project_values: true
    hide_empty_reference_blocks: true
    hide_conditional_absent_rows: true
    notes: >
      Do not repeat the first floor_slabs migration failure: never render a repeated object as one
      unreadable row with several values inside one cell. If a beam/lintel/block/vent value affects
      the calculator and can be manually corrected, it is a colored row with one number in column B.

checks:
  required_source_classes: [AUTO_PROJECT]
