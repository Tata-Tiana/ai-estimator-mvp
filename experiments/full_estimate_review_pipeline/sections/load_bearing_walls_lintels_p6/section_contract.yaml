  - {key: lintel_concreting_work_unit_price, label_ru: "Бетонирование перемычек в U-блоке", price_kind: work, unit: "мп", registry_code: "lintel_concreting_work_m", required: true}
  - {key: lintel_monolithic_concreting_work_unit_price, label_ru: "Бетонирование монолитных перемычек", price_kind: work, unit: "мп", registry_code: "lintel_monolithic_concreting_work_m", required: true}
  - {key: concrete_m300_unit_price, label_ru: "Бетон В22,5 (М300)", price_kind: material, unit: "м3", registry_code: "concrete_b22_5_m3", required: true}
