  - {key: lintel_glue_foam_unit_price, label_ru: "Клей-пена для ЭППС", price_kind: material, unit: "баллон", registry_code: "eps_foam_glue_can", required: true}
  - {key: waste_removal_truck_unit_price, label_ru: "Вывоз мусора с объекта, машина", price_kind: material, unit: "маш", registry_code: "waste_removal_truck", required: true}
  - {key: waste_removal_work_unit_price, label_ru: "Вывоз мусора с объекта, работа", price_kind: work, unit: "маш", registry_code: "waste_removal_work_truck", required: true}
  - {key: technical_supervision_amount, label_ru: "Технический надзор", price_kind: work, unit: "-", registry_code: "technical_supervision_walls_lintels", required: true}
  - {key: rebar_metal_delivery_unit_price, label_ru: "Доставка арматуры, металла", price_kind: material, unit: "маш", registry_code: "metal_delivery_truck", required: false}

defaults:
  - {key: gas_block_waste_coeff, label_ru: "Запас газоблоков", value: 1.05, unit: "коэф.", source_class: DEFAULT, calculator_input_path: "defaults.gas_block_waste_coeff"}
  - {key: gas_block_d400_pallet_volume_m3, label_ru: "Паллета D400 600x400x250", value: 2.15, unit: "м3", source_class: DEFAULT, calculator_input_path: "defaults.gas_block_d400_pallet_volume_m3"}
  - {key: gas_block_d500_250_pallet_volume_m3, label_ru: "Паллета D500 600x250x250", value: 1.8, unit: "м3", source_class: DEFAULT, calculator_input_path: "defaults.gas_block_d500_250_pallet_volume_m3"}
  - {key: gas_block_d500_150_pallet_volume_m3, label_ru: "Паллета D500 600x150x250", value: 1.8, unit: "м3", source_class: DEFAULT, calculator_input_path: "defaults.gas_block_d500_150_pallet_volume_m3"}
  - {key: adhesive_consumption_bag_per_m3, label_ru: "Расход клея на 1 м3 кладки", value: 1.2, unit: "мешок/м3", source_class: DEFAULT, calculator_input_path: "defaults.adhesive_consumption_bag_per_m3"}
  - {key: adhesive_waste_coeff, label_ru: "Запас клея", value: 1.05, unit: "коэф.", source_class: DEFAULT, calculator_input_path: "defaults.adhesive_waste_coeff"}
