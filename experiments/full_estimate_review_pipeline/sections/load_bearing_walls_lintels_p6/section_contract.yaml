contract_version: 0.1

section:
  code: load_bearing_walls_lintels_p6
  name_ru: "Стены и перемычки"
  calculator_module: "experiments/load_bearing_walls_lintels_calculator/load_bearing_walls_lintels_p6_calculator.py"
  status: draft
  owner_notes: >
    P6 clean-slate draft next to the old load_bearing_walls_lintels contract. Do not add this section
    to CANONICAL_SECTIONS until workbook/adapter/parser are migrated and visually checked against the
    old readable walls section. No scalar production fallback: all project data comes through
    wall_zones[] and nested repeated groups.

source_files:
  calculator: "experiments/load_bearing_walls_lintels_calculator/load_bearing_walls_lintels_p6_calculator.py"
  runner: "experiments/load_bearing_walls_lintels_calculator/run_load_bearing_walls_lintels_p6_calc.py"
  first_case: "experiments/load_bearing_walls_lintels_calculator/cases/test_p6_zone_model_basic"
  related_docs:
    - "experiments/full_estimate_review_pipeline/P6_WALLS_LINTELS_DATA_CONTRACT.md"
    - "experiments/full_estimate_review_pipeline/reports/trc_vs_original_comparison/04_load_bearing_walls_lintels.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: wall_zones
    label_ru: "Зоны кладки стен и парапета"
    unit: ""
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "wall_zones"
    calculator_input_path: "wall_zones"
    normalized_json_path: "sections.load_bearing_walls_lintels_p6.parameters.wall_zones.rows"
    value_kind: repeated_rows
    row_key_field: zone_id
    production_input: true
    item_label_columns: [display_name, zone_kind]
    correction_columns: [display_name, zone_kind, cutoff_waterproofing_area_m2]
    columns:
      - {key: zone_id, label_ru: "Идентификатор зоны", unit: "", value_kind: string}
      - {key: display_name, label_ru: "Название зоны по проекту/смете", unit: "", value_kind: string}
      - {key: zone_kind, label_ru: "Тип зоны", unit: "", value_kind: string}
      - {key: cutoff_waterproofing_area_m2, label_ru: "Отсечная гидроизоляция под первый ряд", unit: "м2", value_kind: number}
      - {key: block_delivery_batch_id, label_ru: "Партия доставки блоков (служебно)", unit: "", value_kind: string}
    parser_mapping:
      target_codes: ["wall_zones"]
      group_codes: ["wall_zones"]
      aliases_ru:
        - "кладка стен 1 этажа"
        - "кладка стен 2 этажа"
        - "кладка второго света"
        - "кладка парапета"
        - "обкладка дымохода и вентканалов"
        - "отсечная гидроизоляция под первый ряд блоков"
      expected_unit: ""
      notes: >
        One row per billing zone. Parapet is one billing zone even if the PDF has several parapet
        subzones; keep subzone detail inside nested block_items/rebar rows, not as separate billing
        zones.
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте зоны кладки: 1-й этаж, 2-й этаж/второй свет, парапет, обкладку вентканалов, если она есть."
    validation: {numeric: false, min_rows: 1, sum_checks: []}
    notes: >
      On sheet 01 this must render as a human section block, not as technical JSON. One value per
      row. Only armature is grey/reference; other project values are color-coded and editable if they
      affect calculation.

  - key: wall_block_items
    label_ru: "Газобетонные блоки по зонам"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "wall_block_items"
    calculator_input_path: "wall_zones[].block_items"
    normalized_json_path: "sections.load_bearing_walls_lintels_p6.parameters.wall_block_items.rows"
    value_kind: repeated_rows
    row_key_field: item_id
    production_input: true
    item_label_columns: [zone_id, block_density, block_size]
    correction_columns: [volume_m3, material_unit_price, pallet_volume_m3]
    columns:
      - {key: zone_id, label_ru: "Зона кладки", unit: "", value_kind: string}
      - {key: item_id, label_ru: "Идентификатор строки блока", unit: "", value_kind: string}
      - {key: block_density, label_ru: "Плотность блока", unit: "", value_kind: string}
      - {key: block_size, label_ru: "Размер блока", unit: "", value_kind: string}
      - {key: volume_m3, label_ru: "Объём по спецификации", unit: "м3", value_kind: number}
      - {key: context, label_ru: "Контекст/подзона из PDF", unit: "", value_kind: string}
      - {key: material_unit_price, label_ru: "Цена материала для нестандартного блока", unit: "₽/м3", value_kind: number}
      - {key: pallet_volume_m3, label_ru: "Объём паллеты для нестандартного блока", unit: "м3", value_kind: number}
    parser_mapping:
      target_codes: ["wall_block_items"]
      group_codes: ["wall_block_items"]
      aliases_ru:
        - "спецификация стенового блока"
        - "газобетонный блок"
        - "блок D400"
        - "блок D500"
        - "блок 600x400x250"
        - "блок 600x250x250"
        - "блок 600x150x250"
      expected_unit: "м3"
      notes: "Every row must have zone_id. Do not route partitions into load-bearing billing zones."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте каждый блок по зоне, плотности, размеру и объёму."
    validation: {numeric: false, min_rows: 1, sum_checks: []}
    notes: >
      Standard blocks use price/default by density+size. For other sizes, parser may still keep the
      row, but price/material/pallet may require registry mapping before final estimate.

  - key: wall_chasing_rebar_items
    label_ru: "СПРАВОЧНО: арматура кладки стен и парапета"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "wall_chasing_rebar_items"
    calculator_input_path: "wall_zones[].chasing_rebar_items"
    normalized_json_path: "sections.load_bearing_walls_lintels_p6.parameters.wall_chasing_rebar_items.rows"
    value_kind: repeated_rows
    row_key_field: item_id
    production_input: true
    item_label_columns: [zone_id, purpose, steel_class, diameter_mm]
    correction_columns: []
    columns:
      - {key: zone_id, label_ru: "Зона кладки", unit: "", value_kind: string}
      - {key: item_id, label_ru: "Идентификатор строки арматуры", unit: "", value_kind: string}
      - {key: purpose, label_ru: "Назначение", unit: "", value_kind: string}
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: spec_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: kg_per_meter, label_ru: "Масса 1 м", unit: "кг/м", value_kind: number}
      - {key: rod_length_m, label_ru: "Длина хлыста", unit: "м", value_kind: number}
    parser_mapping:
      target_codes: ["wall_chasing_rebar_items"]
      group_codes: ["wall_chasing_rebar_items"]
      aliases_ru:
        - "спецификация расхода арматуры на армирование стен"
        - "арматура стен"
        - "армирование стен"
        - "арматура парапета"
      expected_unit: "мп"
      notes: "Grey/reference on sheet 01. Elena does not manually edit rebar; project designer fixes it."
    review_behavior:
      show_to_user: true
      allow_manual_override: false
      status_if_missing: "optional"
      action_ru: "СПРАВОЧНО: сверьте арматуру с PDF. Если ошибка, нужна правка проекта, не ручная правка сметы."
    validation: {numeric: false, min_rows: 0, sum_checks: []}
    notes: >
      Calculator pools by zone_id + purpose + steel_class + diameter_mm. This is a production input
      but a grey/reference UI block.

  - key: lintel_items
    label_ru: "Перемычки по зонам"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "lintel_items"
    calculator_input_path: "wall_zones[].lintel_items"
    normalized_json_path: "sections.load_bearing_walls_lintels_p6.parameters.lintel_items.rows"
    value_kind: repeated_rows
    row_key_field: lintel_id
    production_input: true
    item_label_columns: [zone_id, lintel_kind, lintel_id]
    correction_columns: [total_length_m, concrete_volume_m3, formwork_horizontal_area_m2, formwork_vertical_area_m2, insulation_length_m, insulation_eps_spec_volume_m3]
    columns:
      - {key: zone_id, label_ru: "Зона кладки", unit: "", value_kind: string}
      - {key: lintel_id, label_ru: "Идентификатор/марка перемычки", unit: "", value_kind: string}
      - {key: lintel_kind, label_ru: "Тип перемычки", unit: "", value_kind: string}
      - {key: total_length_m, label_ru: "Длина перемычек", unit: "мп", value_kind: number}
      - {key: concrete_volume_m3, label_ru: "Бетон перемычек", unit: "м3", value_kind: number}
      - {key: formwork_horizontal_area_m2, label_ru: "Опалубка горизонтальная", unit: "м2", value_kind: number}
      - {key: formwork_vertical_area_m2, label_ru: "Опалубка вертикальная", unit: "м2", value_kind: number}
      - {key: insulation_length_m, label_ru: "Длина утепляемой части", unit: "мп", value_kind: number}
      - {key: insulation_eps_spec_volume_m3, label_ru: "ЭППС перемычек по спецификации", unit: "м3", value_kind: number}
    parser_mapping:
      target_codes: ["lintel_items"]
      group_codes: ["lintel_items"]
      aliases_ru:
        - "ведомость материалов перемычек"
        - "план перемычек"
        - "перемычки в U-блоке"
        - "монолитные перемычки"
        - "бетон перемычек"
        - "утепление перемычек"
      expected_unit: ""
      notes: >
        lintel_kind enum: u_block, monolithic. Do not infer insulation for all lintels from total
        lintel length; use only explicitly утепляемая длина/объём/площадь rows.
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Если в зоне есть перемычки, проверьте длину, бетон, опалубку и утепление построчно."
    validation: {numeric: false, min_rows: 0, sum_checks: []}
    notes: >
      U-block and monolithic lintels may coexist in one zone. Concrete material purchase is combined
      by zone; work lines stay split by lintel_kind.

  - key: lintel_rebar_items
    label_ru: "СПРАВОЧНО: арматура перемычек"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "lintel_rebar_items"
    calculator_input_path: "wall_zones[].lintel_items[].rebar_items"
    normalized_json_path: "sections.load_bearing_walls_lintels_p6.parameters.lintel_rebar_items.rows"
    value_kind: repeated_rows
    row_key_field: item_id
    production_input: true
    item_label_columns: [zone_id, lintel_id, steel_class, diameter_mm]
    correction_columns: []
    columns:
      - {key: zone_id, label_ru: "Зона кладки", unit: "", value_kind: string}
      - {key: lintel_id, label_ru: "Перемычка", unit: "", value_kind: string}
      - {key: item_id, label_ru: "Идентификатор строки арматуры", unit: "", value_kind: string}
      - {key: purpose, label_ru: "Назначение", unit: "", value_kind: string}
      - {key: steel_class, label_ru: "Класс стали", unit: "", value_kind: string}
      - {key: diameter_mm, label_ru: "Диаметр", unit: "мм", value_kind: number}
      - {key: spec_length_m, label_ru: "Длина по спецификации", unit: "мп", value_kind: number}
      - {key: kg_per_meter, label_ru: "Масса 1 м", unit: "кг/м", value_kind: number}
      - {key: rod_length_m, label_ru: "Длина хлыста", unit: "м", value_kind: number}
    parser_mapping:
      target_codes: ["lintel_rebar_items"]
      group_codes: ["lintel_rebar_items"]
      aliases_ru:
        - "спецификация армирования перемычек"
        - "арматура перемычек"
        - "каркас армирования перемычек"
      expected_unit: "мп"
      notes: "Grey/reference on sheet 01. These rows still feed calculation, but Elena does not edit them manually."
    review_behavior:
      show_to_user: true
      allow_manual_override: false
      status_if_missing: "optional"
      action_ru: "СПРАВОЧНО: сверьте арматуру перемычек с PDF. Если ошибка, нужна правка проекта."
    validation: {numeric: false, min_rows: 0, sum_checks: []}
    notes: "Adapter nests these rows under their lintel_id before calling the P6 calculator."

  - key: rebar_metal_delivery_trucks
    label_ru: "Доставка арматуры и металла, машины"
    unit: "маш"
    source_class: AUTO_CALCULATED
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: ""
    calculator_input_path: "rebar_metal_delivery_trucks"
    normalized_json_path: "sections.load_bearing_walls_lintels_p6.auto_calculated.rebar_metal_delivery_trucks.value"
    value_kind: number
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Автоматически по общему поставочному весу арматуры коробки (box-калькулятор, накопление 10 т) — проверьте и поправьте при необходимости."
    validation: {numeric: true, min: 0}
    notes: >
      Box-calculator allocation across foundation, walls/lintels and slab zones. Quantity may be 0
      when this section contributes metal weight but does not cross the next 10t delivery threshold.

