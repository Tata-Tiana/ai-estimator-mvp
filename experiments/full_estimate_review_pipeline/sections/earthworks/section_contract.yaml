workbook_layout:
  review_workbook:
    include_on_constructor: true
    project_sheet: "01_Проверка проекта"
    price_sheet: "02_Цены себестоимости"
    details_sheet: "03_Детали объемов"
    candidates_sheet: "05_Кандидаты parser"
    raw_sheet: "06_Сырые данные parser"

checks:
  required_source_classes:
    - AUTO_PROJECT
    - DEFAULT
    - AUTO_CALCULATED
    - PRICE
    - SUPPLIER_INPUT
    - MANUAL_REVIEW
  fail_if:
    - "earthworks workbook rows are copied from an old project workbook instead of this contract"
    - "project quantities or old fixture values are stored as defaults"
    - "review parameter count differs from 7 without explanation"
    - "price row count differs from 12 without explanation"
    - "detail table count differs from 2 without explanation"
