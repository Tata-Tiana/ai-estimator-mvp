    unit: "м"
    source_class: SUPPLIER_INPUT
    required: false
    review_sheet: "01-1_Ручные строки (справочник)"
    calculator_input_path: "manual_refinement_depth_m"
    normalized_json_path: "sections.earthworks.supplier_inputs.manual_refinement_depth_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: []
      aliases_ru: []
      expected_unit: "м"
      notes: "Manual/business input, not a PDF extraction target."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
    notes: "Fixed 2026-08-08: was a silent DEFAULT (0.08) with no per-project visibility. Real projects vary - checked real Excel formulas in 3 delivered smetas (TRC/ARK/USV): ARK and USV both use 0.08, TRC uses 0.10. Typical value 0.08 lives in manual_values_registry.xlsx (section_code=earthworks, key=manual_refinement_depth_m); Elena can override per project on sheet 01-1. Falls back to the calculator's own 0.08 default if left blank."
  - key: geotextile_laying_overlap_coeff
    label_ru: "Коэффициент нахлеста геотекстиля в работе (укладка)"
    unit: ""
    source_class: SUPPLIER_INPUT
    required: false
    review_sheet: "01-1_Ручные строки (справочник)"
    calculator_input_path: "geotextile_laying_overlap_coeff"
