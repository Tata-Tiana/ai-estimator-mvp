calculator_input_mapping:
  - input_path: "*"
    from:
      ref: "review_parameters + defaults + price_keys"
      source_class: AUTO_PROJECT
    required: true
    transform: earthworks_review_to_calculator_adapter
    fallback: null
    notes: "Existing earthworks adapter is the reference behavior."

estimate_lines:
  - code: axis_marking
    name_ru: "Разбивка осей"
    unit: "смена"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=axis_marking]"
    quantity:
      formula: "axis_marking_shifts"
      leaf_inputs:
        - ref: defaults.axis_marking_shifts
          source_class: DEFAULT
    prices:
      material_unit_price_key: null
      work_unit_price_key: axis_marking_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""
  - code: excavator_jcb
    name_ru: "Разработка грунта экскаватором JCB"
    unit: "смена"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=excavator_jcb]"
    quantity:
      formula: "ceil(pit_area_m2 * pit_excavation_depth_m / excavator_productivity_m3_per_shift)"
      leaf_inputs:
        - ref: review_parameters.pit_area_m2
          source_class: AUTO_PROJECT
        - ref: review_parameters.pit_excavation_depth_m
          source_class: AUTO_PROJECT
        - ref: defaults.excavator_productivity_m3_per_shift
          source_class: DEFAULT
    prices:
      material_unit_price_key: excavator_material_unit_price
      work_unit_price_key: excavator_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""
  - code: manual_excavation
    name_ru: "Доработка грунта вручную"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=manual_excavation]"
    quantity:
      formula: "manual_excavation_quantity_for_estimate_m3"
      leaf_inputs:
        - ref: auto_calculated.manual_excavation_quantity_for_estimate_m3
          source_class: AUTO_CALCULATED
    prices:
      material_unit_price_key: null
      work_unit_price_key: manual_excavation_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""
  - code: geotextile_laying
