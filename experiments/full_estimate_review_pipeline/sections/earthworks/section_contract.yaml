    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=geotextile_laying]"
    quantity:
      formula: "geotextile_laying_area_m2"
      leaf_inputs:
        - ref: review_parameters.geotextile_laying_area_m2
          source_class: AUTO_PROJECT
    prices:
      material_unit_price_key: null
      work_unit_price_key: geotextile_laying_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""
  - code: geotextile_material
    name_ru: "Геотекстиль"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=geotextile_material]"
    quantity:
      formula: "ceil(geotextile_area_m2 * geotextile_overlap_coeff / geotextile_roll_area_m2) * geotextile_roll_area_m2"
      leaf_inputs:
        - ref: review_parameters.geotextile_area_m2
          source_class: AUTO_PROJECT
        - ref: defaults.geotextile_overlap_coeff
          source_class: DEFAULT
        - ref: defaults.geotextile_roll_area_m2
          source_class: DEFAULT
    prices:
      material_unit_price_key: geotextile_material_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""
  - code: sand_filling
    name_ru: "Засыпка песком"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=sand_filling]"
    quantity:
      formula: "sand_base_volume_m3 + trench_volume_m3"
