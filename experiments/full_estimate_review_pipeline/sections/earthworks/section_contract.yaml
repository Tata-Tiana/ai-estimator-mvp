    notes: "Added 2026-08-09. Real formulas confirmed in ТРЦ/ЮСВ/АРК: manual excavation is not 100% of every trench's volume - only a hand-dug depth beyond the pit floor, times trench length x width, per network. Checked real coefficients (depth beyond pit, m): ТРЦ К1=0.6, ЮСВ К1=0.2 -> average 0.4. АРК has no per-network breakdown (one flat 0.5 for all networks - see manual_trench_depth_other_m). Elena, 2026-08-09: keep this as a manual/reviewable field per project, not a hardcoded constant - real depth depends on soil/design, not just network type. Typical value 0.4 in manual_values_registry.xlsx (section_code=earthworks, key=manual_trench_depth_k1_m)."
