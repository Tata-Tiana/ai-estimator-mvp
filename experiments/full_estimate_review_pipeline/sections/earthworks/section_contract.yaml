    estimate_line_code: communications_material
    label_ru: "Материалы коммуникаций"
    price_kind: material
    unit: "м"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "communications_material_m"
    fallback_key: "communications_material_unit_price"
    allow_manual_override: true
    notes: ""
defaults:
  - key: excavator_shifts_calc_method
    label_ru: "Метод расчета смен экскаватора"
    source_class: DEFAULT
    value: "standard_volume_productivity"
    unit: ""
    calculator_input_path: "excavator_shifts_calc_method"
    source_note: "Production mode from earthworks review-to-calculator constants."
    allow_override_later: false
    notes: ""
  - key: manual_excavation_calc_method
    label_ru: "Метод расчета ручной разработки"
    source_class: DEFAULT
    value: "standard_routes"
    unit: ""
    calculator_input_path: "manual_excavation_calc_method"
    source_note: "Production mode from earthworks review-to-calculator constants."
    allow_override_later: false
    notes: ""
  - key: communications_length_calc_method
    label_ru: "Метод расчета длины коммуникаций"
    source_class: DEFAULT
