  - key: sand_manual_moving_work_unit_price
    estimate_line_code: sand_manual_moving
    label_ru: "Перемещение песка вручную"
    price_kind: work
    unit: "м3"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "sand_manual_moving_m3"
