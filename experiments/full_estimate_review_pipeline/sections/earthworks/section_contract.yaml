      expected_unit: ""
      notes: "Manual/business input, not a PDF extraction target."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
    notes: "Added 2026-08-08. Separate from geotextile_overlap_coeff (material purchase, stable 1.1 across TRC/ARK/USV) - this one is for the LAYING WORK line's area, and checked real Excel formulas: TRC uses 1.1, ARK uses 1.2, USV uses no multiplier at all (1.0/none). NOT a stable system rule - varies by project/estimator judgment (site shape, number of corners/overlaps). Default 1.0 (no markup) matches the calculator's pre-2026-08-08 behavior and USV's real practice; Elena fills in the real project number on sheet 01-1 when the site needs one. Typical value in manual_values_registry.xlsx (section_code=earthworks, key=geotextile_laying_overlap_coeff)."
  - key: manual_trench_depth_k1_m
    label_ru: "Ручная доработка траншеи сверх котлована, К1 (канализация), м"
    unit: "м"
    source_class: SUPPLIER_INPUT
    required: false
    review_sheet: "01-1_Ручные строки (справочник)"
    calculator_input_path: "manual_trench_depth_k1_m"
    normalized_json_path: "sections.earthworks.supplier_inputs.manual_trench_depth_k1_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: []
      aliases_ru: []
      expected_unit: "м"
      notes: "Manual/business input, not a PDF extraction target."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
