auto_calculated:
  - key: manual_excavation_quantity_for_estimate_m3
    label_ru: "Ручная разработка"
    source_class: AUTO_CALCULATED
    formula: "pit_area_m2 * manual_refinement_depth_m + trench_volume_m3"
    leaf_inputs:
      - ref: review_parameters.pit_area_m2
        source_class: AUTO_PROJECT
      - ref: defaults.manual_refinement_depth_m
        source_class: DEFAULT
      - ref: review_parameters.trench_volume_m3
        source_class: AUTO_PROJECT
    calculator_input_path: "manual_excavation_quantity_for_estimate_m3"
    notes: ""
  - key: communications_length_m_cross_check
    label_ru: "Длина коммуникаций по деталям (сверка)"
    source_class: AUTO_CALCULATED
    formula: "sum(included communications_pipe_items.total_length_m)"
    leaf_inputs:
      - ref: review_parameters.communications_pipe_items
        source_class: AUTO_PROJECT
    calculator_input_path: ""
    notes: "Cross-check only, shown next to communications_length_m for Elena to compare. Never wired into calculator_input_mapping or an estimate line — the calculator input is the reviewed review_parameters.communications_length_m scalar. See fix note on communications_pipe_items above."

supplier_inputs: []

calculator_input_mapping:
  - input_path: "*"
    from:
      ref: "review_parameters + defaults + price_keys"
      source_class: AUTO_PROJECT
    required: true
    transform: earthworks_review_to_calculator_adapter
    fallback: null
    notes: "Existing earthworks adapter is the reference behavior."

