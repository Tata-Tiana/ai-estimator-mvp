auto_calculated:
  - key: manual_excavation_quantity_for_estimate_m3
    label_ru: "Ручная разработка"
    source_class: AUTO_CALCULATED
    formula: "pit_area_m2 * manual_refinement_depth_m + trench_manual_portion_m3 (NOT the full trench_volume_m3 - see manual_trench_depth_k1/k2/water/eo/other_m)"
    leaf_inputs:
      - ref: review_parameters.pit_area_m2
        source_class: AUTO_PROJECT
      - ref: defaults.manual_refinement_depth_m
        source_class: DEFAULT
      - ref: review_parameters.trench_volume_m3
        source_class: AUTO_PROJECT
    calculator_input_path: "manual_excavation_quantity_for_estimate_m3"
    notes: "Fixed 2026-08-09: this formula text was stale (whole trench_volume_m3, matching the calculator's old 100%-counted-as-manual behavior). The calculator itself now computes manual_excavation_total_m3 from trench_manual_portion_m3 (per-network hand-dig depth x length x width, see manual_trench_depth_k1/k2/water/eo/other_m in supplier_inputs), not the full excavated trench volume. This AUTO_CALCULATED display field's leaf_inputs weren't updated to list the 5 new coefficients - it remains an approximate cross-check text, not itself wired into the calculator."
  - key: communications_length_m_cross_check
    label_ru: "Длина коммуникаций по деталям (сверка)"
    source_class: AUTO_CALCULATED
    formula: "sum(included communications_pipe_items.total_length_m)"
    leaf_inputs:
      - ref: review_parameters.communications_pipe_items
        source_class: AUTO_PROJECT
    calculator_input_path: ""
    notes: "Cross-check only, shown next to communications_length_m for Elena to compare. Never wired into calculator_input_mapping or an estimate line — the calculator input is the reviewed review_parameters.communications_length_m scalar. See fix note on communications_pipe_items above."
  - key: earthworks_direct_cost_base_before_consumables
    label_ru: "База прямых затрат земли до расходников"
    source_class: AUTO_CALCULATED
    formula: "sum(axis_marking, excavator_jcb, manual_excavation, geotextile_laying, geotextile_material, sand_filling, sand_material, sand_manual_moving, communications_work, communications_material)"
    leaf_inputs:
      - ref: review_parameters
        source_class: AUTO_PROJECT
      - ref: defaults
        source_class: DEFAULT
      - ref: price_keys
        source_class: PRICE
    calculator_input_path: ""
    notes: "Calculated from earthworks estimate lines before consumables; no project-specific totals stored here."
  - key: consumables_amount
    label_ru: "Расходные материалы, амортизация инструмента"
    source_class: AUTO_CALCULATED
    formula: "earthworks_direct_cost_base_before_consumables * consumables_rate"
    leaf_inputs:
      - ref: auto_calculated.earthworks_direct_cost_base_before_consumables
        source_class: AUTO_CALCULATED
      - ref: defaults.consumables_rate
        source_class: DEFAULT
    calculator_input_path: ""
    notes: "Production calculated amount; do not place it on sheet 02 as a price or on sheet 01-1 as manual input."

