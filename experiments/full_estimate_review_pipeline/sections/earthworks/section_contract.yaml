  - key: sand_filling_work_unit_price
    estimate_line_code: sand_filling
    label_ru: "Засыпка песком"
    price_kind: work
    unit: "м3"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "sand_filling_work_m3"
    fallback_key: "sand_filling_work_unit_price"
    allow_manual_override: true
    notes: ""
  - key: sand_material_unit_price
    estimate_line_code: sand_material
    label_ru: "Песок"
    price_kind: material
    unit: "м3"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "sand_m3"
    fallback_key: "sand_material_unit_price"
    allow_manual_override: true
