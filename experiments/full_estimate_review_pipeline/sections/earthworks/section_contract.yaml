    calculator_result_path: "estimate_lines[code=communications_work]"
    quantity:
      formula: "communications_length_m"
      leaf_inputs:
        - ref: review_parameters.communications_length_m
          source_class: AUTO_PROJECT
    prices:
      material_unit_price_key: null
      work_unit_price_key: communications_work_unit_price
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""
  - code: communications_material
    name_ru: "Материалы коммуникаций"
    unit: "м"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=communications_material]"
    quantity:
      formula: "communications_length_m"
      leaf_inputs:
        - ref: review_parameters.communications_length_m
          source_class: AUTO_PROJECT
    prices:
      material_unit_price_key: communications_material_unit_price
      work_unit_price_key: null
      fixed_amount_key: null
    helper_cells: []
    validation:
      formula_ready_required: true
      excel_formula_exportable: true
    notes: ""
  - code: consumables
    name_ru: "Расходные материалы"
    unit: "комплект"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=consumables]"
    quantity:
      formula: "1; amount = earthworks_direct_cost_base_before_consumables * consumables_rate"
