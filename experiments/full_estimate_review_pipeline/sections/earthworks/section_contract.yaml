contract_version: 0.1

section:
  code: earthworks
  name_ru: "Земляные работы"
  calculator_module: "experiments/earthworks_calculator/earthworks_calculator.py"
  status: reference_ready
  owner_notes: "Reference contract from existing earthworks review-to-calculator flow; no project-specific values."

source_files:
  calculator: "experiments/earthworks_calculator/earthworks_calculator.py"
  calculator_readme: "experiments/earthworks_calculator/README.md"
  existing_cases: []
  related_docs:
    - "experiments/full_estimate_review_pipeline/reports/step_01_earthworks_reference.md"
    - "docs/report_earthworks_parser_google_stage1.md"
    - "docs/report_earthworks_review_to_calculator.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: pit_area_m2
    label_ru: "Площадь котлована"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "pit_area_m2"
    calculator_input_path: "pit_area_m2"
    normalized_json_path: "sections.earthworks.parameters.pit_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["pit_area_m2"]
      aliases_ru: ["площадь котлована"]
      expected_unit: "м2"
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь котлована из проекта."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: pit_excavation_depth_m
    label_ru: "Глубина котлована"
    unit: "м"
    source_class: AUTO_PROJECT
    required: false
    required_if:
      absent_group: "pit_items"
    review_sheet: "01_Проверка проекта"
    target_code: "pit_excavation_depth_m"
    calculator_input_path: "pit_excavation_depth_m"
    normalized_json_path: "sections.earthworks.parameters.pit_excavation_depth_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["pit_excavation_depth_m"]
      aliases_ru: ["глубина котлована"]
      expected_unit: "м"
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "conditional_manual_required"
      action_ru: "Проверьте глубину котлована только если ниже нет готовых объёмов выемки pit_items."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Conditional input. Required only for area*depth calculation when the project does not provide ready pit_items volumes."

  - key: pit_items
    label_ru: "Готовые объёмы выемки грунта по записям (котлован, приямки)"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "pit_items"
    calculator_input_path: "pit_items"
    normalized_json_path: "sections.earthworks.parameters.pit_items.rows"
    value_kind: repeated_rows
    row_key_field: context
    production_input: true
    item_label_columns: [context]
    correction_columns: [volume_m3]
    columns:
      - {key: context, label_ru: "Запись (по PDF)", unit: "", value_kind: string}
      - {key: volume_m3, label_ru: "Объём выемки", unit: "м3", value_kind: number}
    parser_mapping:
      target_codes: ["pit_items"]
      aliases_ru: ["объем выемки грунта котлована", "объем выемки грунта приямков"]
      expected_unit: ""
      notes: "Added 2026-07-26 (real project case). Use when the spec gives ready excavation volume totals directly (e.g. main pit + footing pits) instead of area*depth geometry."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Необязательная альтернатива pit_area_m2/pit_excavation_depth_m выше. Используйте, если PDF даёт готовый объём выемки грунта отдельными записями (котлован, приямки) — иначе оставьте пустым и заполняйте площадь/глубину как обычно."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case). Purely additive — when empty/absent, calculator behavior (pit_area_m2 * pit_excavation_depth_m) is byte-identical to before. When non-empty, its sum OVERRIDES the area*depth calculation for excavator shifts. production_input: true because this group IS wired into earthworks_calculator.py and must render per-row on sheet 01."

  - key: sand_base_volume_m3
    label_ru: "Объем песка под основание"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    required_if:
      absent_group: "sand_items"
    review_sheet: "01_Проверка проекта"
    target_code: "sand_base_volume_m3"
    calculator_input_path: "sand_base_volume_m3"
    normalized_json_path: "sections.earthworks.parameters.sand_base_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["sand_base_volume_m3"]
      aliases_ru: ["песок", "объем песка", "песчаная подготовка"]
      expected_unit: "м3"
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "conditional_manual_required"
      action_ru: "Проверьте объем песка из спецификации только если ниже нет готовых объёмов sand_items."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Conditional input. Required only for legacy scalar mode when the project does not provide sand_items."

  - key: sand_items
    label_ru: "Готовые объёмы песка по категориям"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "sand_items"
    calculator_input_path: "sand_items"
    normalized_json_path: "sections.earthworks.parameters.sand_items.rows"
    value_kind: repeated_rows
    row_key_field: context
    production_input: true
    item_label_columns: [context]
    correction_columns: [volume_m3]
    columns:
      - {key: context, label_ru: "Категория (по PDF)", unit: "", value_kind: string}
      - {key: volume_m3, label_ru: "Объём", unit: "м3", value_kind: number}
    parser_mapping:
      target_codes: ["sand_items"]
      aliases_ru: ["песок засыпки пазух стен и дна траншей", "песок дна котлована подпятников"]
      expected_unit: ""
      notes: "Added 2026-07-26 (real project case). Use when the spec gives sand by ready category totals that don't split cleanly into 'under the slab' vs 'under the trenches'."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Необязательная альтернатива sand_base_volume_m3 выше. Используйте, если PDF даёт песок несколькими готовыми категориями — иначе оставьте пустым и заполняйте sand_base_volume_m3 как обычно."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case). Purely additive — when empty/absent, calculator behavior (sand_base_volume_m3 + trench-derived sand) is byte-identical to before. When non-empty, its raw sum replaces that pair before the existing compaction coefficient/truck-rounding are applied. production_input: true because this group IS wired into earthworks_calculator.py and must render per-row on sheet 01."

  - key: trench_volume_m3
    label_ru: "Объем траншей"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "trench_volume_m3"
    calculator_input_path: "trench_volume_m3"
    normalized_json_path: "sections.earthworks.parameters.trench_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["trench_volume_m3"]
      aliases_ru: ["объем траншей", "итого траншеи"]
      expected_unit: "м3"
      notes: "Detail routes may be used as source table when available."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте общий объем траншей."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: geotextile_area_m2
    label_ru: "Площадь геотекстиля"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "geotextile_area_m2"
    calculator_input_path: "geotextile_area_m2"
    normalized_json_path: "sections.earthworks.parameters.geotextile_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["geotextile_area_m2"]
      aliases_ru: ["геотекстиль"]
      expected_unit: "м2"
      notes: "Material area; do not confuse with laying area if both exist."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь материала геотекстиля."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: geotextile_laying_area_m2
    label_ru: "Площадь укладки геотекстиля"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "geotextile_laying_area_m2"
    calculator_input_path: "geotextile_laying_area_m2"
    normalized_json_path: "sections.earthworks.parameters.geotextile_laying_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["geotextile_laying_area_m2"]
      aliases_ru: ["площадь укладки геотекстиля"]
      expected_unit: "м2"
      notes: "Work laying area; may equal material area only after explicit review/assumption."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь укладки геотекстиля."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: communications_length_m
    label_ru: "Длина коммуникаций"
    unit: "м"
    source_class: AUTO_PROJECT
    required: false
    required_if:
      absent_group: "communications_pipe_items"
    review_sheet: "01_Проверка проекта"
    target_code: "communications_length_m"
    calculator_input_path: "communications_length_m"
    normalized_json_path: "sections.earthworks.parameters.communications_length_m.value"
    value_kind: scalar
    cross_check_key: "communications_length_m_cross_check"
    parser_mapping:
      target_codes: ["communications_length_m"]
      aliases_ru: ["длина коммуникаций", "коммуникации"]
      expected_unit: "м"
      notes: "This is the legacy scalar calculator input. If communications_pipe_items exists, the calculator can use pipe_items mode instead."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "conditional_manual_required"
      action_ru: "Проверьте длину коммуникаций; если ниже есть состав труб, сверьте автосумму строк."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: "Conditional input. Required only when the project does not provide communications_pipe_items suitable for pipe_items calculation."

  - key: trench_routes
    label_ru: "Маршруты траншей"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "trench_routes"
    calculator_input_path: "trench_routes"
    normalized_json_path: "sections.earthworks.parameters.trench_routes.rows"
    value_kind: repeated_rows
    row_key_field: route_code
    production_input: true
    item_label_columns: [route_code]
    correction_columns: [length_m, width_m, depth_m, volume_m3]
    columns:
      - key: route_code
        label_ru: "Код маршрута"
        unit: ""
        value_kind: string
        required: true
      - key: name
        label_ru: "Наименование"
        unit: ""
        value_kind: string
        required: true
      - key: length_m
        label_ru: "Длина"
        unit: "м"
        value_kind: number
        required: true
      - key: depth_m
        label_ru: "Глубина"
        unit: "м"
        value_kind: number
        required: true
      - key: width_m
        label_ru: "Ширина"
        unit: "м"
        value_kind: number
        required: false
      - key: volume_m3
        label_ru: "Объем"
        unit: "м3"
        value_kind: number
        required: false
      - key: depth_reference
        label_ru: "Точка отсчёта глубины (контекст по PDF)"
        unit: ""
        value_kind: string
        required: false
    parser_mapping:
      group_codes: ["trench_routes"]
      expected_context: ["траншеи", "котлован"]
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте маршруты траншей построчно; сверьте сумму объемов с trench_volume_m3 выше."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it. trench_volume_m3 (scalar above) still wins for the TOTAL trench volume when given; these per-route rows are what drive the manual (hand-dig) excavation depth split by network type (see manual_trench_depth_k1/k2/water/eo/other_m)."
    validation: {min_rows: 0, sum_checks: []}
    notes: "route_code is required so network type (К1/К2/В1-ВК/ЭО/other) can be detected per route. depth_reference added 2026-07-26: free-text context only (e.g. 'от дна котлована' when the PDF prints a second depth row with a different reference point) — never used by the calculator, purely for the service memo so a future arithmetic check doesn't false-positive on a mismatched reference point. item_label_columns/correction_columns added 2026-07-29: this group used to render as one permanently-blank scalar row (lookup mismatch, see build_review_workbook_from_contracts fix same day) even though real per-route length/depth/width/volume data was already being extracted — now renders per-route so Elena can actually see and correct it, not just trench_volume_m3's total. production_input flipped true 2026-08-09: this group is now passed to the calculator (not diagnostic-only) so the manual_trench_depth_k1/k2/water/eo/other_m coefficients (added 2026-08-09, filled on sheet 01-1) can actually split trench_manual_portion_m3 by network type instead of silently defaulting to 100% of trench_volume_m3 as hand labor. Before this flip the coefficients were correctly wired end-to-end but structurally unreachable — see earthworks_calculator.py's calculate() branch fix same day (trench_routes_result now computed whenever trench_routes is given, independent of whether trench_volume_m3 also wins for the total)."

  - key: communications_pipe_items
    label_ru: "Трубы коммуникаций"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "communications_pipe_items"
    calculator_input_path: "communications_pipe_items"
    normalized_json_path: "sections.earthworks.parameters.communications_pipe_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    production_input: true
    item_label_columns: [name]
    correction_columns: [diameter_mm, pipe_length_m, quantity, total_length_m]
    columns:
      - key: code
        label_ru: "Код позиции"
        unit: ""
        value_kind: string
        required: true
      - key: name
        label_ru: "Наименование"
        unit: ""
        value_kind: string
        required: true
      - key: diameter_mm
        label_ru: "Диаметр"
        unit: "мм"
        value_kind: number
        required: false
      - key: pipe_length_m
        label_ru: "Длина одной"
        unit: "м"
        value_kind: number
        required: true
      - key: quantity
        label_ru: "Количество"
        unit: "шт"
        value_kind: number
        required: true
      - key: total_length_m
        label_ru: "Итоговая длина"
        unit: "м"
        value_kind: number
        required: false
      - key: include_in_communications
        label_ru: "Включено"
        unit: ""
        value_kind: boolean
        required: true
    parser_mapping:
      group_codes: ["communications_pipe_items"]
      expected_context: ["трубы", "коммуникации"]
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте состав труб построчно; сверьте сумму длин с communications_length_m выше."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it. In production this group can feed calculator pipe_items mode when the scalar communications_length_m is absent."
    validation: {min_rows: 0, sum_checks: []}
    notes: "Production repeated rows for communications_length_calc_method=pipe_items. If a project provides one explicit total communications_length_m, that scalar may still be used; otherwise the adapter should pass these rows to the calculator and use the summed included pipe lengths."

price_keys:
  - key: axis_marking_work_unit_price
    estimate_line_code: axis_marking
    label_ru: "Разбивка осей"
    price_kind: work
    unit: "смена"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "axis_marking_shift"
    fallback_key: "axis_marking_work_unit_price"
    allow_manual_override: true
    notes: ""
  - key: excavator_material_unit_price
    estimate_line_code: excavator_jcb
    label_ru: "Экскаватор JCB, материал/аренда"
    price_kind: material
    unit: "смена"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "excavator_jcb_shift_material"
    fallback_key: "excavator_material_unit_price"
    allow_manual_override: true
    notes: "Fixed 2026-08-07: used to share registry_code excavator_jcb_shift with excavator_work_unit_price below, so material silently duplicated the work price (3500) instead of the real rental rate. Real material price 26000 confirmed across 8+ real project smeta snapshots (TRC/ARK/USV, several months) - see normalize_elena_price_registry.py DERIVED_PRICE_ROWS comment for excavator_jcb_shift_material."
  - key: excavator_work_unit_price
