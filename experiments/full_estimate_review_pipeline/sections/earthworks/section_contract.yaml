defaults:
  - key: excavator_shifts_calc_method
    label_ru: "Метод расчета смен экскаватора"
    source_class: DEFAULT
    value: "standard_volume_productivity"
    unit: ""
    calculator_input_path: "excavator_shifts_calc_method"
    source_note: "Production mode from earthworks review-to-calculator constants."
    allow_override_later: false
    notes: ""
  - key: manual_excavation_calc_method
    label_ru: "Метод расчета ручной разработки"
    source_class: DEFAULT
    value: "standard_routes"
    unit: ""
    calculator_input_path: "manual_excavation_calc_method"
    source_note: "Production mode from earthworks review-to-calculator constants."
    allow_override_later: false
    notes: ""
  - key: communications_length_calc_method
    label_ru: "Метод расчета длины коммуникаций"
    source_class: DEFAULT
    value: "legacy_direct_length"
    unit: ""
    calculator_input_path: "communications_length_calc_method"
    source_note: "Production review mode: calculator uses reviewed scalar communications_length_m. The calculator method name is legacy, but the source is the production review row."
    allow_override_later: false
    notes: "Do not switch to pipe_items unless a deliberate adapter mode makes pipe rows the reviewed calculator source."
  - key: excavator_productivity_m3_per_shift
    label_ru: "Производительность экскаватора"
    source_class: DEFAULT
    value: 80
    unit: "м3/смена"
    calculator_input_path: "excavator_productivity_m3_per_shift"
    source_note: "Formula default from earthworks constants."
    allow_override_later: true
    notes: ""
  - key: manual_refinement_depth_m
    label_ru: "Глубина ручной доработки"
    source_class: DEFAULT
    value: 0.08
    unit: "м"
    calculator_input_path: "manual_refinement_depth_m"
    source_note: "Formula default from earthworks constants."
    allow_override_later: true
    notes: ""
  - key: trench_width_m
    label_ru: "Ширина траншеи по умолчанию"
    source_class: DEFAULT
    value: 0.4
    unit: "м"
    calculator_input_path: "trench_width_m"
    source_note: "Formula default from earthworks constants."
    allow_override_later: true
    notes: ""
  - key: sand_compaction_coeff
    label_ru: "Коэффициент уплотнения песка"
    source_class: DEFAULT
    value: 1.3
    unit: ""
    calculator_input_path: "sand_compaction_coeff"
    source_note: "Formula default from earthworks constants."
    allow_override_later: true
    notes: ""
  - key: sand_truck_step_m3
    label_ru: "Кратность машины песка"
    source_class: DEFAULT
    value: 20
    unit: "м3"
    calculator_input_path: "sand_truck_step_m3"
    source_note: "Business/default rounding step from earthworks constants."
    allow_override_later: true
    notes: ""
  - key: geotextile_overlap_coeff
    label_ru: "Коэффициент нахлеста геотекстиля"
    source_class: DEFAULT
    value: 1.1
    unit: ""
    calculator_input_path: "geotextile_overlap_coeff"
    source_note: "Formula default from earthworks constants."
    allow_override_later: true
    notes: ""
  - key: geotextile_roll_area_m2
