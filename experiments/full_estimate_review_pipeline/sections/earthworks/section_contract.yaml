contract_version: 0.1

section:
  code: earthworks
  name_ru: "Земляные работы"
  calculator_module: "experiments/earthworks_calculator/earthworks_calculator.py"
  status: reference_ready
  owner_notes: "Reference contract from existing earthworks review-to-calculator flow; no project-specific values."

source_files:
  calculator: "experiments/earthworks_calculator/earthworks_calculator.py"
  calculator_readme: "experiments/earthworks_calculator/README.md"
  existing_cases: []
  related_docs:
    - "experiments/full_estimate_review_pipeline/reports/step_01_earthworks_reference.md"
    - "docs/report_earthworks_parser_google_stage1.md"
    - "docs/report_earthworks_review_to_calculator.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: pit_area_m2
    label_ru: "Площадь котлована"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "pit_area_m2"
    calculator_input_path: "pit_area_m2"
    normalized_json_path: "sections.earthworks.parameters.pit_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["pit_area_m2"]
      aliases_ru: ["площадь котлована"]
      expected_unit: "м2"
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь котлована из проекта."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: pit_excavation_depth_m
    label_ru: "Глубина котлована"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "pit_excavation_depth_m"
    calculator_input_path: "pit_excavation_depth_m"
    normalized_json_path: "sections.earthworks.parameters.pit_excavation_depth_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["pit_excavation_depth_m"]
      aliases_ru: ["глубина котлована"]
      expected_unit: "м"
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте глубину котлована."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: pit_items
    label_ru: "Готовые объёмы выемки грунта по записям (котлован, приямки)"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "pit_items"
    calculator_input_path: "pit_items"
    normalized_json_path: "sections.earthworks.parameters.pit_items.rows"
    value_kind: repeated_rows
    row_key_field: context
    production_input: true
    item_label_columns: [context]
    correction_columns: [volume_m3]
    columns:
      - {key: context, label_ru: "Запись (по PDF)", unit: "", value_kind: string}
      - {key: volume_m3, label_ru: "Объём выемки", unit: "м3", value_kind: number}
    parser_mapping:
      target_codes: ["pit_items"]
      aliases_ru: ["объем выемки грунта котлована", "объем выемки грунта приямков"]
      expected_unit: ""
      notes: "Added 2026-07-26 (real project case). Use when the spec gives ready excavation volume totals directly (e.g. main pit + footing pits) instead of area*depth geometry."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Необязательная альтернатива pit_area_m2/pit_excavation_depth_m выше. Используйте, если PDF даёт готовый объём выемки грунта отдельными записями (котлован, приямки) — иначе оставьте пустым и заполняйте площадь/глубину как обычно."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case). Purely additive — when empty/absent, calculator behavior (pit_area_m2 * pit_excavation_depth_m) is byte-identical to before. When non-empty, its sum OVERRIDES the area*depth calculation for excavator shifts. production_input: true because this group IS wired into earthworks_calculator.py and must render per-row on sheet 01."

  - key: sand_base_volume_m3
    label_ru: "Объем песка под основание"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "sand_base_volume_m3"
    calculator_input_path: "sand_base_volume_m3"
    normalized_json_path: "sections.earthworks.parameters.sand_base_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["sand_base_volume_m3"]
      aliases_ru: ["песок", "объем песка", "песчаная подготовка"]
      expected_unit: "м3"
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте объем песка из спецификации."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: sand_items
    label_ru: "Готовые объёмы песка по категориям"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "sand_items"
    calculator_input_path: "sand_items"
    normalized_json_path: "sections.earthworks.parameters.sand_items.rows"
    value_kind: repeated_rows
    row_key_field: context
    production_input: true
    item_label_columns: [context]
    correction_columns: [volume_m3]
    columns:
      - {key: context, label_ru: "Категория (по PDF)", unit: "", value_kind: string}
      - {key: volume_m3, label_ru: "Объём", unit: "м3", value_kind: number}
    parser_mapping:
      target_codes: ["sand_items"]
      aliases_ru: ["песок засыпки пазух стен и дна траншей", "песок дна котлована подпятников"]
      expected_unit: ""
      notes: "Added 2026-07-26 (real project case). Use when the spec gives sand by ready category totals that don't split cleanly into 'under the slab' vs 'under the trenches'."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Необязательная альтернатива sand_base_volume_m3 выше. Используйте, если PDF даёт песок несколькими готовыми категориями — иначе оставьте пустым и заполняйте sand_base_volume_m3 как обычно."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case). Purely additive — when empty/absent, calculator behavior (sand_base_volume_m3 + trench-derived sand) is byte-identical to before. When non-empty, its raw sum replaces that pair before the existing compaction coefficient/truck-rounding are applied. production_input: true because this group IS wired into earthworks_calculator.py and must render per-row on sheet 01."

  - key: trench_volume_m3
    label_ru: "Объем траншей"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "trench_volume_m3"
    calculator_input_path: "trench_volume_m3"
    normalized_json_path: "sections.earthworks.parameters.trench_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["trench_volume_m3"]
      aliases_ru: ["объем траншей", "итого траншеи"]
      expected_unit: "м3"
      notes: "Detail routes may be used as source table when available."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте общий объем траншей."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: geotextile_area_m2
    label_ru: "Площадь геотекстиля"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "geotextile_area_m2"
    calculator_input_path: "geotextile_area_m2"
    normalized_json_path: "sections.earthworks.parameters.geotextile_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["geotextile_area_m2"]
      aliases_ru: ["геотекстиль"]
      expected_unit: "м2"
      notes: "Material area; do not confuse with laying area if both exist."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь материала геотекстиля."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: geotextile_laying_area_m2
    label_ru: "Площадь укладки геотекстиля"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "geotextile_laying_area_m2"
    calculator_input_path: "geotextile_laying_area_m2"
    normalized_json_path: "sections.earthworks.parameters.geotextile_laying_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["geotextile_laying_area_m2"]
      aliases_ru: ["площадь укладки геотекстиля"]
      expected_unit: "м2"
      notes: "Work laying area; may equal material area only after explicit review/assumption."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь укладки геотекстиля."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: communications_length_m
    label_ru: "Длина коммуникаций"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "communications_length_m"
    calculator_input_path: "communications_length_m"
    normalized_json_path: "sections.earthworks.parameters.communications_length_m.value"
    value_kind: scalar
    cross_check_key: "communications_length_m_cross_check"
    parser_mapping:
      target_codes: ["communications_length_m"]
      aliases_ru: ["длина коммуникаций", "коммуникации"]
      expected_unit: "м"
      notes: "This is the calculator input. The pipe-items breakdown below is a sheet-01 cross-check row group, not an override source."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте длину коммуникаций; сверьте с составом труб ниже."
    validation:
      numeric: true
      min_value: 0
      max_value: null
    notes: ""

  - key: trench_routes
    label_ru: "Маршруты траншей"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "trench_routes"
    calculator_input_path: "trench_routes"
    normalized_json_path: "sections.earthworks.parameters.trench_routes.rows"
    value_kind: repeated_rows
    row_key_field: route_code
    production_input: false
    columns:
      - key: route_code
        label_ru: "Код маршрута"
        unit: ""
        value_kind: string
        required: true
      - key: name
        label_ru: "Наименование"
        unit: ""
        value_kind: string
        required: true
      - key: length_m
        label_ru: "Длина"
        unit: "м"
        value_kind: number
        required: true
      - key: depth_m
        label_ru: "Глубина"
        unit: "м"
        value_kind: number
        required: true
      - key: width_m
        label_ru: "Ширина"
        unit: "м"
        value_kind: number
        required: false
      - key: volume_m3
        label_ru: "Объем"
        unit: "м3"
        value_kind: number
        required: false
      - key: depth_reference
        label_ru: "Точка отсчёта глубины (контекст по PDF)"
        unit: ""
        value_kind: string
        required: false
    parser_mapping:
      group_codes: ["trench_routes"]
      expected_context: ["траншеи", "котлован"]
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте маршруты траншей построчно; сверьте сумму объемов с trench_volume_m3 выше."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it. Calculator input is trench_volume_m3 (scalar above), not this breakdown."
    validation: {min_rows: 0, sum_checks: []}
    notes: "Reference/cross-check breakdown only; scalar trench_volume_m3 remains the reviewed calculator quantity. route_code is required so this group can also feed calculator fallback safely if that mode is deliberately enabled. depth_reference added 2026-07-26: free-text context only (e.g. 'от дна котлована' when the PDF prints a second depth row with a different reference point) — never used by the calculator, purely for the service memo so a future arithmetic check doesn't false-positive on a mismatched reference point."

  - key: communications_pipe_items
    label_ru: "Трубы коммуникаций"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "communications_pipe_items"
    calculator_input_path: "communications_pipe_items"
    normalized_json_path: "sections.earthworks.parameters.communications_pipe_items.rows"
    value_kind: repeated_rows
    row_key_field: code
    production_input: false
    columns:
      - key: code
        label_ru: "Код позиции"
        unit: ""
        value_kind: string
        required: true
      - key: name
        label_ru: "Наименование"
        unit: ""
        value_kind: string
        required: true
      - key: diameter_mm
        label_ru: "Диаметр"
        unit: "мм"
        value_kind: number
        required: false
      - key: pipe_length_m
        label_ru: "Длина одной"
        unit: "м"
        value_kind: number
        required: true
      - key: quantity
        label_ru: "Количество"
        unit: "шт"
        value_kind: number
        required: true
      - key: total_length_m
        label_ru: "Итоговая длина"
        unit: "м"
        value_kind: number
        required: false
      - key: include_in_communications
        label_ru: "Включено"
        unit: ""
        value_kind: boolean
        required: true
    parser_mapping:
      group_codes: ["communications_pipe_items"]
      expected_context: ["трубы", "коммуникации"]
      notes: ""
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте состав труб построчно; сверьте сумму длин с communications_length_m выше."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов so Elena can check against the PDF spec table without opening it. Calculator input is communications_length_m (scalar above), not this breakdown."
    validation: {min_rows: 0, sum_checks: []}
    notes: "Reference/cross-check breakdown only; scalar communications_length_m remains the reviewed calculator quantity. code is required so this group can also feed calculator pipe_items mode safely if that mode is deliberately enabled."

