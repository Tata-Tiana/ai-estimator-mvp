    allow_manual_override: true
    notes: ""
  - key: geotextile_material_unit_price
    estimate_line_code: geotextile_material
    label_ru: "Геотекстиль"
    price_kind: material
    unit: "м2"
    required: true
    default_source: price_registry_with_fallback
    registry_code: "geotextile_dornit_300_m2"
