    row_key_field: context
    production_input: true
    item_label_columns: [context]
    correction_columns: [area_m2, parapet_length_m, wall_abutment_length_m, operability]
    columns:
      - {key: context, label_ru: "Зона/тип кровли как в PDF", unit: "", value_kind: string, required: true}
      - {key: area_m2, label_ru: "Площадь", unit: "м2", value_kind: number, required: true}
      - {key: parapet_length_m, label_ru: "Длина парапетов", unit: "мп", value_kind: number, required: false}
      - {key: wall_abutment_length_m, label_ru: "Длина примыканий к стенам/ВК/вентканалам", unit: "мп", value_kind: number, required: false}
      - {key: operability, label_ru: "Тип эксплуатации", unit: "", value_kind: enum, allowed_values: ["exploitable", "non_exploitable"], required: false}
    parser_mapping:
      group_codes: ["roof_zones"]
      expected_context: ["кровля", "зона", "тип", "эксплуатируемая", "неэксплуатируемая", "примыкание", "парапет"]
      notes: "Primary production geometry for flat roof. Use when the PDF gives roof by zones/types/floors instead of one or two simple roof levels. Context must come from the roof sheet itself, not from slab labels such as ПМ1/ПМ2. Linear abutments to walls, VK, vent channels, and vent shafts belong in wall_abutment_length_m for the matching zone. If a zone column has separate wall and VK/vent-channel abutment rows, sum those components in wall_abutment_length_m and keep components in notes/raw evidence. Do not use roof_vent_wall_abutment_level_1/2 as parallel live values when roof_zones is present."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Проверьте зоны кровли: площади, длины парапетов/примыканий и тип эксплуатации. Если зон нет, adapter должен использовать fallback-геометрию."
    mirror_to_details_sheet: true
    mirror_notes: "Show as a readable detail table so Elena can compare the roof zones with the PDF without opening the drawing."
    validation:
      min_rows: 0
      sum_checks:
        - {source_ref: "project_spec_roof_area_m2", compare_to: "sum(area_m2)", tolerance: 0.5, severity: warning}
    notes: "Default production path when present. The calculator sums area_m2 into roof_area_total_m2 and sums parapet_length_m + wall_abutment_length_m into parapet_and_abutment_total_length_m. If operability is absent, adapter/calculator treat the zone as non_exploitable. Old level scalar fields are fallback only when this table is absent."

