    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "roof_area_level_1"
    calculator_input_path: "roof_area_level_1_m2"
    normalized_json_path: "sections.flat_roof.parameters.roof_area_level_1_m2.value"
    value_kind: scalar
