      notes: "Compatibility fallback for old detailed_project_geometry mode. Prefer roof_zones[] when the PDF gives roof zones/types."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional"
      action_ru: "Fallback only: заполняйте площадь уровня 1 вручную только если roof_zones[] не используется."
