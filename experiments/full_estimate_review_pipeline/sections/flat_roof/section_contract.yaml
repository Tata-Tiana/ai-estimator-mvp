checks:
  required_source_classes: [AUTO_PROJECT, DEFAULT, AUTO_CALCULATED, PRICE, SUPPLIER_INPUT, MANUAL_REVIEW]
  required_review_parameters:
    - roof_area_level_1_m2
    - roof_area_level_2_m2
    - parapet_length_level_1_m
    - parapet_length_level_2_m
    - vent_wall_abutment_level_1_m
    - vent_wall_abutment_level_2_m
    - roof_aerators_count
    - parapet_roof_drains_count
    - internal_roof_drains_count
    - internal_drain_height_per_drain_m
    - slope_plate_a_supplier_required_volume_m3
    - slope_plate_b_supplier_required_volume_m3
    - slope_plate_j_supplier_required_volume_m3
    - slope_plate_k_supplier_required_volume_m3
  forbidden_production_inputs:
    - old_fixture_values
    - old_expected_result_values
    - display_quantity_overrides
    - excel_match_total_overrides
  expected_estimate_line_count: 29
  optional_estimate_line_count: 2
  contamination_check:
    old_project_markers_allowed: false
    fixture_values_allowed: false
    old_expected_result_values_allowed: false
  notes: "estimate_lines fully built out 2026-07-10 from calculate_flat_roof()'s real line-by-line output (originally 31 lines total — matches docs/report_flat_roof_calculator.md's own count), after removing the calculator's hardcoded Excel-match overrides (explicit user authorization, see docs/report_flat_roof_calculator.md and experiments/flat_roof_calculator/calculator.py history for that fix). Also closed previously-undeclared required calculator input fields (pack-volume defaults, shared slope-plate price key fanned out to 4 fixed calculator fields, work/material price_keys) — without them the adapter could not have constructed a valid calculator input at all. 2026-08-03: SLOPE required volumes moved from manual/supplier review to AUTO_PROJECT because they are project specification values; vent_shaft_abutment_count and gas_block_wall_holes_count stay hidden optional legacy/special-case fields, so normal production output has 29 lines and can add up to 2 optional special-case lines only when positive counts are explicitly supplied. forbidden_production_inputs now also lists excel_match_total_overrides, since that was this section's specific contamination pattern."
