auto_calculated:
  - {key: roof_area_total_m2, label_ru: "Площадь кровли, суммарная", source_class: AUTO_CALCULATED, formula: "sum(roof_zones.area_m2)", leaf_inputs: [{ref: review_parameters.roof_zones, source_class: AUTO_PROJECT}], calculator_input_path: "", notes: "Production roof_zones mode; the calculator/adapter sums every project roof zone. Old formula roof_area_level_1_m2 + roof_area_level_2_m2 is fallback only when roof_zones[] is absent."}
  - {key: parapet_and_abutment_total_length_m, label_ru: "Длина парапетов и примыканий, суммарная", source_class: AUTO_CALCULATED, formula: "sum(roof_zones.parapet_length_m + roof_zones.wall_abutment_length_m)", leaf_inputs: [{ref: review_parameters.roof_zones, source_class: AUTO_PROJECT}], calculator_input_path: "", notes: "Production roof_zones mode; linear примыкания к стенам/ВК/вентканалам are included in roof_zones[].wall_abutment_length_m. Old level scalar fields are fallback only."}
  - {key: rail_ordered_length_m, label_ru: "Заказная длина реек", source_class: AUTO_CALCULATED, formula: "ceil(parapet_and_abutment_total_length_m / rail_piece_length_m) * rail_piece_length_m", leaf_inputs: [{ref: auto_calculated.parapet_and_abutment_total_length_m, source_class: AUTO_CALCULATED}, {ref: defaults.rail_piece_length_m, source_class: DEFAULT}], calculator_input_path: "", notes: "Same ordered length feeds both aluminum_pressure_rail_3m and aluminum_edge_rail_3m."}
  - {key: pvc_membrane_required_area_m2, label_ru: "Требуемая площадь ПВХ мембраны", source_class: AUTO_CALCULATED, formula: "roof_area_total_m2 * pvc_membrane_flat_coeff + parapet_and_abutment_total_length_m * pvc_membrane_parapet_coeff", leaf_inputs: [{ref: auto_calculated.roof_area_total_m2, source_class: AUTO_CALCULATED}, {ref: defaults.pvc_membrane_flat_coeff, source_class: DEFAULT}, {ref: auto_calculated.parapet_and_abutment_total_length_m, source_class: AUTO_CALCULATED}, {ref: defaults.pvc_membrane_parapet_coeff, source_class: DEFAULT}], calculator_input_path: "", notes: ""}
  - {key: pvc_membrane_rolls, label_ru: "Количество рулонов ПВХ мембраны", source_class: AUTO_CALCULATED, formula: "ceil(pvc_membrane_required_area_m2 / (pvc_membrane_roll_width_m * pvc_membrane_roll_length_m))", leaf_inputs: [{ref: auto_calculated.pvc_membrane_required_area_m2, source_class: AUTO_CALCULATED}, {ref: defaults.pvc_membrane_roll_width_m, source_class: DEFAULT}, {ref: defaults.pvc_membrane_roll_length_m, source_class: DEFAULT}], calculator_input_path: "", notes: ""}
  - {key: internal_drain_total_length_m, label_ru: "Суммарная длина внутреннего водостока", source_class: AUTO_CALCULATED, formula: "internal_roof_drains_count * internal_drain_height_per_drain_m", leaf_inputs: [{ref: review_parameters.internal_roof_drains_count, source_class: AUTO_PROJECT}, {ref: review_parameters.internal_drain_height_per_drain_m, source_class: AUTO_PROJECT}], calculator_input_path: "", notes: ""}

calculator_input_mapping:
  - input_path: "*"
    from:
      ref: "review_parameters + supplier_inputs + defaults + price_keys"
      source_class: MIXED
    required: true
    transform: build_flat_roof_input
    fallback: null
    notes: "Adapter must fill calculator input without old fixture values or Excel-match overrides. Prefer roof_geometry_calc_method=roof_zones when roof_zones[] has reviewed rows; otherwise explicitly switch to fallback geometry only if fallback scalar fields are present. slope_plate_a/b/j/k_unit_price_per_m3 all resolve from the single slope_plate_unit_price_per_m3 price_key (see that key's notes)."

