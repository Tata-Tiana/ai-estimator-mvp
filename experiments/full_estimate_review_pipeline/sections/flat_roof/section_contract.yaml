      target_codes: ["roof_area_level_1", "project_spec_roof_area"]
      aliases_ru: ["площадь кровли уровень 1", "площадь кровли нижнего уровня", "площадь кровли на отм."]
      expected_unit: "м2"
      notes: "Level numbering is project-dependent; keep candidates when ambiguous."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь кровли первого уровня."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with PVC membrane/geotextile material areas."

