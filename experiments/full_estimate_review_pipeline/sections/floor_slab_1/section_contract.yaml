      expected_unit: "мп"
      notes: "Linear perimeter only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте периметр/длину торца плиты перекрытия 1-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not map m2 formwork area here."

