      aliases_ru: ["опалубка балок", "площадь опалубки балок", "опалубка ж/б балок"]
      expected_unit: "м2"
      notes: "This floor slab may or may not have beams, independently of floor_slab_2. If absent, leave null (not 0) so the calculator falls back to the sum of beam_items.formwork_area_m2; production prefers a spec area when the PDF gives one directly."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
