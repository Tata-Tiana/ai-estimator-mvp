    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with EPS 100 mm bottom work area or edge formwork."

  - key: edge_formwork_area_m2
    label_ru: "Площадь опалубки торца плиты перекрытия 1-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_formwork_area"
    calculator_input_path: "edge_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.edge_formwork_area_m2.value"
