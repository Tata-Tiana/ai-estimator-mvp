    calculator_input_path: "insulation.slab_edge_eps_material_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.slab_edge_eps_material_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_edge_eps_material_area"]
      aliases_ru: ["ЭППС торец плиты площадь", "утепление вертикальных поверхностей плиты", "площадь материала ЭППС торца"]
