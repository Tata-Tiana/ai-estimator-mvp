  - key: bottom_slab_eps_work_area_m2
    label_ru: "ЭППС 100 мм низ плиты, площадь работ"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
