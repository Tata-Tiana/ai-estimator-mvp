    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-26 (real project case). Purely additive — when absent, calculator behavior is byte-identical to before (defaults to 0). Feeds both plywood/timber material AND the edge_beam_formwork_installation_control work quantity (corrected 2026-07-26 to include this — see that estimate_line's own notes)."

  - key: beams_concrete_volume_m3
    label_ru: "Объем бетона балок перекрытия 1-го этажа"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_beams_concrete_volume"
