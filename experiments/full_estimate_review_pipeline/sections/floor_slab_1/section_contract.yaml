    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_insulation_height"
    calculator_input_path: "insulation.edge_insulation_height_m"
    normalized_json_path: "sections.floor_slab_1.parameters.edge_insulation_height_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_edge_insulation_height"]
