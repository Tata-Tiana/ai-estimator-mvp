    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_formwork_area"
    calculator_input_path: "edge_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.edge_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_edge_formwork_area"]
      aliases_ru: ["опалубка торца плиты", "вертикальная опалубка плиты перекрытия", "опалубка вертикальных поверхностей"]
      expected_unit: "м2"
      notes: "Edge formwork area only."
    review_behavior:
