    prices: {material_unit_price_key: concrete_pump_rate, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Manual/supplier quantity; do not compute from concrete volume."

  - code: formwork_dismantling_zero_internal
    name_ru: "Демонтаж опалубки после завершения бетонирования"
    unit: "м2"
    enabled_by_default: true
    line_role: client_only_zero_internal_line
    calculator_result_path: "estimate_lines[code=formwork_dismantling_zero_internal]"
    quantity:
      formula: "main_formwork_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Calculator currently has an old display quantity for this zero/internal line; do not use it as a production paid quantity."

  - code: edge_beam_insulation_work
    name_ru: "Устройство утепления по наружной стороне торцов плиты, балок"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=edge_beam_insulation_work]"
    quantity:
      formula: "slab_outer_edge_eps_work_length_m + sum(beam.length_m * beam.count)"
      leaf_inputs:
        - {ref: "review_parameters.slab_outer_edge_eps_work_length_m", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: edge_beam_insulation_work_rate_per_m, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Beam edge insulation length is calculated from beam rows."

  - code: bottom_slab_insulation_work
    name_ru: "Устройство утепления низа плиты"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=bottom_slab_insulation_work]"
    quantity:
      formula: "bottom_slab_eps_work_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.bottom_slab_eps_work_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: bottom_slab_insulation_work_rate_per_m2, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "m2 work area, not EPS volume."

  - code: eps_penoplex_osnova_100mm
    name_ru: "Экструдированный пенополистирол Пеноплэкс Основа 100 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps_penoplex_osnova_100mm]"
    quantity:
      formula: "ceil(total_eps_volume_from_spec_m3 * eps_waste_coeff / eps_pack_volume_m3) * eps_pack_volume_m3"
      leaf_inputs:
        - {ref: "review_parameters.total_eps_volume_from_spec_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.eps_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.eps_pack_volume_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: eps_unit_price_per_m3, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "EPS material volume in m3, not m2 formwork."

  - code: eps_glue_foam
    name_ru: "Клей-пена для ЭППС"
    unit: "баллон"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps_glue_foam]"
