    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_beams_formwork_area"
    calculator_input_path: "beams_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.beams_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
