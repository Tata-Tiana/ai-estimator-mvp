contract_version: 0.1

section:
  code: floor_slab_1
  name_ru: "Перекрытие 1 этажа"
  calculator_module: "experiments/floor_slab_1_calculator/floor_slab_1_calculator.py"
  status: draft
  owner_notes: "Production contract: spec quantities for concrete, formwork, insulation, beams, and rebar; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/floor_slab_1_calculator/floor_slab_1_calculator.py"
  calculator_readme: "experiments/floor_slab_1_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_floor_slab_1_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: total_concrete_volume_from_spec_m3
    label_ru: "Бетон плиты перекрытия 1-го этажа, общий объем по спецификации"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_concrete_volume"
    calculator_input_path: "geometry.total_concrete_volume_from_spec_m3"
    normalized_json_path: "sections.floor_slab_1.parameters.total_concrete_volume_from_spec_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_concrete_volume"]
      aliases_ru: ["бетон плиты перекрытия 1 этажа", "бетон ж/б плиты перекрытия", "бетон перекрытия"]
      expected_unit: "м3"
      notes: "Total concrete from slab specification before beam subtraction inside calculator."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте общий объем бетона плиты перекрытия 1-го этажа по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with lintel, foundation, roof, or 2nd floor slab concrete."

  - key: kind
    label_ru: "Тип плиты — жилое перекрытие или кровельная плита"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_kind"
    calculator_input_path: ""
    normalized_json_path: "sections.floor_slab_1.parameters.kind.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_kind"]
      aliases_ru: ["Плоская Ж/б, неэксплуатируемая", "Плоская Ж/б, эксплуатируемая"]
      expected_unit: ""
      notes: "roof_cover_slab when general data describes this slab as part of the roof build-up (e.g. 'Плоская Ж/б, неэксплуатируемая, согласно КР-2'); otherwise residential_floor."
    review_behavior:
      show_to_user: false
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Чисто описательное поле, не влияет на расчёт. Укажите, если общие данные явно называют эту плиту частью кровельного пирога (неэксплуатируемая плоская Ж/б и т.п.), а не жилым перекрытием."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case). Purely descriptive — calculator_input_path intentionally empty, never gates pricing/calculation. This slab still occupies the floor_slab_1 pipeline slot and is calculated there as usual regardless of this value. Do not confuse this slab's own PDF label (e.g. ПМ1) with roof zone identifiers used in flat_roof's roof_zones — those must come from the roof's own specification sheet, a separate labeling system even when it covers the same physical area."

  - key: slab_zones
    label_ru: "Объём бетона и опалубка по зонам плиты перекрытия 1-го этажа (альтернатива единым полям)"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "slab_zones"
    calculator_input_path: "slab_zones"
    normalized_json_path: "sections.floor_slab_1.parameters.slab_zones.rows"
    value_kind: repeated_rows
    row_key_field: context
    production_input: true
    item_label_columns: [context]
    correction_columns: [concrete_volume_m3, edge_perimeter_m, under_slab_formwork_area_m2, edge_and_beam_formwork_area_m2]
    columns:
      - {key: context, label_ru: "Зона плиты (по PDF)", unit: "", value_kind: string}
      - {key: concrete_volume_m3, label_ru: "Бетон", unit: "м3", value_kind: number}
      - {key: edge_perimeter_m, label_ru: "Периметр торца зоны", unit: "мп", value_kind: number}
      - {key: under_slab_formwork_area_m2, label_ru: "Опалубка под плитой зоны", unit: "м2", value_kind: number}
      - {key: edge_and_beam_formwork_area_m2, label_ru: "Опалубка торца зоны (+ балок, если PDF даёт вместе)", unit: "м2", value_kind: number}
    parser_mapping:
      target_codes: ["slab_zones"]
      aliases_ru: []
      expected_unit: ""
      notes: "NOT YET part of the live extraction prompt — added 2026-07-20 only as a calculator-side + contract-side alternative input. Use when the PDF splits the slab's concrete into multiple zones with no combined total (real ТРЦ case: main slab 25.337 + kitchen/dining slab 5.975 m3, no printed sum). Same shape as foundation_slab's slab_zones. Formwork columns added 2026-08-05 (UNIVERSALIZATION_PLAN.md P1 follow-up) — see their own notes below."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Необязательная альтернатива фиксированным полям объёма/опалубки выше. Используйте, если PDF даёт бетон и/или опалубку плиты несколькими зонами без общего итога — иначе оставьте пустым."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false}
    formwork_notes: "Added 2026-08-05 (real ТРЦ case, Elena's idea): edge_perimeter_m/under_slab_formwork_area_m2/edge_and_beam_formwork_area_m2 are OPTIONAL per zone, but if any zone provides any of the three, ALL zones must provide ALL three (calculator raises otherwise — no silently-dropped zone). edge_and_beam_formwork_area_m2 is per-zone whatever the PDF actually gives for THAT zone's vertical formwork — pure slab edge only (no beams in that zone) for one zone, edge+beam merged-and-unsplittable for another zone, doesn't matter which per zone. Safe to just sum across zones because every downstream estimate line (installation, plywood, timber) already only ever reads the final combined total, never an edge/beam split — see calculate_formwork_areas_context's own note. This is exactly the real ТРЦ case: main zone gives one merged 36.6 m2 (torец плиты и ж/б балок, can't split), second zone (kitchen/dining) gives its own pure edge-only 5.6 m2 with no beams at all — the old flat scalar fields could only represent ONE of these two situations project-wide (mutual exclusion), not both at once across zones. When zones provide edge_perimeter_m, it REPLACES the flat slab_edge_perimeter_m requirement too (used for the geometry control-check multiplication, not for money)."
    notes: "Added 2026-07-20 (UNIVERSALIZATION_PLAN.md P1, slab_zones[]). Purely additive — when empty/absent, calculator behavior is byte-identical to before (all 9 pre-existing floor_slab_1_calculator regression cases unaffected, verified). When non-empty, its sum OVERRIDES total_concrete_volume_from_spec_m3 above for this run (same convention as foundation_slab's slab_zones and load_bearing_walls_lintels' wall_block_items). Unlike foundation_slab, this calculator has no dataclass/validate() layer — the override and per-zone validation happen as plain checks inside calculate_floor_slab_1() itself. See p1_slab_zones_shipped memory. production_input corrected false -> true 2026-07-29, same class of bug as wall_block_items: floor_slab_1_calculator.py has read this group since the 2026-07-20 ship, the flag was just never updated to match, so it rendered as a dead single row on sheet 01 instead of a real per-item table. foundation_slab's own slab_zones already had production_input: true correctly."

  - key: slab_thickness_m
    label_ru: "Толщина плиты перекрытия 1-го этажа"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_slab_thickness"
    calculator_input_path: "geometry.slab_thickness_m"
    normalized_json_path: "sections.floor_slab_1.parameters.slab_thickness_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_slab_thickness"]
      aliases_ru: ["толщина плиты перекрытия 1 этажа", "плита перекрытия 180 мм", "h плиты перекрытия"]
      expected_unit: "м"
      notes: "Normalize mm to m."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте толщину плиты перекрытия 1-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Used as control/fallback; production formwork areas still come from spec."

  - key: edge_formwork_height_m
    label_ru: "Высота торцевой опалубки плиты перекрытия 1-го этажа"
    unit: "м"
    source_class: AUTO_CALCULATED
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_formwork_height"
    calculator_input_path: "geometry.edge_formwork_height_m"
    normalized_json_path: "sections.floor_slab_1.parameters.edge_formwork_height_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_slab_thickness"]
      aliases_ru: ["высота торцевой опалубки", "высота опалубки торца плиты", "толщина плиты перекрытия"]
      expected_unit: "м"
      notes: "Control geometry only. Adapter should normally use slab_thickness_m; do not ask GPT for a separate production target and do not hardcode a project value."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "auto_calculated"
      action_ru: "Проверьте высоту торцевой опалубки; если отдельной строки нет, она принимается равной толщине плиты для контрольного расчета."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Calculator currently requires geometry.edge_formwork_height_m for a control formula even in spec_formwork_areas mode. Production source for paid formwork remains the spec areas."


  - key: slab_edge_perimeter_m
    label_ru: "Периметр торца плиты перекрытия 1-го этажа"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_slab_edge_perimeter"
    calculator_input_path: "geometry.slab_edge_perimeter_m"
    normalized_json_path: "sections.floor_slab_1.parameters.slab_edge_perimeter_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_slab_edge_perimeter"]
      aliases_ru: ["периметр торца плиты 1 этажа", "длина торца плиты перекрытия", "периметр вертикальных поверхностей"]
      expected_unit: "мп"
      notes: "Linear perimeter only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте периметр/длину торца плиты перекрытия 1-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not map m2 formwork area here."

  - key: main_formwork_area_m2
    label_ru: "Площадь опалубки под плитой перекрытия 1-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_under_slab_formwork_area"
    calculator_input_path: "main_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.main_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_under_slab_formwork_area"]
      aliases_ru: ["опалубка под плитой", "площадь опалубки под плитой", "горизонтальная опалубка перекрытия"]
      expected_unit: "м2"
      notes: "Main deck/under-slab formwork area."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь основной опалубки под плитой."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with EPS 100 mm bottom work area or edge formwork."

  - key: edge_formwork_area_m2
    label_ru: "Площадь опалубки торца плиты перекрытия 1-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_formwork_area"
    calculator_input_path: "edge_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.edge_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_edge_formwork_area"]
      aliases_ru: ["опалубка торца плиты", "вертикальная опалубка плиты перекрытия", "опалубка вертикальных поверхностей"]
      expected_unit: "м2"
      notes: "Edge formwork area only."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте площадь опалубки торца плиты."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with EPS 100 mm edge volume in m3. Required unless edge_and_beam_formwork_area_combined_m2 below is used instead (source gives one merged number for edge+beams)."

  - key: edge_and_beam_formwork_area_combined_m2
    label_ru: "Опалубка торца плиты + балок перекрытия 1-го этажа (объединено, разделить нельзя)"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_and_beam_formwork_area_combined"
    calculator_input_path: "edge_and_beam_formwork_area_combined_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.edge_and_beam_formwork_area_combined_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_edge_and_beam_formwork_area_combined"]
      aliases_ru: ["опалубка торца плиты и балок", "вертикальные поверхности плиты и ж/б балок"]
      expected_unit: "м2"
      notes: "Use only when the PDF genuinely gives edge and beam vertical formwork as ONE merged number with no way to split it (confirmed real ТРЦ case, 2026-07-21). Do not use as a shortcut when edge_formwork_area_m2/beams_formwork_area_m2 are actually separable — those remain the default path. Mutually exclusive with edge_formwork_area_m2/beams_formwork_area_m2; calculator raises if both are supplied."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Заполняйте только если PDF даёт торец плиты и балки одной общей строкой, которую нельзя разделить; если есть раздельные поля или slab_zones, это поле не требуется."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Additive alternative shipped 2026-07-21 (calculator.py change, authorized). Special-case fallback only: use when one whole-project merged edge+beam vertical formwork number is present and cannot be split. If split edge_formwork_area_m2/beams_formwork_area_m2 or slab_zones are available, this field should stay empty and must not render as a blocking missing value."

  - key: beams_formwork_area_m2
    label_ru: "Площадь опалубки балок перекрытия 1-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_beams_formwork_area"
    calculator_input_path: "beams_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.beams_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_beams_formwork_area", "beam_items"]
      aliases_ru: ["опалубка балок", "площадь опалубки балок", "опалубка ж/б балок"]
      expected_unit: "м2"
      notes: "This floor slab may or may not have beams, independently of floor_slab_2. If absent, leave null (not 0) so the calculator falls back to the sum of beam_items.formwork_area_m2; production prefers a spec area when the PDF gives one directly."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если у этой плиты есть балки, проверьте площадь опалубки балок; иначе оставьте пустым — она посчитается из позиций балок ниже."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: ""

  - key: beams_bottom_formwork_area_m2
    label_ru: "Горизонтальная площадь опалубки под балкой перекрытия 1-го этажа"
    unit: "м2"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_beams_bottom_formwork_area"
    calculator_input_path: "beams_bottom_formwork_area_m2"
    normalized_json_path: "sections.floor_slab_1.parameters.beams_bottom_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_beams_bottom_formwork_area"]
      aliases_ru: ["горизонтальная площадь опалубки под балкой", "нижняя опалубка балок"]
      expected_unit: "м2"
      notes: "Distinct from main_formwork_area_m2 (horizontal under the SLAB) and from edge_and_beam_formwork_area_combined_m2 (vertical slab+beam). This is specifically the beam's own horizontal/bottom formwork, when the PDF gives it as its own separate line."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если у балок этой плиты есть отдельная строка нижней (горизонтальной) опалубки, укажите её здесь; иначе оставьте пустым (0)."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Added 2026-07-26 (real project case). Purely additive — when absent, calculator behavior is byte-identical to before (defaults to 0). Feeds both plywood/timber material AND the edge_beam_formwork_installation_control work quantity (corrected 2026-07-26 to include this — see that estimate_line's own notes)."

  - key: beams_concrete_volume_m3
    label_ru: "Объем бетона балок перекрытия 1-го этажа"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_beams_concrete_volume"
    calculator_input_path: "beams_concrete_volume_m3"
    normalized_json_path: "sections.floor_slab_1.parameters.beams_concrete_volume_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_beams_concrete_volume", "beam_items"]
      aliases_ru: ["бетон балок", "объем бетона балок", "бетон в теле плиты (балки)", "бетон в теле плиты перекрытия"]
      expected_unit: "м3"
      notes: "Usually a ready 'Итого' line in the beam specification table (see beam_items below), separate from the slab's own concrete volume. If absent, leave null (not 0) so the calculator falls back to the sum of beam_items.concrete_volume_m3. Added 2026-07-12 after confirming both ЮСВ КР2 (лист 22) and ТРЦ КР2 (лист 31) give this as a ready total."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "optional_default_zero"
      action_ru: "Если у этой плиты есть балки и в спецификации есть готовый итог по бетону балок, сверьте его; иначе оставьте пустым — он посчитается из позиций балок ниже."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Calculator-code override added 2026-07-12 (exception to the normal never-touch-calculator-code rule, explicit user authorization) — mirrors the existing beams_formwork_area_m2 override pattern. beam_items rows remain required for formwork/concrete fallback and beam work length; insulation has its own optional overrides below because beams are not always insulated along their full length."

  - key: slab_outer_edge_eps_work_length_m
    label_ru: "Утепление торца плиты ЭППС 100 мм — длина работ"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_eps_work_length"
    calculator_input_path: "insulation.slab_outer_edge_eps_work_length_m"
    normalized_json_path: "sections.floor_slab_1.parameters.slab_outer_edge_eps_work_length_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_edge_eps_work_length", "floor_slab_1_slab_edge_perimeter"]
      aliases_ru: ["ЭППС торец плиты длина", "утепление торца плиты длина", "длина утепления торца"]
      expected_unit: "мп"
      notes: "Work length for the slab outer edge only. Beam insulation must use beams_eps_work_length_m below when it is present, because beams may be insulated only partially."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте длину работ по утеплению наружного торца плиты. Если в PDF есть периметр утепления торца плиты, используется он; балки сюда не входят."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not include beam length here unless the PDF explicitly gives one combined slab+beam insulation length and no split is possible; production prefers a separate beams_eps_work_length_m."

  - key: beams_eps_work_length_m
    label_ru: "Утепление торца балок 1-го этажа ЭППС 100 мм — длина утепляемой части"
    unit: "мп"
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
