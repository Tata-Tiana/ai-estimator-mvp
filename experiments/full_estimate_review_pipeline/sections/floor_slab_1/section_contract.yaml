supplier_inputs:
  - key: formwork_rebar_crane_shifts
    label_ru: "Подача опалубки и арматуры краном"
    unit: "смена"
    source_class: SUPPLIER_INPUT
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "manual_lines.formwork_rebar_crane_shifts"
    normalized_json_path: "sections.floor_slab_1.supplier_inputs.formwork_rebar_crane_shifts.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Укажите смены подачи опалубки и арматуры краном."
    notes: "source_class AUTO_CALCULATED -> SUPPLIER_INPUT 2026-07-30 (reverted): no real crane-shift-count formula exists anywhere in the codebase. The 2026-07-30 automation wrongly reused the box_calculator's delivery-truck allocation for crane shifts; real ARK smeta data disproved the underlying assumption (crane count 2 != delivery count 1 for this same section). Elena's final ruling: crane stays purely manual, no invented formula - box_calculator is repurposed for rebar/metal delivery trucks instead (see foundation_slab.rebar_metal_delivery_trucks)."

  - key: rebar_metal_delivery_trucks
    label_ru: "Доставка арматуры и металла, машины"
    unit: "маш"
    source_class: AUTO_CALCULATED
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "manual_lines.rebar_metal_delivery_trucks"
    normalized_json_path: "sections.floor_slab_1.supplier_inputs.rebar_metal_delivery_trucks.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Автоматически по общему весу арматуры коробки (box-калькулятор, накопление 10 т) — проверьте и поправьте при необходимости."
    notes: "Added 2026-07-30. Activates the calculator's existing 'section_output_only' box-level-delivery path (metal_delivery_calc_method default in production) - this estimate line existed in the calculator only for the old 'legacy_slab1_slab2_context' mode before; production mode never produced any delivery line for this section at all until this field. Value comes from compute_rebar_metal_delivery_allocation() in populate_review_workbook_from_extraction.py (box_calculator's 10-tonne threshold allocation across all 4 rebar-bearing sections) - naturally 0 for projects where this section doesn't cross a threshold. Still allow_manual_override: true."

  - key: concrete_pump_shifts
    label_ru: "Работа бетононасоса"
    unit: "смена"
    source_class: SUPPLIER_INPUT
    required: true
    review_sheet: "01_Проверка проекта"
    calculator_input_path: "manual_lines.concrete_pump_shifts"
    normalized_json_path: "sections.floor_slab_1.supplier_inputs.concrete_pump_shifts.value"
    value_kind: scalar
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Укажите смены бетононасоса."
    notes: "Fixed/manual line; do not compute from concrete volume."

calculator_input_mapping:
  - input_path: "*"
    from:
      ref: "review_parameters + supplier_inputs + defaults + price_keys"
      source_class: MIXED
    required: true
    transform: build_floor_slab_1_input
    fallback: null
    notes: "Adapter must fill nested geometry, beams, rates, rebar_items, insulation, overheads, and manual_lines without old fixture values."

estimate_lines:
  - code: slab_formwork_installation_control
    name_ru: "Монтаж опалубки под монолитное перекрытие 1-го этажа"
    unit: "м2"
    enabled_by_default: true
    line_role: zero_control_line
    calculator_result_path: "estimate_lines[code=slab_formwork_installation_control]"
    quantity:
      formula: "main_formwork_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero control/client line from calculator."

  - code: formwork_set_rental_material
    name_ru: "Комплект опалубки перекрытия"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_set_rental_material]"
    quantity:
      formula: "main_formwork_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: formwork_rate_per_m2, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: formwork_delivery_return_manipulator
    name_ru: "Доставка, вывоз опалубки манипулятором"
    unit: "маш"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_delivery_return_manipulator]"
    quantity:
      formula: "2 машины if main_formwork_area_m2 <= 180 else 4 машины"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "defaults.formwork_delivery_calc_method", source_class: DEFAULT}
    prices: {material_unit_price_key: formwork_delivery_rate_per_trip, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Production mode area_threshold. Manual override is only if calculator mode is changed deliberately."

  - code: formwork_rebar_crane_supply
    name_ru: "Подача опалубки, арматуры автокраном"
    unit: "смена"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_rebar_crane_supply]"
    quantity:
      formula: "formwork_rebar_crane_shifts"
      leaf_inputs:
        - {ref: "supplier_inputs.formwork_rebar_crane_shifts", source_class: SUPPLIER_INPUT}
    prices: {material_unit_price_key: crane_shift_rate, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Manual/supplier quantity."

  - code: formwork_consumables
    name_ru: "Расходные материалы для установки опалубки"
    unit: "-"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_consumables]"
    quantity:
      formula: "1 fixed line; amount = main_formwork_area_m2 * formwork_consumables_rate_per_m2"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: formwork_consumables_rate_per_m2, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Calculator displays quantity 1 but total is area-based."

  - code: edge_beam_formwork_installation_control
    name_ru: "Монтаж опалубки из доски 50 мм и фанеры для балок и отбортовки плиты"
    unit: "м2"
    enabled_by_default: true
    line_role: zero_control_line
    calculator_result_path: "estimate_lines[code=edge_beam_formwork_installation_control]"
    quantity:
      formula: "edge_formwork_area_m2 + beams_formwork_area_m2 + beams_bottom_formwork_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.edge_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beams_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beams_bottom_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero control/client line from calculator. Corrected 2026-07-26 (real project case, checked against the real costed smeta): this quantity must include beams_bottom_formwork_area_m2, same as the plywood/timber material calculation — confirmed identical across all three real projects reviewed this session (same work-line name, same combined vertical+beam-bottom quantity, distinct from the separate slab-bottom formwork line)."

  - code: plywood_fk_18mm_for_edges_and_non_multiple_places
    name_ru: "Фанера ФК 1,52 x 1,52 толщиной 18 мм для некратных мест и торцов"
    unit: "шт"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=plywood_fk_18mm_for_edges_and_non_multiple_places]"
    quantity:
      formula: "ceil((edge_formwork_area_m2 + beams_formwork_area_m2) / plywood_sheet_working_area_m2 + (main_formwork_area_m2 * non_multiple_places_coeff) / plywood_sheet_working_area_m2 + reserve_plywood_sheets)"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.edge_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beams_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "defaults.plywood_sheet_working_area_m2", source_class: DEFAULT}
        - {ref: "defaults.non_multiple_places_coeff", source_class: DEFAULT}
        - {ref: "defaults.reserve_plywood_sheets", source_class: DEFAULT}
    prices: {material_unit_price_key: plywood_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: formwork_timber_gost
    name_ru: "Пиломатериал обрезной для устройства опалубки ГОСТ"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_timber_gost]"
    quantity:
      formula: "(edge_formwork_area_m2 + beams_formwork_area_m2) * timber_thickness_m + (((main_formwork_area_m2 * non_multiple_places_coeff) / plywood_sheet_working_area_m2) + legacy_overhang_sheet_equivalent_0) * additional_timber_coeff * additional_timber_thickness_m"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.edge_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beams_formwork_area_m2", source_class: AUTO_PROJECT}
        - {ref: "defaults.timber_thickness_m", source_class: DEFAULT}
        - {ref: "defaults.non_multiple_places_coeff", source_class: DEFAULT}
        - {ref: "defaults.plywood_sheet_working_area_m2", source_class: DEFAULT}
        - {ref: "defaults.overhang_sheet_equivalent", source_class: DEFAULT}
        - {ref: "defaults.additional_timber_coeff", source_class: DEFAULT}
        - {ref: "defaults.additional_timber_thickness_m", source_class: DEFAULT}
    prices: {material_unit_price_key: timber_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "overhang_sheet_equivalent is a hidden legacy compatibility default of 0. Ordinary plywood/timber stays calculated from project formwork areas; no project-specific fallback is used."

  - code: floor_slab_rebar_frame_assembly_control
    name_ru: "Изготовление и монтаж каркаса армирования перекрытия из арматуры"
    unit: "мп"
    enabled_by_default: true
    line_role: zero_control_line
    calculator_result_path: "estimate_lines[code=floor_slab_rebar_frame_assembly_control]"
    quantity:
      formula: "sum(rebar_item.order_length_m)"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_1_rebar_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Order length is calculated per rebar item from spec_length_m, rod length, waste and rounding."

  - code: rebar_items_dynamic
    name_ru: "Арматура плиты перекрытия по диаметрам"
    unit: "мп"
    enabled_by_default: true
    line_role: dynamic_material_rows
    calculator_result_path: "estimate_lines[code=rebar_*]"
    quantity:
      formula: "per-row order_length_m from floor_slab_1_rebar_items"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_1_rebar_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: rebar_unit_price_by_item, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "One calculator line per rebar row/diameter; code is generated from steel class and diameter."

  - code: rebar_metal_delivery
    name_ru: "Доставка арматуры, металла"
    unit: "маш"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=rebar_metal_delivery]"
    quantity:
      formula: "rebar_metal_delivery_trucks (box-level, section_output_only production mode); legacy_slab1_slab2_context is the pre-box-calculator fallback"
      leaf_inputs:
        - {ref: "supplier_inputs.rebar_metal_delivery_trucks", source_class: AUTO_CALCULATED}
    prices: {material_unit_price_key: rebar_metal_delivery_unit_price, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "enabled_by_default flipped false -> true 2026-07-30: this line was legacy_only/dead in production (metal_delivery_calc_method=section_output_only never populated it) until rebar_metal_delivery_trucks above was wired to the box_calculator - same production activation as foundation_slab's own rebar_metal_delivery. Quantity naturally 0 for projects where this section's rebar weight doesn't cross a box-level 10-tonne threshold."

  - code: floor_slab_concreting_work
    name_ru: "Бетонирование монолитной плиты перекрытия бетоном В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=floor_slab_concreting_work]"
    quantity:
      formula: "total_concrete_volume_from_spec_m3 - sum(beam.length_m * beam.width_m * beam.height_m * beam.count)"
      leaf_inputs:
        - {ref: "review_parameters.total_concrete_volume_from_spec_m3", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: slab_concreting_work_rate_per_m3, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Slab concrete only, separate from beam concrete. total_concrete_volume_from_spec_m3 must be the section total before beam subtraction."

  - code: beam_concreting_work
    name_ru: "Бетонирование балок высотой до 250мм бетоном В22,5 (М300)"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=beam_concreting_work]"
    quantity:
      formula: "sum(beam.length_m * beam.count where beam.height_m <= 0.25)"
      leaf_inputs:
        - {ref: "review_parameters.beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: beam_concreting_work_rate_per_m, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "2026-08-09: split by beam height (was one flat rate for all beams regardless of height, reverted - see beam_concreting_work_tall below). Beams with height_m<=0.25 only, priced by length. Beam concrete material remains in m3 on the concrete material line regardless of height."

  - code: beam_concreting_work_tall
    name_ru: "Бетонирование балок высотой более 250мм бетоном В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=beam_concreting_work_tall]"
    quantity:
      formula: "sum(beam.concrete_volume_m3 where beam.height_m > 0.25)"
      leaf_inputs:
        - {ref: "review_parameters.beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: beam_concreting_work_rate_per_m3, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "2026-08-09: new line - beams with height_m>0.25, priced by concrete volume (taller beams need proportionally more concrete/formwork per meter than a flat length-rate reflects). Real TRC/ARK smetas both price these beams this way, with a real corresponding rate (25000 rub/m3) sitting unused in Elena's own current pricelist row 29 until now."

  - code: concrete_b22_5_m300_material
    name_ru: "Бетон марки В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=concrete_b22_5_m300_material]"
    quantity:
      formula: "ceil(total_concrete_volume_from_spec_m3 * concrete_waste_coeff)"
      leaf_inputs:
        - {ref: "review_parameters.total_concrete_volume_from_spec_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.concrete_waste_coeff", source_class: DEFAULT}
    prices: {material_unit_price_key: concrete_unit_price_per_m3, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Material concrete order uses total concrete before beam subtraction."

  - code: concrete_delivery
    name_ru: "Доставка бетона до объекта"
    unit: "рейс"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=concrete_delivery]"
    quantity:
      formula: "ceil(total_concrete_volume_from_spec_m3 * concrete_waste_coeff / mixer_capacity_m3)"
      leaf_inputs:
        - {ref: "review_parameters.total_concrete_volume_from_spec_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.concrete_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.mixer_capacity_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: concrete_delivery_rate_per_trip, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: ""

  - code: concrete_pump_32m
    name_ru: "Работа бетононасоса 32м + гаситель"
    unit: "смена"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=concrete_pump_32m]"
    quantity:
      formula: "concrete_pump_shifts"
      leaf_inputs:
        - {ref: "supplier_inputs.concrete_pump_shifts", source_class: SUPPLIER_INPUT}
    prices: {material_unit_price_key: concrete_pump_rate, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Manual/supplier quantity; do not compute from concrete volume."

  - code: formwork_dismantling_zero_internal
    name_ru: "Демонтаж опалубки после завершения бетонирования"
    unit: "м2"
    enabled_by_default: true
    line_role: client_only_zero_internal_line
    calculator_result_path: "estimate_lines[code=formwork_dismantling_zero_internal]"
    quantity:
      formula: "main_formwork_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Calculator currently has an old display quantity for this zero/internal line; do not use it as a production paid quantity."

  - code: edge_beam_insulation_work
    name_ru: "Устройство утепления по наружной стороне торцов плиты, балок"
    unit: "мп"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=edge_beam_insulation_work]"
    quantity:
      formula: "slab_outer_edge_eps_work_length_m + beams_eps_work_length_m"
      leaf_inputs:
        - {ref: "review_parameters.slab_outer_edge_eps_work_length_m", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beams_eps_work_length_m", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: edge_beam_insulation_work_rate_per_m, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Do not infer beam insulation from all beam length. Elena confirmed beams may be uninsulated or insulated only partially; use only an explicit beams_eps_work_length_m from the project."

  - code: bottom_slab_insulation_work
    name_ru: "Устройство утепления низа плиты"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=bottom_slab_insulation_work]"
    quantity:
      formula: "bottom_slab_eps_work_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.bottom_slab_eps_work_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: bottom_slab_insulation_work_rate_per_m2, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "m2 work area, not EPS volume."

  - code: eps_penoplex_osnova_100mm
    name_ru: "Экструдированный пенополистирол Пеноплэкс Основа 100 мм"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps_penoplex_osnova_100mm]"
    quantity:
      formula: "ceil(total_eps_volume_from_spec_m3 * eps_waste_coeff / eps_pack_volume_m3) * eps_pack_volume_m3"
      leaf_inputs:
        - {ref: "review_parameters.total_eps_volume_from_spec_m3", source_class: AUTO_PROJECT}
        - {ref: "defaults.eps_waste_coeff", source_class: DEFAULT}
        - {ref: "defaults.eps_pack_volume_m3", source_class: DEFAULT}
    prices: {material_unit_price_key: eps_unit_price_per_m3, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "EPS material volume in m3, not m2 formwork."

  - code: eps_glue_foam
    name_ru: "Клей-пена для ЭППС"
    unit: "баллон"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=eps_glue_foam]"
    quantity:
      formula: "ceil((slab_edge_eps_material_area_m2 + beam_edge_eps_material_area_m2 + bottom_slab_eps_work_area_m2) / foam_coverage_m2_per_can)"
      leaf_inputs:
        - {ref: "review_parameters.slab_edge_eps_material_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.bottom_slab_eps_work_area_m2", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beam_items", source_class: AUTO_PROJECT}
        - {ref: "defaults.foam_coverage_m2_per_can", source_class: DEFAULT}
    prices: {material_unit_price_key: foam_unit_price_per_can, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Beam EPS material area is calculated from beam.length_m * beam.height_m * count."

  - code: logistics_and_supply
    name_ru: "Логистика, и снабжение"
    unit: "-"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=logistics_and_supply]"
    quantity:
      formula: "1; amount = base_subtotal_raw * logistics_and_supply_percent"
      leaf_inputs:
        - {ref: "defaults.logistics_and_supply_percent", source_class: DEFAULT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Percent overhead line."

  - code: consumables_tool_depreciation
    name_ru: "Расходные материалы, амортизация инструмента"
    unit: "комплект"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=consumables_tool_depreciation]"
    quantity:
      formula: "1; amount = base_subtotal_raw * consumables_and_tool_percent"
      leaf_inputs:
        - {ref: "defaults.consumables_and_tool_percent", source_class: DEFAULT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Percent overhead line."

  - code: technical_supervision
    name_ru: "Технический надзор"
    unit: "-"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=technical_supervision]"
    quantity:
      formula: "1 fixed line"
      leaf_inputs:
        - {ref: "price_keys.technical_supervision_amount", source_class: PRICE}
    prices: {material_unit_price_key: null, work_unit_price_key: technical_supervision_amount, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Current calculator reads the amount from manual_lines. Adapter must map the reviewed value there."

checks:
  required_source_classes: [AUTO_PROJECT, AUTO_CALCULATED, DEFAULT, PRICE, SUPPLIER_INPUT, MANUAL_REVIEW]
  required_review_parameters:
    - total_concrete_volume_from_spec_m3
    - slab_thickness_m
    - edge_formwork_height_m
    - slab_edge_perimeter_m
    - main_formwork_area_m2
    - edge_formwork_area_m2
    - slab_outer_edge_eps_work_length_m
    - edge_insulation_height_m
    - slab_edge_eps_material_area_m2
    - bottom_slab_eps_work_area_m2
    - total_eps_volume_from_spec_m3
    - floor_slab_1_rebar_items
  forbidden_production_inputs:
    - old_fixture_values
    - old_expected_result_values
    - display_quantity_overrides
    - legacy_usv_geometry_default
  expected_estimate_line_count: 24
  contamination_check:
    old_project_markers_allowed: false
    fixture_values_allowed: false
    old_expected_result_values_allowed: false
  notes: "checks block added 2026-07-11 — was missing entirely despite the contract otherwise being complete (beam-optionality, rebar rod_length_m/unit_price_per_m, price_key calculator_input_path gaps all fixed 2026-07-10). expected_estimate_line_count verified against the current 24 declared estimate_lines entries (rebar_items_dynamic represents a variable number of real per-row calculator lines; rebar_metal_delivery flipped from enabled_by_default: false/legacy-only to true/production 2026-07-30, now driven by the box_calculator via rebar_metal_delivery_trucks). forbidden_production_inputs lists legacy_usv_geometry_default — the calculator's insulation/formwork/rebar calc_method fields no longer silently default to legacy modes (fixed 2026-07-10/11), but the adapter must still always set them explicitly, since omitting them now raises instead of silently computing wrong numbers."
