    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Order length is calculated per rebar item from spec_length_m, rod length, waste and rounding."

  - code: rebar_items_dynamic
    name_ru: "Арматура плиты перекрытия по диаметрам"
    unit: "мп"
    enabled_by_default: true
    line_role: dynamic_material_rows
    calculator_result_path: "estimate_lines[code=rebar_*]"
    quantity:
      formula: "per-row order_length_m from floor_slab_1_rebar_items"
      leaf_inputs:
        - {ref: "review_parameters.floor_slab_1_rebar_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: rebar_unit_price_by_item, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "One calculator line per rebar row/diameter; code is generated from steel class and diameter."

  - code: rebar_metal_delivery
    name_ru: "Доставка арматуры, металла"
    unit: "маш"
    enabled_by_default: false
    line_role: legacy_only
    calculator_result_path: "estimate_lines[code=rebar_metal_delivery]"
    quantity:
      formula: "legacy_slab1_slab2_context only"
      leaf_inputs: []
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: false, excel_formula_exportable: false}
    notes: "Not production for this section. metal_delivery_calc_method=section_output_only keeps section weight for a box-level metal delivery calculator."

  - code: floor_slab_concreting_work
    name_ru: "Бетонирование монолитной плиты перекрытия бетоном В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=floor_slab_concreting_work]"
    quantity:
      formula: "total_concrete_volume_from_spec_m3 - sum(beam.length_m * beam.width_m * beam.height_m * beam.count)"
      leaf_inputs:
        - {ref: "review_parameters.total_concrete_volume_from_spec_m3", source_class: AUTO_PROJECT}
        - {ref: "review_parameters.beam_items", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: slab_concreting_work_rate_per_m3, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Slab concrete only, separate from beam concrete. total_concrete_volume_from_spec_m3 must be the section total before beam subtraction."

  - code: beam_concreting_work
    name_ru: "Бетонирование балок бетоном В22,5 (М300)"
    unit: "м3"
    enabled_by_default: true
