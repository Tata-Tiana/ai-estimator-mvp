contract_version: 0.1

section:
  code: floor_slab_1
  name_ru: "Перекрытие 1 этажа"
  calculator_module: "experiments/floor_slab_1_calculator/floor_slab_1_calculator.py"
  status: draft
  owner_notes: "Production contract: spec quantities for concrete, formwork, insulation, beams, and rebar; no old fixture values or Excel-match overrides."

source_files:
  calculator: "experiments/floor_slab_1_calculator/floor_slab_1_calculator.py"
  calculator_readme: "experiments/floor_slab_1_calculator/README.md"
  existing_cases: []
  related_docs:
    - "docs/report_floor_slab_1_calculator.md"
    - "docs/elena_parameter_review_pack_audit.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03_all_sections_quantity_matrix.md"
    - "experiments/full_estimate_review_pipeline/reports/step_03b_production_contamination_audit.md"
  extraction_targets:
    - "experiments/chat_extraction_poc/data/calculator_targets_compact.json"
    - "experiments/chat_extraction_poc/data/target_aliases_ru.yaml"

review_parameters:
  - key: total_concrete_volume_from_spec_m3
    label_ru: "Бетон плиты перекрытия 1-го этажа, общий объем по спецификации"
    unit: "м3"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_concrete_volume"
    calculator_input_path: "geometry.total_concrete_volume_from_spec_m3"
    normalized_json_path: "sections.floor_slab_1.parameters.total_concrete_volume_from_spec_m3.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_concrete_volume"]
      aliases_ru: ["бетон плиты перекрытия 1 этажа", "бетон ж/б плиты перекрытия", "бетон перекрытия"]
      expected_unit: "м3"
      notes: "Total concrete from slab specification before beam subtraction inside calculator."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте общий объем бетона плиты перекрытия 1-го этажа по спецификации."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Do not confuse with lintel, foundation, roof, or 2nd floor slab concrete."

  - key: kind
    label_ru: "Тип плиты — жилое перекрытие или кровельная плита"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_kind"
    calculator_input_path: ""
    normalized_json_path: "sections.floor_slab_1.parameters.kind.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_kind"]
      aliases_ru: ["Плоская Ж/б, неэксплуатируемая", "Плоская Ж/б, эксплуатируемая"]
      expected_unit: ""
      notes: "roof_cover_slab when general data describes this slab as part of the roof build-up (e.g. 'Плоская Ж/б, неэксплуатируемая, согласно КР-2'); otherwise residential_floor."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Чисто описательное поле, не влияет на расчёт. Укажите, если общие данные явно называют эту плиту частью кровельного пирога (неэксплуатируемая плоская Ж/б и т.п.), а не жилым перекрытием."
    validation: {numeric: false}
    notes: "Added 2026-07-26 (real project case). Purely descriptive — calculator_input_path intentionally empty, never gates pricing/calculation. This slab still occupies the floor_slab_1 pipeline slot and is calculated there as usual regardless of this value. Do not confuse this slab's own PDF label (e.g. ПМ1) with roof zone identifiers used in flat_roof's roof_zones — those must come from the roof's own specification sheet, a separate labeling system even when it covers the same physical area."

  - key: slab_zones
    label_ru: "Объём бетона по зонам плиты перекрытия 1-го этажа (альтернатива единому объёму)"
    unit: ""
    source_class: AUTO_PROJECT
    required: false
    review_sheet: "01_Проверка проекта"
    target_code: "slab_zones"
    calculator_input_path: "slab_zones"
    normalized_json_path: "sections.floor_slab_1.parameters.slab_zones.rows"
    value_kind: repeated_rows
    row_key_field: context
    production_input: false
    item_label_columns: [context]
    correction_columns: [concrete_volume_m3]
    columns:
      - {key: context, label_ru: "Зона плиты (по PDF)", unit: "", value_kind: string}
      - {key: concrete_volume_m3, label_ru: "Бетон", unit: "м3", value_kind: number}
    parser_mapping:
      target_codes: ["slab_zones"]
      aliases_ru: []
      expected_unit: ""
      notes: "NOT YET part of the live extraction prompt — added 2026-07-20 only as a calculator-side + contract-side alternative input. Use when the PDF splits the slab's concrete into multiple zones with no combined total (real ТРЦ case: main slab 25.337 + kitchen/dining slab 5.975 m3, no printed sum). Same shape as foundation_slab's slab_zones."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "not_required"
      action_ru: "Необязательная альтернатива total_concrete_volume_from_spec_m3 выше. Используйте, если PDF даёт бетон плиты несколькими зонами без общего итога — иначе оставьте пустым."
    mirror_to_details_sheet: true
    mirror_notes: "Same rows shown read-only on 03_Детали объемов."
    validation: {numeric: false}
    notes: "Added 2026-07-20 (UNIVERSALIZATION_PLAN.md P1, slab_zones[]). Purely additive — when empty/absent, calculator behavior is byte-identical to before (all 9 pre-existing floor_slab_1_calculator regression cases unaffected, verified). When non-empty, its sum OVERRIDES total_concrete_volume_from_spec_m3 above for this run (same convention as foundation_slab's slab_zones and load_bearing_walls_lintels' wall_block_items). Unlike foundation_slab, this calculator has no dataclass/validate() layer — the override and per-zone validation happen as plain checks inside calculate_floor_slab_1() itself. See p1_slab_zones_shipped memory."

  - key: slab_thickness_m
    label_ru: "Толщина плиты перекрытия 1-го этажа"
    unit: "м"
    source_class: AUTO_PROJECT
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_slab_thickness"
    calculator_input_path: "geometry.slab_thickness_m"
    normalized_json_path: "sections.floor_slab_1.parameters.slab_thickness_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_slab_thickness"]
      aliases_ru: ["толщина плиты перекрытия 1 этажа", "плита перекрытия 180 мм", "h плиты перекрытия"]
      expected_unit: "м"
      notes: "Normalize mm to m."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "manual_required"
      action_ru: "Проверьте толщину плиты перекрытия 1-го этажа."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Used as control/fallback; production formwork areas still come from spec."

  - key: edge_formwork_height_m
    label_ru: "Высота торцевой опалубки плиты перекрытия 1-го этажа"
    unit: "м"
    source_class: AUTO_CALCULATED
    required: true
    review_sheet: "01_Проверка проекта"
    target_code: "floor_slab_1_edge_formwork_height"
    calculator_input_path: "geometry.edge_formwork_height_m"
    normalized_json_path: "sections.floor_slab_1.parameters.edge_formwork_height_m.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_slab_thickness"]
      aliases_ru: ["высота торцевой опалубки", "высота опалубки торца плиты", "толщина плиты перекрытия"]
      expected_unit: "м"
      notes: "Control geometry only. Adapter should normally use slab_thickness_m; do not ask GPT for a separate production target and do not hardcode a project value."
    review_behavior:
      show_to_user: true
      allow_manual_override: true
      status_if_missing: "auto_calculated"
      action_ru: "Проверьте высоту торцевой опалубки; если отдельной строки нет, она принимается равной толщине плиты для контрольного расчета."
    validation: {numeric: true, min_value: 0, max_value: null}
    notes: "Calculator currently requires geometry.edge_formwork_height_m for a control formula even in spec_formwork_areas mode. Production source for paid formwork remains the spec areas."


  - key: slab_edge_perimeter_m
