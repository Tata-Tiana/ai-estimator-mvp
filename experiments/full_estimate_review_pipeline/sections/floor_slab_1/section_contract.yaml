    normalized_json_path: "sections.floor_slab_1.parameters.main_formwork_area_m2.value"
    value_kind: scalar
    parser_mapping:
      target_codes: ["floor_slab_1_under_slab_formwork_area"]
      aliases_ru: ["опалубка под плитой", "площадь опалубки под плитой", "горизонтальная опалубка перекрытия"]
      expected_unit: "м2"
      notes: "Main deck/under-slab formwork area."
