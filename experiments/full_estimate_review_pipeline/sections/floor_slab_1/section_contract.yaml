  - code: slab_formwork_installation_control
    name_ru: "Монтаж опалубки под монолитное перекрытие 1-го этажа"
    unit: "м2"
    enabled_by_default: true
    line_role: zero_control_line
    calculator_result_path: "estimate_lines[code=slab_formwork_installation_control]"
    quantity:
      formula: "main_formwork_area_m2"
      leaf_inputs:
        - {ref: "review_parameters.main_formwork_area_m2", source_class: AUTO_PROJECT}
    prices: {material_unit_price_key: null, work_unit_price_key: null, fixed_amount_key: null}
    validation: {formula_ready_required: true, excel_formula_exportable: true}
    notes: "Zero control/client line from calculator."

  - code: formwork_set_rental_material
    name_ru: "Комплект опалубки перекрытия"
    unit: "м2"
    enabled_by_default: true
    calculator_result_path: "estimate_lines[code=formwork_set_rental_material]"
