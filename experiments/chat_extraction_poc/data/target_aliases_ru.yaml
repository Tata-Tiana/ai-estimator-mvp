  unit_column_hint: ["м.п.", "п.м.", "м/п", "мп"]
  notes: "Use this field INSTEAD OF thermal_insert_50_length/thermal_insert_100_length ONLY when the PDF gives ONE shared installation length for the whole thermal-insert node, not two separate lengths per thickness. This normally means a combined 50mm+100mm thermal insert; do not use it for a clearly single-layer 100mm row, which belongs to thermal_insert_100_length if it has its own length. Material targets are unaffected — they stay split by thickness when PDF gives them. Do NOT copy the same combined number into both thermal_insert_50_length and thermal_insert_100_length. If the PDF genuinely gives two distinct lengths, one per thickness, use the scalar targets above and leave this field empty. If there are no thermal inserts, leave it empty/missing. Do not confuse thermal inserts with regular slab edge/side insulation."

