  notes: "Added 2026-07-26 (Elena, ТРЦ review). LIVE group — wired into flat_roof_calculator/calculator.py (roof_geometry_calc_method: roof_zones). Use this instead of roof_area_level_1/2 (and the matching parapet/wall-abutment level_1/2 targets) whenever the roof spec splits into more than two zones by floor and/or type — e.g. 1 этаж Тип1, 1 этаж Тип2, 2 этаж Тип2, кровля лестницы. Return each zone as its own row: context (zone label exactly as printed, e.g. '1 этаж, Тип1 (эксплуатируемая)'), area_m2, parapet_length_m, wall_abutment_length_m (omit the length fields for a zone if the PDF genuinely gives none for it — e.g. a staircase roof may have no wall-abutment row), operability. The calculator sums area_m2 across all rows into the total roof area, and sums parapet_length_m+wall_abutment_length_m across all rows into the combined parapet-and-abutment length — works for any zone count. operability drives membrane brand: 'exploitable' ONLY when the sheet explicitly labels the zone 'эксплуатируемая' — every other case (explicitly 'неэксплуатируемая', or no operability label given at all) is 'non_exploitable' (V-RP); 'exploitable' zones get V-GR membrane instead. Default to 'non_exploitable' when unsure, don't guess exploitable. If the PDF gives one ready combined figure for the whole roof instead, use the scalar level_1/level_2 (or project_spec_roof_area) targets as before and leave this group empty — don't duplicate.

Added 2026-07-26 (real project case): a roof plan/spec page can carry its own zone labeling system (e.g. 'Тип А' + elevation mark) that is completely separate from any ПМ1/ПМ2-style slab identifiers used on a different page (masonry/slab plan) for the underlying floor_slab_1/floor_slab_2 structure — even though the roof sits at a slightly different elevation than the slab it covers (roof build-up adds thickness). Always take the zone `context` from the ROOF's own specification sheet, never from a slab/masonry plan's ПМ1/ПМ2 labeling, even if both refer to physically the same area of the building — they are different naming systems for different purposes (slab identity vs. roof material zone), do not merge or substitute one for the other."

