  unit_column_hint: ["м3", "м³"]
  notes: "Use this group instead of pit_area_m2*pit_excavation_depth_m ONLY when the spec gives ready excavation volume totals directly (e.g. 'Объем выемки грунта котлована 185,0м3' + 'Объем выемки грунта приямков подпятников 27,5м3'). context — as printed in the PDF (e.g. 'Котлован', 'Приямки подпятников'). This is an active field: the sum of all rows' volume_m3 replaces the area*depth calculation for excavator shifts. If the PDF gives only area and depth with no ready volume, leave this group empty and use the scalar fields as before."

