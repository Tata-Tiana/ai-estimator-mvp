_meta:
  purpose: "A6.4 universal Russian aliases for mapping PDF table rows to calculator target codes in chat extraction."
  rules:
    - "Use this dictionary after extracting raw_table_rows from the PDF."
    - "Do not map a target_code by English/internal name alone."
    - "Do not use project-specific values, page numbers, or known benchmark answers."
    - "If aliases match more than one target, keep candidates and set needs_review=true."
    - "expected_unit is mandatory: do not map m3 material volume to m2 formwork area."

