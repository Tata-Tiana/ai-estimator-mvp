  expected_unit: null
  table_hints: ["Схема расположения шахт вентканалов", "СПЕЦИФИКАЦИЯ МАТЕРИАЛОВ НА УСТРОЙСТВО ВЕНТКАНАЛОВ"]
  required_context: ["вентканал|шахт", "газобетон|блок"]
  negative_context: ["600х150х250", "обкладка дымохода", "несущие стены", "парапет"]
