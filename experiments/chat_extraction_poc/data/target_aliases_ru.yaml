thermal_insert_50_length:
  section_code: foundation_slab
  ru_label: "Длина термовставок 50 мм"
  pdf_aliases: ["Термовставка 50 мм", "Термовставки 50мм", "Длина термовставок 50", "Термовкладыш 50 мм"]
  expected_unit: linear_m
  table_hints: ["План термовставок", "Спецификация термовставок"]
  required_context: ["термовстав|термовкладыш", "50"]
  negative_context: ["100 мм", "м3", "объем", "материал"]
  value_column_hint: ["длина", "кол-во", "количество"]
  unit_column_hint: ["м.п.", "п.м.", "м/п", "мп"]
  notes: "Optional length for work quantity, not material volume. Use ONLY when the PDF gives an actual 50mm thermal-insert layer with its OWN separate length, distinct from the 100mm layer. If the project has only 100mm thermal inserts, leave this field empty. If the project has no thermal inserts, leave all thermal_insert_* targets empty/missing; do not invent zero found values. If the PDF gives one shared length for both layers together (not two separate lengths), use thermal_insert_combined_length_m instead. Do not copy the same combined number into both this field and thermal_insert_100_length — that double-counts installation work. Do not confuse thermal inserts with regular slab edge/side insulation."

