  section_code: schiedel_vent_channels
  ru_label: "Общая длина кладки вентканалов Schiedel"
  pdf_aliases: ["Общая длина кладки вентканалов", "Общая высота вентканалов", "Кладку вентблока вести", "Высота вентканалов общая"]
  expected_unit: linear_m
  table_hints: ["Разрез по вентканалам", "Спецификация вентиляционных каналов"]
  required_context: ["вентканал|VENT|ВК", "кладк|длина|высот"]
  negative_context: ["газобетон", "обкладка", "шт", "количество"]
  value_column_hint: ["длина", "высота", "кол-во", "количество"]
  unit_column_hint: ["м", "м.п.", "п.м."]
  notes: "Primary required quantity for schiedel_masonry_work, the section's single most important target and the ONLY payable quantity for the work regardless of channel product-type mix ('работа одна' — it's one single payable operation). If the PDF gives a ready total row like 'Общая высота вентканалов'/'Высота вентканалов общая'/'Общая длина кладки вентканалов' in м.п./м.пог, map that value here even if the word Schiedel is not printed on the sheet. If other linear rows by channel type do not sum to this ready total, do NOT leave this target missing: keep the ready total here with needs_review=true and explain the contradiction in notes. Do not track individual shaft height/count at all ('не надо считать шахты, это не важно') — if the PDF gives only separate per-shaft heights with no ready total, summing them yourself is still wrong; keep candidates and flag needs_review instead."

schiedel_channel_items:
  section_code: schiedel_vent_channels
  ru_label: "Вентканалы Schiedel по типам — количество модулей"
  pdf_aliases: ["Schiedel VENT 1", "Schiedel VENT 2", "Schiedel VENT 3", "Schiedel VENT 4", "1 хода", "2 хода", "3 хода", "4 ход", "CVENT", "Спецификация вентиляционных каналов"]
  expected_unit: pcs
  table_hints: ["Разрез по вентканалам", "Спецификация вентиляционных каналов", "Ведомость вентканалов Schiedel"]
  required_context: ["Schiedel|VENT|вентканал"]
  negative_context: ["газобетон", "обкладка", "несущие стены", "высота вентканалов общая"]
  value_column_hint: ["кол-во", "количество"]
  unit_column_hint: ["шт", "шт."]
  notes: "This is the active field for channel counts — do not use per-shaft height/count tracking, only module/product count matters. Return each product-type row as {product_type, quantity_pcs}: product_type must be exactly one of '1x'/'2x'/'3x'/'4x'/'cvent' (map 'Schiedel VENT 1'/'1 хода' etc. to '1x', and so on; 'CVENT' — a distinct, fairly rare Schiedel product line — maps to 'cvent'). quantity_pcs is the piece/module count from the specification — this is materially different from any shaft/node count shown on the plan (a plan may show only one shaft symbol while the spec gives dozens of modules for it — the modules are what matters, never the shaft count). Brand is ALWAYS Schiedel for this section, even when the PDF's drawings never print the word 'Schiedel' anywhere (confirmed against a real project where this happens but the delivered smeta still bills Schiedel product codes) — do not invent a generic/brandless variant. If the PDF does not give a ready piece count in шт at all (e.g. only linear meters per channel type like '2,0 м.пог') — do not convert meters to pieces, do not guess, and do not silently drop the section either; anything not given in шт is manual entry for the estimator. Concretely: (1) leave the schiedel_channel_items group itself empty for these rows, (2) but still add one explicit needs_review entry PER product_type found (not one combined entry covering every type - real case, 2026-09-02: PDF gave 2 channel types without piece counts (3x and 4x), and the real delivered smeta had two DIFFERENT piece counts for them, 7 and 11 - one merged entry cannot carry two different numbers, the estimator has nowhere to put the second value). Each such entry needs target_code/group_code='schiedel_channel_items', its own product_type filled in (quantity_pcs still null), that type's own linear-meter value quoted verbatim in notes, and 'дано в метрах, не в штуках — нужен ручной ввод количества' stated plainly. If only one channel type was found without a piece count, this is still just one entry, with that one product_type. A needs_review flag buried only inside raw_table_rows notes is not enough — it must also appear as its own entry in the section's needs_review list, otherwise the estimator never sees it."

