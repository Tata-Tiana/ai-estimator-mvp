_meta:
  purpose: "A6.4 universal Russian aliases for mapping PDF table rows to calculator target codes in chat extraction."
  rules:
    - "Use this dictionary after extracting raw_table_rows from the PDF."
    - "Do not map a target_code by English/internal name alone."
    - "Do not use project-specific values, page numbers, or known benchmark answers."
    - "If aliases match more than one target, keep candidates and set needs_review=true."
    - "expected_unit is mandatory: do not map m3 material volume to m2 formwork area."

earthworks:
  section_code: earthworks
  ru_label: "Земляные работы"
  pdf_aliases: ["земляные работы", "план котлована", "схема коммуникаций", "траншеи коммуникаций"]
  expected_unit: null
  table_hints: ["план котлована", "ведомость объемов", "экспликация траншей", "спецификация коммуникаций"]
  required_context: ["котлован|транше|песок|геотекстил|PLANTER|коммуникац|труба"]
  negative_context: ["кровля", "перекрытие", "перемычки"]
  value_column_hint: ["кол-во", "количество", "объем", "площадь", "длина"]
  unit_column_hint: ["ед. изм.", "ед.", "м3", "м2", "м.п.", "шт"]
  notes: "Section header only; use child target codes for values."

