floor_slab_zones:
  section_code: floor_slabs
  ru_label: "Плиты перекрытия/покрытия по физическим зонам"
  pdf_aliases: ["плита перекрытия", "плита покрытия", "ПМ1", "ПМ2", "плита второго света", "плита лестницы", "плита кухни", "плита гостиной", "ж/б плита", "монолитная плита", "спецификация материалов на устройство плиты", "горизонтальная опалубка под плиту перекрытия", "горизонтальная опалубка под ж/б балку", "вертикальные поверхности плиты и ж/б балок", "бетон балки в теле плиты перекрытия"]
  expected_unit: null
  table_hints: ["Спецификация материалов на устройство плиты", "Спецификация расхода материала на Ж/Б плиту перекрытия", "Ведомость горизонтальных поверхностей плиты перекрытия под устройство опалубки", "Ведомость вертикальных поверхностей плиты перекрытия", "План плиты перекрытия", "Плита покрытия стен", "Схема утепления плиты", "Опалубочные работы плита перекрытия"]
  required_context: ["плит|перекрыти|покрыти|ПМ"]
  negative_context: ["фундаментная плита", "кровля LOGICROOF", "мембрана кровли", "стены", "перемычк"]
  value_column_hint: ["объем", "объём", "площадь", "длина", "периметр", "кол-во", "количество"]
  unit_column_hint: ["м3", "м³", "м2", "м²", "мп", "м.п.", "м.пог", "шт"]
  notes: "Use for every above-grade physical slab/pour. Create one floor_slab_zones row per physical slab/zone. Do not include foundation slab here. Do not include roof membrane zones here; flat_roof has roof_zones. slab_thickness_m (a real calculator input, not just descriptive): the slab's own thickness, usually printed in the concrete spec row itself ('...толщиной 200мм' -> 0.2); do not leave blank when stated. slab_edge_perimeter_m: control-only outer edge length; if no separate row gives it, the matching floor_slab_eps_items role=slab_edge row's length_m is normally the same physical value. Formwork fields (all real calculator inputs, not descriptive): a project's 'Опалубочные работы плита перекрытия' sheet usually gives a 'Ведомость горизонтальных поверхностей ... под устройство опалубки' table with two separate rows — 'Горизонтальная опалубка под плиту перекрытия' (the slab's own bottom formwork) goes to formwork_under_slab_area_m2, and 'Горизонтальная опалубка под ж/б балку' (one combined total covering every beam's bottom formwork together, not split per beam mark) goes to formwork_beams_bottom_area_m2 — do not skip this second row just because it's small or combined across all beams, and do not try to split it per beam_id, it genuinely is one number for the whole zone. Separately, a 'Ведомость вертикальных поверхностей' table gives vertical/side formwork: if it lists the slab edge and the beams' side surfaces as one inseparable combined row (e.g. 'Вертикальные поверхности плиты и ж/б балок'), put that single number in formwork_edge_and_beam_combined_area_m2 with needs_review=true and leave formwork_edge_area_m2/formwork_beams_side_area_m2 empty; only use those two separate fields if the PDF genuinely splits slab-edge and beam-side vertical formwork into their own rows. beams_concrete_volume_m3 (real input, not diagnostic): a 'СПЕЦИФИКАЦИЯ РАСХОДА МАТЕРИАЛА НА...ПЛИТУ ПЕРЕКРЫТИЯ' sheet usually has a ready row like 'Бетон B-22,5 (балки в теле плиты перекрытия)' with a single total volume for all beams of that zone combined - fill this field from that row whenever it exists. This ready spec total ALWAYS wins over summing floor_slab_beam_items' own length*width*height (Prompt rule 25, spec priority) - individual beam cross-sections on a crowded plan/isometric drawing are easy to misread, confirmed on a real project where one beam's height was misread and the per-beam sum came out roughly 3x the real spec-table total. Do not silently keep the calculated per-beam sum when a ready spec total conflicts with it, and do not average/reconcile the two numbers - the spec-table total wins outright, note the conflict in the row's own notes field instead. beams_eps_material_area_m2 (same spec-priority pattern, applied to beam EPS insulation): use it ONLY when the PDF gives one combined insulation area covering several beams at once with no way to attribute it to individual beam marks (real case: two beams sharing one '1,62м2' area on a 'Схема утепления плиты' drawing) - fill this zone-level field instead of guessing a split. When the PDF gives a separate insulation area for each beam mark instead, put those on floor_slab_beam_items' own insulation_area_m2 field and leave this zone-level field null - never fill both for the same beams."

