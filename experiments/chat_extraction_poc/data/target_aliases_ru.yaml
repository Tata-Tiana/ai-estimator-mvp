  value_column_hint: ["длина", "глубина", "ширина", "объем", "маршрут"]
  unit_column_hint: ["м", "м.п.", "м3"]
  notes: "Extract as raw_table_rows and group items. Use route_code for the visible route id (К1, К2, Вода, Эл. кабель); name may repeat route_code or preserve a longer label. Do not calculate missing route values unless explicitly shown. If the table gives a ready volume_m3 column, fill it even if it disagrees with length*depth*width — the given value always wins over recomputed geometry. depth_reference: if the table has a second depth row measured from a different reference point (e.g. 'Глубина от дна котлована' next to a regular 'Глубина'), capture it here as free text ('0,4 м от дна котлована') — context only for the service memo, never used in any calculation, never a replacement for the regular depth_m."

