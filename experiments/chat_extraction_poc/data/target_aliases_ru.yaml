  section_code: foundation_slab
  ru_label: "Длина термовставок, общая на оба слоя ЭППС"
  pdf_aliases: ["Длина термовставок", "Термовставки длина", "Термовкладыш длина", "Общая длина термовставок"]
  expected_unit: linear_m
