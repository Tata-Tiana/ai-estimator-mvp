  ru_label: "Сырые строки спецификации кровли"
  pdf_aliases: ["Спецификация к плану кровли", "Ведомость материалов кровли"]
  expected_unit: null
  table_hints: ["Спецификация к плану кровли"]
  required_context: ["кровл", "спецификац|ведомост"]
  negative_context: ["фундамент", "перекрытие"]
  value_column_hint: ["наименование", "кол-во", "количество", "ед"]
  unit_column_hint: ["м2", "м3", "м.п.", "шт"]
  notes: "2026-08-24: no longer diagnostic-only. Most calculator quantities still come from the reviewed scalar geometry/count inputs above, but the calculator now gives the V-GR membrane row here (name contains 'V-GR', unit m2) priority over the roof_zones-geometry estimate for that one line - these rows are the project's own supplier/installer-quoted numbers (often flagged 'Уточнить у монтажной организации' in the PDF itself), not a simple area+perimeter formula. Still capture every row here as before; do not skip this table."

roof_screed_items:
  section_code: flat_roof
  ru_label: "Стяжка ЦСП под эксплуатируемой кровлей (опционально)"
  pdf_aliases: ["Сборная стяжка из двух листов АЦЛ (ЦСП)", "Стяжка из листов ЦСП", "Стяжка ЦСП", "АЦЛ (ЦСП)"]
  expected_unit: m2
  table_hints: ["Спецификация к плану кровли", "СПЕЦИФИКАЦИЯ РАСХОДА МАТЕРИАЛА НА УСТРОЙСТВО КРОВЛИ"]
  required_context: ["ЦСП|стяжк|АЦЛ", "кровл"]
  negative_context: ["фундамент", "перекрытие", "перегородк"]
  value_column_hint: ["кол-во", "количество"]
  unit_column_hint: ["м2", "м²"]
  notes: "Added 2026-08-24 - not every project has this (only projects with a walkable/exploitable roof zone built up on a ЦСП screed, e.g. under terrace decking/tile). Only search for it when roof_zones has a row with operability='exploitable' - that is normally the only zone with a screed. The spec-table row usually reads like 'Сборная стяжка из двух листов АЦЛ (ЦСП) 21.28м² 2шт' - the number before 'м²' is the AREA OF ONE LAYER (use this, not the м² x 2шт total that some spec tables print separately as the combined material quantity for the row's own Кол-во column). Return one row per exploitable zone: zone_context (match the exact roof_zones[].context string it belongs to) and area_m2 (one-layer area, normally equal to that zone's roof_zones[].area_m2 - if they differ, prefer the screed spec row's own number and flag needs_review). Leave this group entirely empty when the project has no exploitable/walkable roof zone or no ЦСП screed mentioned anywhere - do not invent a row."

