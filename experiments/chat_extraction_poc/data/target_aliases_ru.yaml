  ru_label: "Маршруты траншей и коммуникаций"
  pdf_aliases: ["К1", "К2", "К3", "В1", "Вода", "Эл. кабель", "Дренаж", "Траншея", "Трасса коммуникаций"]
  expected_unit: null
  table_hints: ["План котлована", "Таблица траншей", "Схема коммуникаций"]
  required_context: ["транше|трасс|длина|глубина|объем"]
