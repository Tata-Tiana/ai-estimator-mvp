  notes: "Added 2026-07-24 (Elena, ТРЦ/АРК review). LIVE group — wired into load_bearing_walls_lintels_calculator.py (calculator_input_path: wall_block_items). Use this instead of floor_2_masonry_volume/parapet_masonry_volume/parapet_gas_block_d500_250_volume whenever the spec gives masonry volume for that role split across several rows (D400+D500 for the same role, e.g. floor 2 внутренние/наружные стены, or several levels/zones like парапет 1-й/2-й этаж or ПМ1/ПМ2) with no ready combined total. wall_role: main_walls/floor_2/parapet/partitions — the structural role, not the block width. block_density: D400 or D500 for the normal case, required for every role except partitions (partitions volume is captured but not yet priced). Rows with the same wall_role+block_density are summed automatically by the calculator — return each PDF row as its own item, do not pre-sum them yourself. Only main_walls, floor_2, and parapet have a priced material path for both D400 and D500 today. Updated 2026-07-28 (Elena: rare non-D400/D500 blocks do occur, but very rarely): if the spec genuinely gives a different density/size (e.g. 'D350' or a size other than 600x400x250/600x250x250) for main_walls/floor_2/parapet, still record it with that literal block_density (and block_size) AND also fill material_unit_price on that same row from the project's own smeta/price data if available — the calculator will price it directly from that value. If no price is available anywhere in the project's own materials, leave material_unit_price empty and flag needs_review; the calculator will reject the run loudly rather than silently drop the volume, which is expected until a price is supplied manually. If the spec gives one ready combined figure for the whole role, use the matching scalar target as before and leave this group empty for that role — don't duplicate.

Added 2026-07-26 (real project case): a PDF can label an extra masonry zone above the 1st-floor main walls as 'Стены надстройки' / 'Стены второго света' / 'Второй свет' (an intermediate volume between two elevation marks, e.g. between +3,730 and +4,980) instead of literally saying '2 этаж' — this is still wall_role: floor_2, not a new role. Do not invent a separate role like 'second_light_walls' for it — the existing floor_2 role plus the same-role summing mechanism already covers any number of these extra zones. Likewise, when parapet appears at multiple separate elevation levels (e.g. ПМ1 and ПМ2, each with its own spec sheet/table), each level is still wall_role: parapet, just another row — do not invent parapet_level_1/parapet_level_2 roles."

